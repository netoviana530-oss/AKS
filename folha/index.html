<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folha AKS — Cálculo de Folha e Contracheque</title>
<style>
:root{--navy:#071633;--blue:#0b3d91;--blue2:#1d63e0;--red:#e5383b;--yel:#ffc928;--bg:#eef2f8;--ink:#0f1b33;--mut:#667085;--bd:#e3e8f1;--ok:#0a7f4f;--bad:#b42318;--sh:0 10px 30px rgba(7,22,51,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;color:var(--ink);background:var(--bg) radial-gradient(circle at 1px 1px,rgba(11,61,145,.07) 1px,transparent 0) 0 0/22px 22px;padding-bottom:calc(88px + env(safe-area-inset-bottom));min-height:100vh}
body::before{content:"";position:fixed;left:0;right:0;bottom:0;height:75vh;background:var(--wm) no-repeat center bottom/min(1150px,160vw) auto;pointer-events:none;z-index:0}
header{position:sticky;top:0;z-index:6;color:#fff;padding:14px 16px 17px;display:flex;align-items:center;gap:12px;background:var(--wmh) no-repeat right -30px center/auto 170%,linear-gradient(120deg,#06122b,#0b3d91 68%,#1d63e0);box-shadow:0 8px 24px rgba(7,22,51,.28)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#1d63e0 0 33.3%,#e5383b 33.3% 66.6%,#ffc928 66.6%)}
header img{height:44px;max-width:96px;object-fit:contain;background:#fff;border-radius:12px;padding:3px 5px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
header h1{font-size:19px;margin:0;white-space:nowrap;letter-spacing:.2px;font-weight:800}
header small{display:block;opacity:.78;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.hcomp{margin-left:auto;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;justify-content:space-around;gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border-top:1px solid var(--bd);box-shadow:0 -8px 24px rgba(7,22,51,.06)}
nav button{flex:1;max-width:120px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px/1 inherit;color:var(--mut);padding:8px 2px;border-radius:14px;cursor:pointer;transition:.15s}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--blue);background:rgba(29,99,224,.11)}
main{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:16px 14px}
.card{background:rgba(255,255,255,.88);border:1px solid rgba(227,232,241,.9);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:var(--sh);animation:rise .35s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h3{font-size:16px}
.hero{background:linear-gradient(135deg,#071633,#0b3d91 70%,#1d63e0);color:#fff;border:0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,201,40,.45),transparent 65%)}
.hero .eyebrow{font-size:12px;opacity:.75;text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.hero .big{font-size:26px;font-weight:800;margin:2px 0 10px}
.hero label{color:rgba(255,255,255,.75)}
.hero input,.hero select{background:rgba(255,255,255,.96)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>*{flex:1;min-width:130px}
label{display:block;font-size:11.5px;color:var(--mut);font-weight:700;margin-bottom:4px;letter-spacing:.2px}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:12px;font:inherit;background:#fff;transition:.15s;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue2);box-shadow:0 0 0 4px rgba(29,99,224,.15)}
input[type=checkbox]{width:auto}
button.b{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;box-shadow:0 6px 14px rgba(11,61,145,.28);transition:transform .12s,box-shadow .12s}
button.b:active{transform:scale(.97)}
button.b.s{background:#fff;color:var(--blue);border:1.5px solid rgba(11,61,145,.3);box-shadow:none}
button.b.d{background:linear-gradient(135deg,#ef5350,#b42318);box-shadow:0 6px 14px rgba(180,35,24,.25)}
.emp{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:11px 0;border-bottom:1px solid var(--bd)}
.emp:last-child{border:0}
.emp .mid{flex:1;min-width:150px}
.emp .acts{display:flex;gap:8px}
@media(max-width:560px){.emp .acts{width:100%}.emp .acts .b{flex:1}}.emp b{display:block}.emp span{color:var(--mut);font-size:13px}
.av{flex:none;width:42px;height:42px;border-radius:14px;color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px;box-shadow:0 4px 10px rgba(7,22,51,.18)}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#e8f0ff;color:var(--blue);margin-right:4px}
.kpis.card{background:none;border:0;box-shadow:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:rgba(255,255,255,.95);border-radius:16px;padding:12px 12px 12px 14px;box-shadow:var(--sh);border-left:5px solid var(--blue2);animation:rise .4s both}
.kpi:nth-child(2){border-color:var(--red)}.kpi:nth-child(3){border-color:#12a150}.kpi:nth-child(4){border-color:var(--yel)}.kpi:nth-child(5){border-color:#7c3aed}.kpi:nth-child(6){border-color:var(--navy)}
.kpi small{color:var(--mut);display:block;font-size:11.5px;font-weight:600}
.kpi b{font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.ovl{position:fixed;inset:0;background:rgba(6,18,43,.55);backdrop-filter:blur(6px);z-index:20;overflow:auto;padding:12px}
.sheet{background:#fff;max-width:780px;margin:16px auto;border-radius:22px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:rise .3s both}
.hint{font-size:12px;color:var(--mut)}
table.pt{width:100%;border-collapse:collapse;font-size:13px}
table.pt th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
table.pt td,table.pt th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left}
table.pt tr:nth-child(even) td{background:rgba(238,242,248,.5)}
table.pt td.r,table.pt th.r{text-align:right;font-variant-numeric:tabular-nums}
/* contracheque */
.slip{position:relative;border:1.5px solid #0f1b33;border-radius:8px;padding:16px 12px 12px;font-size:12px;color:#000;background:#fff var(--wms) no-repeat center 64%/80% auto;margin-bottom:14px;page-break-inside:avoid;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.slip::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#1d63e0 0 33.3%,#e5383b 33.3% 66.6%,#ffc928 66.6%)}
.slip .top{display:flex;gap:12px;align-items:center;border-bottom:1.5px solid #0f1b33;padding-bottom:9px}
.slip .top img{max-height:62px;max-width:130px;object-fit:contain}
.slip .top h2{margin:0;font-size:15px;color:#071633}.slip .top div{flex:1}
.slip .tit{text-align:center;font-weight:800;margin:9px 0;letter-spacing:.6px;color:#0b3d91}
.slip .box{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;border:1px solid #0f1b33;border-radius:6px;padding:7px;margin-bottom:9px;background:rgba(238,242,248,.7)}
.slip table{width:100%;border-collapse:collapse;table-layout:fixed}
.slip td{word-break:break-word}
.slip th:nth-child(1){width:11%!important}.slip th:nth-child(3){width:15%!important}.slip th:nth-child(4),.slip th:nth-child(5){width:19%!important}
@media(max-width:560px){.sheet{padding:12px;margin:8px auto}.slip{font-size:11px;padding:14px 8px 10px}.slip th{font-size:9.5px;padding:3px 2px}.slip td{padding:2px 3px}.slip .box{grid-template-columns:1fr}.slip .liq{font-size:13px}}
.slip th{background:#0b3d91;color:#fff;border:1px solid #0b3d91;padding:4px 5px;font-size:11px}
.slip td{border-left:1px solid #9aa7bd;border-right:1px solid #9aa7bd;padding:2.5px 5px}
.slip td.r{text-align:right}
.slip tr.tot td{border:1px solid #0f1b33;font-weight:800;background:rgba(238,242,248,.85)}
.slip .liq{display:flex;justify-content:space-between;border-radius:8px;padding:9px 12px;margin:9px 0;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(120deg,#071633,#0b3d91);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.slip .bases{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border:1px solid #0f1b33;border-radius:6px;padding:6px;font-size:11px;background:rgba(238,242,248,.7)}
.slip .ass{margin-top:28px;display:flex;gap:22px;font-size:11px}.slip .ass div{flex:1;border-top:1px solid #0f1b33;padding-top:3px;text-align:center}
#printArea{display:none}
@media print{body{background:#fff}body::before{display:none}header,nav,main,.ovl{display:none!important}#printArea{display:block}.slip{margin:0 0 8mm}}
</style>
</head>
<body>
<header><img id="hlogo" alt="" style="display:none"><div style="min-width:0"><h1>Folha AKS</h1><small id="hsub">Cálculo de folha e contracheque</small></div><div class="hcomp" id="hcomp"></div></header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="ovl"></div>
<div id="printArea"></div>

<script id="engine">
/* ===== MOTOR DE CÁLCULO (puro, sem DOM) ===== */
const DEF_PARAMS={
  ano:2026,salMin:1621.00,inssTeto:8475.55,
  inss:[[1621.00,0.075],[2902.84,0.09],[4354.27,0.12],[8475.55,0.14]],
  irrf:[[2428.80,0,0],[2826.65,0.075,182.16],[3751.05,0.15,394.16],[4664.68,0.225,675.49],[1e12,0.275,908.73]],
  depIR:189.59,simpl:607.20,redAte:5000,redAte2:7350,redA:978.62,redB:0.133145,
  sfValor:62.04,sfLimite:1819.26,fgts:0.08,fgtsAprendiz:0.02,patronal:0.20,rat:0.03,fap:1,terceiros:0.058,vtPerc:0.06,peric:0.30,divHora:220
};
const R2=n=>Math.round((n+Number.EPSILON)*100)/100;
const N=x=>{x=parseFloat(String(x).replace(',','.'));return isFinite(x)?x:0};
function calcINSS(base,P){base=Math.min(Math.max(base,0),P.inssTeto);let prev=0,t=0;for(const [lim,al] of P.inss){if(base>prev)t+=(Math.min(base,lim)-prev)*al;prev=lim}return R2(t)}
function calcIRRF(rend,inss,deps,pensao,P){
  const legal=inss+deps*P.depIR+pensao;const usouSimpl=P.simpl>legal;const ded=Math.max(legal,P.simpl);
  const base=Math.max(0,R2(rend-ded));let imp=0;
  for(const [lim,al,pd] of P.irrf){if(base<=lim){imp=base*al-pd;break}}
  imp=Math.max(0,imp);let red=0;
  if(rend<=P.redAte)red=imp;else if(rend<=P.redAte2)red=Math.max(0,P.redA-P.redB*rend);
  red=Math.min(red,imp);
  return{valor:R2(imp-red),base,usouSimpl,reducao:R2(red),bruto:R2(imp)}
}
function avosAuto(admissao,comp){ // meses com >=15 dias trabalhados no ano da competência
  const ano=+comp.slice(0,4);if(!admissao)return 12;const [y,m,d]=admissao.split('-').map(Number);
  if(y<ano)return 12;if(y>ano)return 0;const dim=new Date(y,m,0).getDate();
  return (12-m)+((dim-d+1)>=15?1:0)
}
const CONTRATOS={intermitente:'Intermitente',indeterminado:'Prazo indeterminado (CLT normal)',determinado:'Prazo determinado / experiência',parcial:'Tempo parcial',aprendiz:'Aprendiz'};
const CT_CURTO={intermitente:'Intermitente',indeterminado:'CLT normal',determinado:'Prazo determinado',parcial:'Tempo parcial',aprendiz:'Aprendiz'};
function calcFolha(e,l,tipo,comp,P){
  const c=e.contrato||'indeterminado';l=l||{};
  if(c==='aprendiz')P=Object.assign({},P,{fgts:P.fgtsAprendiz??0.02});
  if(c==='intermitente'){
    if(tipo==='mensal')return calcInterm(e,l,P);
    if(tipo!=='resc')return fin([],[],{inss:0,fgts:0,irrf:0},P,'Contrato intermitente: férias e 13º proporcionais já são pagos em cada folha mensal. Nada a calcular aqui.')
  }
  return calcFolhaBase(e,l,tipo,comp,P)
}
function calcInterm(e,l,P){
  const prov=[],desc=[];const add=(arr,cod,d,ref,v)=>{v=R2(v);if(v>0)arr.push({cod,desc:d,ref:ref||'',val:v})};
  const vhB=N(e.valorHora),horas=N(l.horas),he50=N(l.he50),du=N(l.diasUteis)||25,df=N(l.domFer)||5,deps=N(e.depIR),pensao=N(e.pensao);
  const pf=e.peric?P.peric:0,vhEf=vhB*(1+pf);
  const pay=R2(horas*vhB),per=R2(pay*pf),he=R2(he50*vhEf*1.5),com=N(l.comissao),outros=N(l.outrosProv);
  const rsr=R2((pay+per+he+com)/du*df);
  const B=R2(pay+per+he+com+rsr),d13=R2(B/12),fer=R2(B/12),terc=R2(B/36);
  add(prov,'501','Horas trabalhadas (intermitente)',horas?horas+' h':'',pay);
  add(prov,'502','Adicional de periculosidade',e.peric?(P.peric*100)+'%':'',per);
  add(prov,'503','Horas extras 50%',he50?he50+' h':'',he);
  add(prov,'506','Comissões / bônus','',com);
  add(prov,'504','RSR (repouso semanal)',rsr?df+' d':'',rsr);
  add(prov,'507','13º salário proporcional',B?'1/12':'',d13);
  add(prov,'508','Férias proporcionais',B?'1/12':'',fer);
  add(prov,'509','1/3 s/ férias proporcionais','',terc);
  add(prov,'505','Outros proventos','',outros);
  const trib=R2(prov.reduce((s,x)=>s+x.val,0));
  const ii=calcINSS(trib,P),ir=calcIRRF(trib,ii,deps,pensao,P);
  const nSF=N(e.filhosSF);if(nSF>0&&trib>0&&trib<=P.sfLimite)add(prov,'008','Salário-família',nSF+' filho(s)',nSF*P.sfValor);
  add(desc,'101','INSS',aliqEf(ii,trib),ii);add(desc,'102','IRRF',ir.reducao>0?'c/ redutor Lei 15.270':'',ir.valor);
  add(desc,'103','Vale-transporte (limite 6%)','',Math.min(N(l.vtValor),R2(B*P.vtPerc)));
  add(desc,'107','Adiantamento','',N(l.adiant));add(desc,'108','Pensão alimentícia','',pensao);add(desc,'109','Outros descontos','',N(l.outrosDesc));
  let info='Contrato intermitente: a remuneração do período já inclui RSR, 13º e férias + 1/3 proporcionais (CLT, art. 452-A).';
  if(vhB>0&&vhB<P.salMin/220-0.005)info+=' ATENÇÃO: valor da hora abaixo do mínimo ('+(P.salMin/220).toFixed(2).replace('.',',')+' por hora).';
  if(trib>0&&trib<P.salMin)info+=' Remuneração do mês abaixo do salário mínimo: o mês pode não contar para a Previdência, a menos que o trabalhador complete a contribuição. Confira com o contador.';
  return fin(prov,desc,{inss:trib,fgts:trib,irrf:ir.base},P,info)
}
function calcFolhaBase(e,l,tipo,comp,P){
  l=l||{};if(tipo==='resc')return calcResc(e,l,comp,P);const prov=[],desc=[];const add=(arr,cod,d,ref,v)=>{v=R2(v);if(v>0)arr.push({cod,desc:d,ref:ref||'',val:v})};
  const base=N(e.salario),per=e.peric?R2(base*P.peric):0,deps=N(e.depIR),pensao=N(e.pensao);
  const vh=(base+per)/(e.contrato==='parcial'?(N(e.horasSem)||30)*5:(N(e.carga)||P.divHora));
  let trib=0,fgtsBase=0,irrfExtra=0,info='';
  if(tipo==='mensal'){
    const faltas=N(l.faltas),dsrP=N(l.dsrPerd),atr=N(l.atraso),he50=N(l.he50),he100=N(l.he100),du=N(l.diasUteis)||25,df=N(l.domFer)||5;
    add(prov,'001','Salário base','30 d',base);
    add(prov,'002','Adicional de periculosidade',e.peric?(P.peric*100)+'%':'',per);
    const v50=R2(he50*vh*1.5),v100=R2(he100*vh*2);
    add(prov,'003','Horas extras 50%',he50?he50+' h':'',v50);
    add(prov,'004','Horas extras 100%',he100?he100+' h':'',v100);
    const dsrHE=(v50+v100)/du*df;add(prov,'005','DSR s/ horas extras',dsrHE?df+' d':'',dsrHE);
    add(prov,'006','Comissões / bônus','',N(l.comissao));
    add(prov,'007','Outros proventos tributáveis','',N(l.outrosProv));
    add(desc,'104','Faltas',faltas?faltas+' d':'',(base+per)/30*faltas);
    add(desc,'105','DSR perdido (faltas)',dsrP?dsrP+' d':'',(base+per)/30*dsrP);
    add(desc,'106','Atrasos / saídas antecipadas',atr?atr+' h':'',vh*atr);
    trib=prov.reduce((s,x)=>s+x.val,0)-desc.reduce((s,x)=>s+x.val,0);trib=R2(trib);
    fgtsBase=trib;
    const ii=calcINSS(trib,P);const ir=calcIRRF(trib,ii,deps,pensao,P);
    const nSF=N(e.filhosSF);if(nSF>0&&trib<=P.sfLimite)add(prov,'008','Salário-família',nSF+' filho(s)',nSF*P.sfValor);
    const vtMax=R2(base*P.vtPerc);const vt=Math.min(N(e.vtCusto),vtMax);
    add(desc,'101','INSS',aliqEf(ii,trib),ii);
    add(desc,'102','IRRF',ir.reducao>0?'c/ redutor Lei 15.270':'',ir.valor);
    add(desc,'103','Vale-transporte (6%)','',e.vtCusto?vt:0);
    add(desc,'107','Adiantamento salarial','',N(l.adiant));
    add(desc,'108','Pensão alimentícia','',pensao);
    add(desc,'109','Plano de saúde / outros descontos','',N(l.outrosDesc));
    return fin(prov,desc,{inss:trib,fgts:fgtsBase,irrf:ir.base,sf:0},P,info)
  }
  if(tipo==='ferias'){
    const media=N(l.mediaVar),dias=l.feriasDias===undefined||l.feriasDias===''?30:N(l.feriasDias),ab=N(l.abonoDias);
    const rem=base+per+media,v=R2(rem/30*dias),t=R2(v/3);
    add(prov,'201','Férias gozadas',dias+' d',v);add(prov,'202','1/3 constitucional de férias','',t);
    if(ab>0){const va=R2(rem/30*ab);add(prov,'203','Abono pecuniário (isento)',ab+' d',va);add(prov,'204','1/3 s/ abono (isento)','',R2(va/3))}
    trib=R2(v+t);const ii=calcINSS(trib,P),ir=calcIRRF(trib,ii,deps,pensao,P);
    add(desc,'101','INSS',aliqEf(ii,trib),ii);add(desc,'102','IRRF',ir.reducao>0?'c/ redutor Lei 15.270':'',ir.valor);
    add(desc,'109','Outros descontos','',N(l.outrosDesc));
    return fin(prov,desc,{inss:trib,fgts:trib,irrf:ir.base},P,'')
  }
  // 13º
  const media=N(l.mediaVar),avos=(l.avos===undefined||l.avos==='')?avosAuto(e.admissao,comp):N(l.avos);
  const v13=R2((base+per+media)/12*avos),p1=R2(v13/2);
  if(tipo==='d1'){
    add(prov,'301','13º salário — 1ª parcela',avos+'/12',p1);
    return fin(prov,desc,{inss:0,fgts:p1,irrf:0},P,'Sem descontos (adiantamento de 50%).')
  }
  add(prov,'302','13º salário integral',avos+'/12',v13);
  const ii=calcINSS(v13,P),ir=calcIRRF(v13,ii,deps,pensao,P);
  add(desc,'307','Adiantamento 13º (1ª parcela)','',p1);
  add(desc,'101','INSS s/ 13º',aliqEf(ii,v13),ii);add(desc,'102','IRRF s/ 13º',ir.reducao>0?'c/ redutor Lei 15.270':'',ir.valor);
  add(desc,'109','Outros descontos','',N(l.outrosDesc));
  return fin(prov,desc,{inss:v13,fgts:R2(v13-p1),irrf:ir.base},P,'')
}
/* ---- Rescisão ---- */
const DAY=864e5;
const UTC=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const addM=(t,n)=>{const d=new Date(t),y=d.getUTCFullYear(),m=d.getUTCMonth()+n,last=new Date(Date.UTC(y,m+1,0)).getUTCDate();return Date.UTC(y,m,Math.min(d.getUTCDate(),last))};
function mesesCont(ini,fimIncl){const end=fimIncl+DAY;let m=0;while(addM(ini,m+1)<=end)m++;const resto=Math.round((end-addM(ini,m))/DAY);if(resto>=15)m++;return Math.min(12,Math.max(0,m))}
const MOTIVOS={sem_justa:'Dispensa sem justa causa',pedido:'Pedido de demissão',acordo:'Acordo (art. 484-A CLT)',justa:'Dispensa por justa causa',termino:'Término do contrato por prazo',antecipada:'Dispensa antecipada de contrato por prazo (art. 479)'};
function calcResc(e,l,comp,P){
  const prov=[],desc=[];const add=(arr,cod,d,ref,v)=>{v=R2(v);if(v>0)arr.push({cod,desc:d,ref:ref||'',val:v})};
  if(!e.admissao||!l.dataDesl){const r=fin([],[],{inss:0,fgts:0,irrf:0},P,'Informe a data de desligamento (e a admissão no cadastro) para calcular a rescisão.');r.multa=0;return r}
  const intermit=e.contrato==='intermitente';
  const base=intermit?0:N(e.salario),per=e.peric&&!intermit?R2(base*P.peric):0,media=N(l.mediaVar),rem=base+per+media,deps=N(e.depIR);
  const motivo=l.motivo||'sem_justa';
  const adm=UTC(e.admissao),fim=UTC(l.dataDesl);
  let anos=0;while(addM(adm,12*(anos+1))<=fim+DAY)anos++;
  const diasAviso=Math.min(90,30+3*anos);
  const modo=l.aviso||(motivo==='pedido'?'trabalhado':((motivo==='justa'||motivo==='termino'||motivo==='antecipada')?'':'indenizado'));
  const mult=motivo==='acordo'?0.5:1;
  const indeniza=modo==='indenizado'&&(motivo==='sem_justa'||motivo==='acordo');
  const diasProj=indeniza?Math.round(diasAviso*mult):0;
  const fimProj=fim+diasProj*DAY;
  const dSaldo=Math.min(30,new Date(fim).getUTCDate());
  add(prov,'401','Saldo de salário',dSaldo+' d',base/30*dSaldo);
  add(prov,'402','Periculosidade s/ saldo',e.peric?dSaldo+' d':'',per/30*dSaldo);
  add(prov,'409','Outros proventos tributáveis','',N(l.outrosProv));
  const baseSaldo=R2(prov.reduce((s,x)=>s+x.val,0));
  let vAviso=0;if(indeniza){vAviso=R2(rem/30*diasAviso*mult);add(prov,'403','Aviso prévio indenizado',diasAviso+' d'+(mult<1?' (50%)':''),vAviso)}
  const nv=intermit?0:N(l.feriasVenc);
  add(prov,'404','Férias vencidas',nv?nv+' período(s)':'',rem*nv);add(prov,'405','1/3 s/ férias vencidas','',rem*nv/3);
  let avF=0,av13=0,vF=0,v13=0;
  if(motivo!=='justa'&&!intermit){
    let k=0;while(addM(adm,12*(k+1))<=fim)k++;
    avF=mesesCont(addM(adm,12*k),Math.min(fimProj,Date.UTC(new Date(fim).getUTCFullYear()+1,11,31)));
    vF=R2(rem/12*avF);add(prov,'406','Férias proporcionais',avF+'/12',vF);add(prov,'407','1/3 s/ férias proporcionais','',vF/3);
    const ano=new Date(fim).getUTCFullYear(),ini13=Math.max(adm,Date.UTC(ano,0,1)),fim13=Math.min(fimProj,Date.UTC(ano,11,31));
    av13=mesesCont(ini13,fim13);v13=R2(rem/12*av13);add(prov,'408','13º salário proporcional',av13+'/12',v13);
  }
  let vInd=0;
  if(motivo==='antecipada'&&e.dataFim){const rest=Math.max(0,Math.round((UTC(e.dataFim)-fim)/DAY));vInd=R2(rem/30*rest*0.5);add(prov,'412','Indenização art. 479 CLT (50% do restante)',rest+' d',vInd)}
  if(motivo==='pedido'&&modo==='nao_cumprido')add(desc,'410','Aviso prévio não cumprido','30 d',rem);
  const ii=calcINSS(baseSaldo,P),ir=calcIRRF(baseSaldo,ii,deps,0,P);
  add(desc,'101','INSS s/ saldo de salário',aliqEf(ii,baseSaldo),ii);add(desc,'102','IRRF s/ saldo de salário',ir.reducao>0?'c/ redutor Lei 15.270':'',ir.valor);
  if(v13>0){const i2=calcINSS(v13,P),r2=calcIRRF(v13,i2,deps,0,P);add(desc,'111','INSS s/ 13º',aliqEf(i2,v13),i2);add(desc,'112','IRRF s/ 13º',r2.reducao>0?'c/ redutor Lei 15.270':'',r2.valor)}
  add(desc,'107','Adiantamentos','',N(l.adiant));add(desc,'109','Outros descontos','',N(l.outrosDesc));
  const fgtsBase=R2(baseSaldo+vAviso+v13),fgtsResc=R2(fgtsBase*P.fgts);
  const pct=(motivo==='sem_justa'||motivo==='antecipada')?0.4:(motivo==='acordo'?0.2:0);
  const multa=R2(pct*(N(l.saldoFgts)+fgtsResc));
  const f=d=>new Date(d).toISOString().slice(0,10).split('-').reverse().join('/');
  const info=MOTIVOS[motivo]+' em '+f(fim)+'. Tempo de casa: '+anos+' ano(s); aviso prévio de '+diasAviso+' dias'+(indeniza?' indenizado':(modo==='trabalhado'?' trabalhado':''))+'. '+(pct?'Multa do FGTS ('+pct*100+'%): R$ '+multa.toFixed(2).replace('.',',')+' — depositada na conta vinculada, não paga ao empregado. ':'')+(intermit?'Contrato intermitente: férias e 13º já foram pagos a cada período; informe a média mensal em "Média de variáveis" para o aviso prévio. ':'')+(vInd?'Indenização do art. 479 considerada sem INSS, IRRF e FGTS — confirme com o contador. ':'')+'Demonstrativo de cálculo; o TRCT oficial é emitido nos sistemas do governo.';
  const r=fin(prov,desc,{inss:baseSaldo,fgts:fgtsBase,irrf:ir.base,pat:R2(baseSaldo+v13)},P,info);r.multa=multa;return r
}
function aliqEf(v,b){return b>0?(v/b*100).toFixed(2).replace('.',',')+'%':''}
function fin(prov,desc,b,P,info){
  const tp=R2(prov.reduce((s,x)=>s+x.val,0)),td=R2(desc.reduce((s,x)=>s+x.val,0));
  const pb=b.pat!==undefined?b.pat:b.inss,taxa=(P.patronal??0.2)+(P.rat??0.03)*(P.fap??1)+(P.terceiros??0.058);
  return{prov,desc,totProv:tp,totDesc:td,liquido:R2(tp-td),bases:b,fgts:R2(b.fgts*P.fgts),patronal:R2(pb*taxa),patronalBase:R2(pb),info}
}

function defState(){return{empresa:{nome:'Grupo AKS',sub:'Engenharia e Manutenção',cnpj:'21.070.897/0001-08',end:'',cidade:'Belém - PA',logo:LOGO_PADRAO},funcs:[],folha:{},params:clone(DEF_PARAMS),comp:new Date().toISOString().slice(0,7),tipo:'mensal',tab:'folha'}}
let S=defState();
try{const r=localStorage.getItem(KEY);if(r){S=Object.assign(defState(),JSON.parse(r))}}catch(e){}
S.params=Object.assign(clone(DEF_PARAMS),S.params);
if(!S.empresa.cnpj)S.empresa.cnpj='21.070.897/0001-08';
if(!S.empresa.logo&&!S.semLogo)S.empresa.logo=LOGO_PADRAO;
LIC={ok:soDig(S.empresa.cnpj)===CNPJ_AKS,tipo:'proprio'};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const lkey=()=>S.comp+'|'+S.tipo;
const getL=id=>((S.folha[lkey()]||{})[id])||{};
function setL(id,k,v){const K=lkey();S.folha[K]=S.folha[K]||{};S.folha[K][id]=S.folha[K][id]||{};S.folha[K][id][k]=v;save()}
const calc=e=>calcFolha(e,getL(e.id),S.tipo,S.comp,S.params);
const compLabel=()=>{const[y,m]=S.comp.split('-');return MESES[+m-1]+'/'+y};
const fmtData=d=>d?d.split('-').reverse().join('/'):'';

function head(){const hc=$('#hcomp');if(hc)hc.textContent=compLabel();const i=$('#hlogo');if(S.empresa.logo){i.src=S.empresa.logo;i.style.display=''}else i.style.display='none';$('#hsub').textContent=S.empresa.nome+(S.empresa.sub?' · '+S.empresa.sub:'')}

const AVC=['#0b3d91','#e5383b','#12a150','#7c3aed','#d97706','#0891b2','#be185d'];

function vFolha(){
  const rs=S.funcs.map(e=>({e,r:calc(e)}));
  const T=rs.reduce((a,{r})=>({p:a.p+r.totProv,d:a.d+r.totDesc,l:a.l+r.liquido,f:a.f+r.fgts,t:a.t+r.patronal}),{p:0,d:0,l:0,f:0,t:0});
  $('#main').innerHTML=`
  <div class="card hero"><div class="eyebrow">${TIPOS[S.tipo]}</div><div class="big">${compLabel()}</div><div class="row">
    <div><label>Competência</label><input type="month" value="${S.comp}" onchange="S.comp=this.value;save();render()"></div>
    <div><label>Tipo de folha</label><select onchange="S.tipo=this.value;save();render()">${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}" ${S.tipo===k?'selected':''}>${v}</option>`).join('')}</select></div>
  </div></div>

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
function addDias(s,n){return iso(new Date(UTC(s)+n*DAY))}
function diaUtilAnt(d){while(d.getUTCDay()===0||d.getUTCDay()===6)d=new Date(d.getTime()-DAY);return d}
function datasPadrao(){const [y,m]=S.comp.split('-').map(Number);
  const enc=iso(diaUtilAnt(new Date(Date.UTC(y,m,20))));
  let pag;
  if(S.tipo==='mensal'){let d=new Date(Date.UTC(y,m,1)),n=0;while(true){if(d.getUTCDay()!==0&&d.getUTCDay()!==6){n++;if(n===5)break}d=new Date(d.getTime()+DAY)}pag=iso(d)}
  else if(S.tipo==='d1')pag=y+'-11-30';else if(S.tipo==='d2')pag=y+'-12-20';else pag=S.comp+'-'+pad(Math.min(28,new Date().getDate()));
  return[pag,enc]}
function datasExp(){const ex=(S.exp||{})[lkey()]||{},[p,e]=datasPadrao();return[ex.pag||p,ex.enc||e]}
function setExp(k,v){S.exp=S.exp||{};const K=lkey();S.exp[K]=S.exp[K]||{};S.exp[K][k]=v;save();render()}
function itensCaixa(){
  const [dPag,dEnc]=datasExp(),it=[],lab=TIPOS[S.tipo]+' '+compLabel();
  const mk=(key,parte,valor,venc,cat,depto,descricao)=>{const v=Math.round(valor*100);if(v>0)it.push({id:'folha_'+S.comp+'_'+S.tipo+'_'+key,parte,valor:v,venc,cat,depto,descricao})};
  let fg=0,inss=0,irrf=0,multa=0,pat=0;
  S.funcs.forEach(e=>{const r=calc(e),l=getL(e.id);
    mk(e.id,e.nome,r.liquido,(S.tipo==='resc'&&l.dataDesl)?addDias(l.dataDesl,10):dPag,'Colaboradores',e.depto||'Administrativo','Líquido — '+lab);
    fg+=r.fgts;multa+=r.multa||0;pat+=r.patronal;
    r.desc.forEach(x=>{if(/^INSS/.test(x.desc))inss+=x.val;else if(/^IRRF/.test(x.desc))irrf+=x.val})});
  mk('fgts','Caixa Econômica Federal (FGTS Digital)',fg,dEnc,'Impostos','Administrativo','FGTS 8% — '+lab);
  mk('multa','Caixa Econômica Federal (multa rescisória FGTS)',multa,dEnc,'Impostos','Administrativo','Multa rescisória do FGTS — '+lab);
  mk('inss','Receita Federal (DAE INSS — DCTFWeb)',inss+pat,dEnc,'Impostos','Administrativo','INSS: retido '+m2(inss)+' + patronal/RAT/terceiros '+m2(pat)+' — '+lab);
  mk('irrf','Receita Federal (DARF IRRF 0561)',irrf,dEnc,'Impostos','Administrativo','IRRF retido — '+lab);
  return it}
function cardCaixa(){const [p,e]=datasExp(),it=itensCaixa(),tot=it.reduce((s,x)=>s+x.valor,0)/100;
  return `<div class="card"><h3 style="margin:0 0 6px">Enviar ao Caixa AKS</h3><p class="hint">Gera as contas a pagar (salários por departamento, FGTS, INSS e IRRF) para você colar no Caixa AKS.</p>
  <div class="row"><div><label>Vencimento dos pagamentos</label><input type="date" value="${p}" onchange="setExp('pag',this.value)"></div><div><label>Vencimento dos encargos</label><input type="date" value="${e}" onchange="setExp('enc',this.value)"></div></div>
  <table class="pt" style="margin-top:8px">${it.map(x=>`<tr><td>${esc(x.parte)}<br><span class="hint">${esc(x.depto)} · ${x.venc.split('-').reverse().join('/')}</span></td><td class="r">${m2(x.valor/100)}</td></tr>`).join('')}<tr><th>Total</th><th class="r">${m2(tot)}</th></tr></table>
  <p class="hint">Prazos sugeridos: salário no 5º dia útil e encargos no dia 20 do mês seguinte (feriados não considerados). Confira com o contador. O INSS vai em uma guia só (retido + patronal 20% + RAT + terceiros), como na DCTFWeb do lucro presumido.</p>
  <button class="b" onclick="copiarCaixa()">Copiar para o Caixa AKS</button><textarea id="cxTxt" rows="3" style="display:none;margin-top:8px"></textarea></div>`}
function copiarCaixa(){const t='AKS-FOLHA1:'+JSON.stringify({v:1,comp:S.comp,tipo:S.tipo,itens:itensCaixa()});

  const sc=(k,n)=>`<div><label>${n}</label><input inputmode="decimal" value="${P[k]}" onchange="P_set('${k}',this.value)"></div>`;
  $('#main').innerHTML=`<div class="card"><h3 style="margin-top:0">Parâmetros legais — ${P.ano}</h3><p class="hint">Valores oficiais de 2026 já carregados. Atualize aqui quando a lei mudar.</p><div class="row">${sc('ano','Ano')}${sc('salMin','Salário mínimo')}${sc('inssTeto','Teto INSS')}${sc('depIR','Dedução por dependente (IRRF)')}${sc('simpl','Desconto simplificado')}${sc('redAte','Redutor: isenção total até')}${sc('redAte2','Redutor: parcial até')}${sc('redA','Redutor: constante A')}${sc('redB','Redutor: constante B')}${sc('sfValor','Salário-família por filho')}${sc('sfLimite','Salário-família: limite de renda')}${sc('fgts','FGTS (0,08 = 8%)')}${sc('patronal','INSS patronal (0,20 = 20%)')}${sc('rat','RAT / GILRAT (0,01 a 0,03)')}${sc('fap','FAP (multiplicador, ex.: 1)')}${sc('terceiros','Terceiros / Sistema S (0,058 = 5,8%)')}${sc('vtPerc','Desconto VT (0,06 = 6%)')}${sc('peric','Periculosidade (0,30 = 30%)')}${sc('divHora','Divisor de horas')}</div></div>
  <div class="card"><b>Tabela INSS (limite superior da faixa · alíquota)</b><div class="row">${P.inss.map((r,i)=>`<div><label>Faixa ${i+1}</label><input value="${r[0]}" onchange="P_tab('inss',${i},0,this.value)"><input value="${r[1]}" onchange="P_tab('inss',${i},1,this.value)"></div>`).join('')}</div></div>
  <div class="card"><b>Tabela IRRF (limite · alíquota · parcela a deduzir)</b><div class="row">${P.irrf.map((r,i)=>`<div><label>Faixa ${i+1}</label><input value="${r[0]}" onchange="P_tab('irrf',${i},0,this.value)"><input value="${r[1]}" onchange="P_tab('irrf',${i},1,this.value)"><input value="${r[2]}" onchange="P_tab('irrf',${i},2,this.value)"></div>`).join('')}</div></div>
  <button class="b s" onclick="if(confirm('Restaurar tabelas padrão 2026?')){S.params=clone(DEF_PARAMS);save();render()}">Restaurar padrão 2026</button>`}
function P_set(k,v){S.params[k]=N(v);save()}
function P_tab(t,i,j,v){S.params[t][i][j]=N(v);save()}

/* ---- Backup ---- */
function vBkp(){
  $('#main').innerHTML=`<div class="card"><p>Os dados ficam salvos neste navegador. Faça backup copiando o texto abaixo e guardando num arquivo seguro.</p><button class="b" onclick="cpBkp()">Copiar backup</button>
  <div style="margin-top:10px"><label>Restaurar (cole o backup aqui)</label><textarea id="bk" rows="6"></textarea><button class="b s" style="margin-top:8px" onclick="rsBkp()">Restaurar</button></div></div>`}
function cpBkp(){const t=JSON.stringify(S);try{navigator.clipboard.writeText(t).then(()=>alert('Backup copiado.'),()=>fb(t))}catch(e){fb(t)}}
function fb(t){const a=document.getElementById('bk');if(a){a.value=t;a.select();alert('Copie o texto selecionado.')}}
function rsBkp(){try{const o=JSON.parse(document.getElementById('bk').value);S=Object.assign(defState(),o);save();alert('Restaurado.');render()}catch(e){alert('Backup inválido.')}}
render();checkLic();
</script>
</body>
</html>
