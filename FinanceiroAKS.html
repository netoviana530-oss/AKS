<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Financeiro%20AKS%22%2C%22short_name%22%3A%22Fin%20AKS%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23141210%22%2C%22theme_color%22%3A%22%23141210%22%7D">
<title>Financeiro AKS</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --ink:#141210;--paper:#F4F3F1;--card:#FFFFFF;--line:#E6E2DC;--text:#1A1613;--soft:#6E665E;
    --orange:#F47A1F;--orangeSoft:#FCEBD8;--orangeDeep:#CF6216;
    --green:#2F9E6E;--greenBg:#E7F4EE;--amber:#C98A1E;--amberBg:#FAF0DA;--red:#CB5656;--redBg:#F7E7E7;
  }
  html,body{margin:0;background:var(--paper);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .num{font-variant-numeric:tabular-nums}
  .wrap{max-width:480px;margin:0 auto;padding-bottom:96px;min-height:100vh}
  header{background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 18px}
  .htop{display:flex;align-items:center}
  .eyebrow{font-size:11px;letter-spacing:.18em;font-weight:800;color:var(--orange)}
  .gear{margin-left:auto;background:rgba(255,255,255,.12);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center}
  .logobox{background:#fff;border-radius:12px;margin-top:8px;padding:10px;display:flex;align-items:center;justify-content:center}
  .logobox img{max-height:62px;max-width:92%;width:auto;object-fit:contain;display:block}
  .caixaLbl{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:#B7ADA2;margin-top:16px}
  .caixaVal{font-size:30px;font-weight:800}
  main{padding:16px 14px 0;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .card h3{margin:0 0 12px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ink)}
  .card .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .card .head h3{margin:0}
  .label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);margin-bottom:4px;display:block}
  input,select{font-family:inherit;font-size:14px;width:100%;padding:11px 12px;border:none;background:var(--paper);border-radius:12px;outline:none;color:var(--ink)}
  input.big{font-size:24px;font-weight:800;background:transparent;border-bottom:2px solid var(--line);border-radius:0;padding:8px 0}
  .btn{width:100%;padding:13px;border:none;border-radius:12px;font-size:14px;font-weight:700;color:#fff;background:var(--ink)}
  .btn.orange{background:var(--orange)} .btn.soft{background:var(--paper);color:var(--ink)}
  .seg{display:grid;gap:6px;margin-bottom:12px}
  .seg.c2{grid-template-columns:1fr 1fr}.seg.c3{grid-template-columns:repeat(3,1fr)}.seg.c4{grid-template-columns:repeat(4,1fr)}
  .segbtn{padding:9px 4px;border:none;border-radius:10px;font-size:12px;font-weight:700;background:var(--paper);color:var(--soft)}
  .segbtn.on{background:var(--orange);color:#fff}.segbtn.onink.on{background:var(--ink)}
  .row{display:flex;align-items:center;justify-content:space-between;padding:5px 0}
  .row .l{font-size:13px;color:var(--soft)} .row .v{font-size:13.5px;font-weight:600}
  .row.total{border-top:1px solid var(--line);margin-top:8px;padding-top:9px}
  .row.total .l{color:var(--ink);font-weight:800}.row.total .v{font-weight:800}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mini{flex:1;background:var(--paper);border-radius:12px;padding:12px}
  .mini .k{font-size:12px;font-weight:600} .mini .val{font-size:15px;font-weight:800;margin-top:2px;color:var(--ink)}
  .bucket{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
  .bucket .k{font-size:12px;font-weight:700}.bucket .val{font-size:17px;font-weight:800;margin-top:2px}.bucket .sub{font-size:10.5px;color:var(--soft)}
  .semaforo{border-radius:16px;padding:20px}

  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}

  .muted{color:var(--soft)} .small{font-size:11px} .xsmall{font-size:10.5px}

  .drow.total{border-top:1px solid rgba(244,122,31,.28);margin-top:6px;padding-top:6px;color:var(--orangeDeep);font-weight:800}
  .check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:transparent;flex:none}
  .check.on{background:var(--green);border-color:var(--green);color:#fff;display:flex;align-items:center;justify-content:center}
  .ck{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft);background:none;border:none;padding:0;margin-bottom:12px}
  .trash{background:none;border:none;color:var(--soft);font-size:16px;padding:4px}
  nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav .inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
  .navbtn{background:none;border:none;padding:9px 0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--soft)}
  .navbtn.on{color:var(--orange)} .navbtn span{font-size:10px;font-weight:600} .navbtn svg{width:22px;height:22px}
  .toast{position:fixed;bottom:92px;left:0;right:0;display:flex;justify-content:center;padding:0 16px;pointer-events:none;z-index:60}
  .toast div{background:var(--ink);color:#fff;font-size:14px;padding:10px 16px;border-radius:12px;max-width:480px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:70}
  .sheet{background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:20px;max-height:90vh;overflow:auto}
  .sheet .x{background:none;border:none;font-size:22px;color:var(--soft)}
  .rule{display:flex;gap:12px;margin-bottom:12px} .rule .ico{flex:none;width:32px;height:32px;border-radius:9px;background:var(--orangeSoft);color:var(--orangeDeep);display:flex;align-items:center;justify-content:center}
  .rule .t{font-size:14px;font-weight:700;color:var(--ink)} .rule .d{font-size:12.5px;line-height:1.35;color:var(--soft)}
  a.link{color:var(--orangeDeep);font-weight:600}
  #gate{position:fixed;inset:0;background:var(--ink);display:none;align-items:center;justify-content:center;z-index:100;padding:24px}
  .gatewrap{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff}
  .gl{width:118px;height:auto;background:#fff;border-radius:16px;padding:10px;margin-bottom:20px}
  .gmsg{font-size:14px;color:#B7ADA2}
  .gtit{font-size:18px;font-weight:800;margin-bottom:4px}
  .gsub{font-size:12.5px;color:#B7ADA2;margin-bottom:16px}
  .pin{font-size:26px;text-align:center;letter-spacing:.28em;background:rgba(255,255,255,.1);color:#fff;border-radius:12px;padding:12px;width:100%;max-width:280px;margin-bottom:8px}
  .pinerr{font-size:12.5px;color:#F1A0A0;min-height:18px;margin-bottom:8px}

function save(){ if(booted) render(); setDoc(docRef,{data:state,ts:Date.now()}).catch(()=>toast('Sem conexão — sincroniza ao voltar.')); }

/* ---------- helpers ---------- */
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function parseV(s){if(typeof s==='number')return s;if(!s)return 0;s=String(s).replace(/[^\d.,-]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?0:n}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hoje=()=>new Date().toISOString().slice(0,10);
const fmtD=iso=>{if(!iso)return '';const[y,m,d]=iso.slice(0,10).split('-');return d+'/'+m+'/'+y.slice(2)};
const mesAtual=iso=>{const d=new Date(iso),n=new Date();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function calcReceb(r){const imp=r.deServico?r.valor*(r.pctImpostos||0)/100:0;const crise=r.valor*(r.pctCrise||0)/100;const custos=(r.material||0)+(r.logistica||0)+(r.despesas||0);const lucro=r.valor-imp-crise-custos;return{imp,crise,custos,lucro}}

function compute(linha){
  const geral=linha==='geral';
  const recs=state.recebiveis.filter(r=>geral||r.linha===linha);
  const contas=state.contas.filter(c=>geral||c.linha===linha);
  const recebidos=recs.filter(r=>r.recebido);
  let bruto=0,imp=0,crise=0,custos=0,lucro=0,aReceber=0,brutoMes=0,lucroMes=0;
  recebidos.forEach(r=>{const b=calcReceb(r);bruto+=r.valor;imp+=b.imp;crise+=b.crise;custos+=b.custos;lucro+=b.lucro;if(mesAtual(r.data)){brutoMes+=r.valor;lucroMes+=b.lucro}});
  recs.filter(r=>!r.recebido).forEach(r=>aReceber+=r.valor);
  const contasPagas=contas.filter(c=>c.pago).reduce((s,c)=>s+c.valor,0);
  const contasPend=contas.filter(c=>!c.pago).reduce((s,c)=>s+c.valor,0);
  const retiradas=geral?state.retiradas.reduce((s,r)=>s+r.valor,0):0;
  const caixa=bruto-custos-contasPagas-retiradas;
  const reservaMin=geral?(state.config.reservaMinima||0):0;
  const livre=caixa-imp-crise-contasPend-reservaMin;
  const proLabore=state.config.socios.reduce((s,x)=>s+(x.prolabore||0),0);
  let status='verde';if(livre<=0)status='vermelho';else if(proLabore>0&&livre<proLabore)status='amarelo';
  return{bruto,imp,crise,custos,lucro,aReceber,contasPagas,contasPend,caixa,reservaMin,livre,brutoMes,lucroMes,proLabore,status}
}

  document.querySelectorAll('#ttipo [data-t]').forEach(b=>b.onclick=()=>{tipo=b.dataset.t;document.querySelectorAll('#ttipo .segbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
  $('tadd').onclick=()=>{const v=parseV($('tval').value);if(v<=0)return toast('Digite um valor.');if(v>g.livre)toast('Atenção: passa do que está livre.');state.retiradas.unshift({id:uid(),socioIndex:Number($('tsoc').value),tipo,valor:v,data:hoje()});save()};
  document.querySelectorAll('[data-delt]').forEach(b=>b.onclick=()=>{state.retiradas=state.retiradas.filter(x=>x.id!==b.dataset.delt);save()});
}

function vGuia(){
  const c=state.config;
  const regras=[['shield','Nunca misture PF e PJ','Conta e cartão da AKS são só da empresa. Gasto pessoal sai do seu pró-labore, na conta pessoal.'],
   ['coins','Toda entrada é dividida na hora',`De cada serviço: ${c.pctCrise}% vai pra reserva de crise, ${c.pctImpostos}% pra impostos, e material/logística/despesas são descontados. O que sobra é lucro de verdade.`],
   ['shield','Reserva de crise é intocável','É o seguro do grupo pra mês fraco. Só se usa em emergência real, nunca pra retirada comum.'],
   ['bank','Imposto separado não é seu','O valor de imposto fica reservado desde a entrada. Assim não falta na hora de pagar a nota.'],
   ['box','Cada empresa se paga sozinha','Painéis, Lab e KVAr têm entrada e saída próprias. Olhe o lucro de cada uma pra saber qual sustenta o grupo.'],
   ['alert',"Não tire 'porque tem na conta'",'Antes de retirar, olhe o semáforo. Vermelho = o caixa é de imposto, reserva ou fornecedor. Segure.']];
  return `
  <div class="card"><h3>Como rodar o financeiro da AKS</h3>${regras.map(r=>`<div class="rule"><div class="ico">${svg(r[0])}</div><div><div class="t">${r[1]}</div><div class="d">${r[2]}</div></div></div>`).join('')}</div>
  <div class="card"><h3>Backup e transferência</h3><p class="small muted" style="margin:0 0 10px">Os dados ficam salvos neste aparelho. Exporte o backup pra guardar uma cópia ou passar pro celular da sua sócia.</p>
    <button class="btn soft" id="gexp" style="margin-bottom:8px">⬇ Exportar backup (arquivo)</button>
    <button class="btn soft" id="gcsv" style="margin-bottom:8px">⬇ Exportar planilha (CSV)</button>
    <button class="btn soft" id="gimp">⬆ Restaurar backup</button>
    <input id="gfile" type="file" accept="application/json,.json" style="display:none">
  </div>
  <p class="xsmall muted" style="padding:0 8px 4px">Ferramenta de controle — não substitui contador. Confirme os percentuais (INSS, IR, regime tributário) com o contador de vocês.</p>`;
}
function bindGuia(){
  const $=id=>document.getElementById(id);
  $('gexp').onclick=()=>dl('financeiro-aks-backup.json',JSON.stringify(state,null,2),'application/json');
  $('gcsv').onclick=()=>{
    const L=[['Registro','Linha','Nome','ValorBruto','Impostos','Crise','Custos','Lucro','Status','Data']];
    state.recebiveis.forEach(r=>{const b=calcReceb(r);L.push(['Entrada',nomeLinha(r.linha),r.cliente,r.valor,b.imp,b.crise,b.custos,b.lucro,r.recebido?'recebido':'a receber',r.data])});
    state.contas.forEach(c=>L.push(['Conta',nomeLinha(c.linha),c.descricao,c.valor,'','','','',c.pago?'pago':'aberto',c.vencimento]));
    state.retiradas.forEach(r=>L.push(['Retirada','',(state.config.socios[r.socioIndex]||{}).nome||'',r.valor,'','','','',r.tipo,r.data]));
    dl('financeiro-aks.csv','\ufeff'+L.map(l=>l.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv');
  };
  $('gimp').onclick=()=>$('gfile').click();
  $('gfile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o.config)throw 0;if(confirm('Isso substitui os dados atuais deste aparelho. Continuar?')){state=Object.assign({},empty,o);save();toast('Backup restaurado.')}}catch(_){toast('Arquivo inválido.')}};rd.readAsText(f)};
}
function dl(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:type+';charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}

/* ---------- config ---------- */
function openConfig(){
  const c=state.config;
  document.getElementById('modal').innerHTML=`<div class="modal" id="mbg"><div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><b style="font-size:18px">Ajustes</b><button class="x" id="mx">✕</button></div>
    <b style="font-size:14px">Divisão de cada entrada</b>
    <div class="grid2" style="margin:8px 0 16px"><div><span class="label">Reserva crise (%)</span><input id="cC" class="num" inputmode="decimal" value="${c.pctCrise}"></div><div><span class="label">Impostos (%)</span><input id="cI" class="num" inputmode="decimal" value="${c.pctImpostos}"></div></div>
    <span class="label">Reserva mínima extra (opcional)</span><input id="cR" class="num" inputmode="decimal" value="${c.reservaMinima||''}" placeholder="0,00"><div style="height:16px"></div>
    <b style="font-size:14px">Sócios e pró-labore</b><div style="height:8px"></div>
    ${c.socios.map((s,i)=>`<div style="display:flex;gap:8px;margin-bottom:8px"><input class="cnome" data-i="${i}" value="${esc(s.nome)}" placeholder="Nome"><input class="cpl num" data-i="${i}" inputmode="decimal" value="${s.prolabore||''}" placeholder="Pró-labore" style="width:120px"></div>`).join('')}
    <div style="height:8px"></div><b style="font-size:14px">Código de acesso</b>
    <input id="cpin" class="num" inputmode="numeric" maxlength="8" value="${esc(c.pin||'')}" placeholder="código" style="margin-top:8px">
    <button class="btn" id="msave" style="margin-top:16px">Salvar ajustes</button>
  </div></div>`;
  const close=()=>document.getElementById('modal').innerHTML='';
  document.getElementById('mx').onclick=close;
  document.getElementById('mbg').onclick=e=>{if(e.target.id==='mbg')close()};
  document.getElementById('msave').onclick=()=>{
    state.config.pctCrise=parseV(document.getElementById('cC').value);
    state.config.pctImpostos=parseV(document.getElementById('cI').value);
    state.config.reservaMinima=parseV(document.getElementById('cR').value);
    document.querySelectorAll('.cnome').forEach(el=>{state.config.socios[+el.dataset.i].nome=el.value.trim()||'Sócio'});
    document.querySelectorAll('.cpl').forEach(el=>{state.config.socios[+el.dataset.i].prolabore=parseV(el.value)});
    const np=(document.getElementById('cpin').value||'').trim();if(np.length>=4)state.config.pin=np;
    close();save();
  };
}

/* ---------- toast + nav + render ---------- */
let toastT;
function toast(m){const t=document.getElementById('toast');t.innerHTML='<div>'+m+'</div>';clearTimeout(toastT);toastT=setTimeout(()=>t.innerHTML='',2600)}
const NAV=[['painel','Painel'],['receber','Receber'],['pagar','Pagar'],['retiradas','Retiradas'],['guia','Guia']];
function render(){
  const g=compute('geral');
  document.getElementById('hlogo').src=LOGOS.grupo;
  document.getElementById('hcaixa').textContent=brl(g.caixa);
  const V={painel:vPainel,receber:vReceber,pagar:vPagar,retiradas:vRetiradas,guia:vGuia}[tab];
  document.getElementById('view').innerHTML=V();
  ({painel:bindPainel,receber:bindReceber,pagar:bindPagar,retiradas:bindRetiradas,guia:bindGuia}[tab])();
  document.getElementById('nav').innerHTML=NAV.map(([id,l])=>`<button class="navbtn ${tab===id?'on':''}" data-tab="${id}">${svg(id)}<span>${l}</span></button>`).join('');
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;window.scrollTo(0,0);render()});
  window.scrollTo(0,0);
}
document.getElementById('gear').onclick=openConfig;

/* ---------- trava de acesso + sincronização ---------- */
const gate=()=>document.getElementById('gate');
function showLoading(msg){gate().style.display='flex';gate().innerHTML='<div class="gatewrap"><img class="gl" src="'+LOGOS.grupo+'"><div class="gmsg">'+(msg||'Conectando…')+'</div></div>'}
function showError(msg){gate().style.display='flex';gate().innerHTML='<div class="gatewrap"><img class="gl" src="'+LOGOS.grupo+'"><div class="gmsg" style="color:#F1A0A0">'+msg+'</div></div>'}
function showPin(mode){
  pinShown=true;const g=gate();g.style.display='flex';
  const t=mode==='create'?'Crie um código de acesso':'Digite o código de acesso';
  const sub=mode==='create'?'Vocês dois vão usar esse mesmo código pra abrir o app.':'';
  g.innerHTML='<div class="gatewrap"><img class="gl" src="'+LOGOS.grupo+'"><div class="gtit">'+t+'</div><div class="gsub">'+sub+'</div><input id="pin" class="pin num" inputmode="numeric" maxlength="8" placeholder="••••"><div id="pinerr" class="pinerr"></div><button class="btn" id="pinbtn" style="max-width:280px">Entrar</button></div>';
  const inp=document.getElementById('pin');setTimeout(()=>inp.focus(),50);
  const go=()=>{const v=(inp.value||'').trim();if(v.length<4){document.getElementById('pinerr').textContent='Use pelo menos 4 dígitos.';return}
    if(mode==='create'){state.config.pin=v;setDoc(docRef,{data:state,ts:Date.now()});afterUnlock()}
    else{if(v===state.config.pin)afterUnlock();else{document.getElementById('pinerr').textContent='Código errado.';inp.value=''}}};
  document.getElementById('pinbtn').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};
}
function afterUnlock(){unlocked=true;pinShown=false;try{localStorage.setItem('aks_unlocked','1')}catch(e){}gate().style.display='none';booted=true;render()}
function gateFlow(){
  if(unlocked){gate().style.display='none';booted=true;render();return}
  if(localStorage.getItem('aks_unlocked')==='1'){afterUnlock();return}
  if(pinShown)return;
  if(state.config&&state.config.pin)showPin('enter');else showPin('create');
}
function startSync(){
  if(syncing)return;syncing=true;
  onSnapshot(docRef,snap=>{
    if(snap.exists()&&snap.data()&&snap.data().data){state=Object.assign({},empty,snap.data().data);if(!state.config)state.config=JSON.parse(JSON.stringify(empty.config))}
    else{state=JSON.parse(JSON.stringify(empty));setDoc(docRef,{data:state,ts:Date.now()})}
    ready=true;gateFlow();
  },err=>showError('Erro ao acessar o banco. Publique as Regras do Firestore no console. ('+err.code+')'));
}
onAuthStateChanged(auth,u=>{if(u)startSync()});
signInAnonymously(auth).catch(e=>showError('Falha no login. Ative "Anônimo" em Authentication → Sign-in method. ('+e.code+')'));
showLoading('Conectando ao Financeiro AKS…');
</script>
