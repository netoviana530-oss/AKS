<style>

body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;color:var(--ink);background:var(--bg) radial-gradient(circle at 1px 1px,rgba(11,61,145,.07) 1px,transparent 0) 0 0/22px 22px;padding-bottom:calc(88px + env(safe-area-inset-bottom));min-height:100vh}

header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#1d63e0 0 33.3%,#e5383b 33.3% 66.6%,#ffc928 66.6%)}

h3{font-size:16px}

.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,201,40,.45),transparent 65%)}
.hero .eyebrow{font-size:12px;opacity:.75;text-transform:uppercase;letter-spacing:1.2px;font-weight:700}

input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:12px;font:inherit;background:#fff;transition:.15s;color:var(--ink)}

.slip table{width:100%;border-collapse:collapse;table-layout:fixed}
.slip td{word-break:break-word}

@media(max-width:560px){.sheet{padding:12px;margin:8px auto}.slip{font-size:11px;padding:14px 8px 10px}.slip th{font-size:9.5px;padding:3px 2px}.slip td{padding:2px 3px}.slip .box{grid-template-columns:1fr}.slip .liq{font-size:13px}}
.slip th{background:#0b3d91;color:#fff;border:1px solid #0b3d91;padding:4px 5px;font-size:11px}
.slip td{border-left:1px solid #9aa7bd;border-right:1px solid #9aa7bd;padding:2.5px 5px}
.slip td.r{text-align:right}
.slip tr.tot td{border:1px solid #0f1b33;font-weight:800;background:rgba(238,242,248,.85)}
.slip .liq{display:flex;justify-content:space-between;border-radius:8px;padding:9px 12px;margin:9px 0;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(120deg,#071633,#0b3d91);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.slip .bases{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border:1px solid #0f1b33;border-radius:6px;padding:6px;font-size:11px;background:rgba(238,242,248,.7)}
.slip .ass{margin-top:28px;display:flex;gap:22px;font-size:11px}.slip .ass div{flex:1;border-top:1px solid #0f1b33;padding-top:3px;text-align:center}
#printArea{display:none}
@media print{body{background:#fff}body::before{display:none}header,nav,main,.ovl{display:none!important}#printArea{display:block}.slip{margin:0 0 8mm}}

.chip.w{background:#fff4d6;color:#8a5a00}.chip.g{background:#e3f6ec;color:#0a7f4f}.chip.r{background:#fde8e8;color:#b42318}.chip.b{background:#e8efff;color:#0b3d91}
.fl{display:flex;gap:8px;flex-wrap:wrap}.fl>*{flex:0 0 auto}
.pill{display:inline-block;padding:7px 13px;border-radius:99px;background:#fff;border:1px solid var(--bd);font-weight:700;font-size:13px;color:var(--mut);cursor:pointer}
.pill.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.lst>div{padding:12px 0;border-bottom:1px solid var(--bd)}.lst>div:last-child{border:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.it{display:grid;grid-template-columns:1fr 54px 78px 28px;gap:6px;align-items:end;margin-bottom:8px}

.stp{display:flex;gap:4px;margin:6px 0 2px}.stp i{flex:1;height:6px;border-radius:4px;background:#dfe5f1}.stp i.on{background:var(--blue2)}.stp i.ok{background:#12a150}
.urg{border-left:5px solid var(--red)}.avs{border-left:5px solid var(--yel)}
textarea.mono{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:150px}
canvas#sg{width:100%;height:210px;border:2px dashed #9aa7bd;border-radius:14px;background:#fff;touch-action:none;display:block}
.big{font-size:22px;font-weight:800}
a.b{color:#fff!important;text-decoration:none!important;display:inline-block;text-align:center}

<script id="pdfcore">
const WR=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const WB=[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
function tw(s,sz,b){let t=0;const T=b?WB:WR;for(const ch of String(s).normalize('NFD').replace(/[̀-ͯ]/g,'')){const c=ch.charCodeAt(0);t+=(c>=32&&c<=126)?T[c-32]:(c===0x2014?1000:(c===0xD7?584:556))}return t*sz/1000}
function fit(s,w,sz,b){s=String(s);if(tw(s,sz,b)<=w)return s;while(s.length>1&&tw(s+'…',sz,b)>w)s=s.slice(0,-1);return s+'…'}
function wrapT(s,w,sz,b){const out=[];let cur='';for(const wd of String(s).split(/\s+/)){const t=cur?cur+' '+wd:wd;if(tw(t,sz,b)<=w||!cur)cur=t;else{out.push(cur);cur=wd}}if(cur)out.push(cur);return out}
function enc(s){let o='';for(const ch of String(s)){let c=ch.charCodeAt(0);if(c===0x2014)c=0x97;else if(c===0x2013)c=0x96;else if(c===0x2026)c=0x85;else if(c===0x2022)c=0x95;else if(c===0x2212)c=0x2D;else if(c>255)c=0x3F;if(c===0x28||c===0x29||c===0x5C)o+='\\';o+=String.fromCharCode(c)}return o}
const PW=595.28,PH=841.89;
function mkPage(){const o=[],f=n=>(+n).toFixed(2),col=c=>c.map(v=>f(v/255)).join(' ');
  return{o,
   rect(x,y,w,h,fill,stroke,lw){o.push('q '+(fill?col(fill)+' rg ':'')+(stroke?col(stroke)+' RG '+f(lw||.6)+' w ':'')+f(x)+' '+f(PH-y-h)+' '+f(w)+' '+f(h)+' re '+(fill&&stroke?'B':(fill?'f':'S'))+' Q')},
   line(x1,y1,x2,y2,c,lw){o.push('q '+col(c)+' RG '+f(lw||.6)+' w '+f(x1)+' '+f(PH-y1)+' m '+f(x2)+' '+f(PH-y2)+' l S Q')},
   text(s,x,y,sz,opt){opt=opt||{};const w=tw(s,sz,opt.b);if(opt.al==='r')x-=w;else if(opt.al==='c')x-=w/2;
     o.push('BT '+col(opt.c||[15,27,51])+' rg /'+(opt.b?'F2':'F1')+' '+f(sz)+' Tf '+f(x)+' '+f(PH-y)+' Td ('+enc(s)+') Tj ET')},
   img(n,x,y,w,h){o.push('q '+f(w)+' 0 0 '+f(h)+' '+f(x)+' '+f(PH-y-h)+' cm /'+n+' Do Q')}}}
function pdfDoc(pages,imgs){
  const parts=[];let len=0;const offs=[];
  const put=s=>{const b=typeof s==='string'?Uint8Array.from(s,c=>c.charCodeAt(0)):s;parts.push(b);len+=b.length};
  const obj=(n,body)=>{offs[n]=len;put(n+' 0 obj\n'+body+'\nendobj\n')};
  const sobj=(n,dict,bytes)=>{offs[n]=len;put(n+' 0 obj\n<<'+dict+' /Length '+bytes.length+'>>\nstream\n');put(bytes);put('\nendstream\nendobj\n')};
  put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const ni=imgs.length,first=5,pg0=first+ni;
  const kids=pages.map((_,i)=>(pg0+i*2+1)+' 0 R').join(' ');
  obj(1,'<</Type /Catalog /Pages 2 0 R>>');
  obj(2,'<</Type /Pages /Kids ['+kids+'] /Count '+pages.length+'>>');
  obj(3,'<</Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding>>');
  obj(4,'<</Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding>>');
  imgs.forEach((im,i)=>sobj(first+i,'/Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode',im.b));
  const xo=imgs.map((_,i)=>'/Im'+i+' '+(first+i)+' 0 R').join(' ');
  pages.forEach((p,i)=>{const c=pg0+i*2,pgn=c+1,body=Uint8Array.from(p.o.join('\n'),ch=>ch.charCodeAt(0));
    sobj(c,'',body);
    obj(pgn,'<</Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources <</Font <</F1 3 0 R /F2 4 0 R>> /XObject <<'+xo+'>>>> /Contents '+c+' 0 R>>')});
  const n=pg0+pages.length*2,xr=len;
  put('xref\n0 '+n+'\n0000000000 65535 f \n');
  for(let i=1;i<n;i++)put(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  put('trailer\n<</Size '+n+' /Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');
  const out=new Uint8Array(len);let k=0;for(const b of parts){out.set(b,k);k+=b.length}return out}
function jpgInfo(b){let i=2;while(i<b.length-9){if(b[i]!==0xFF){i++;continue}const m=b[i+1];if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC)return{h:b[i+5]<<8|b[i+6],w:b[i+7]<<8|b[i+8],c:b[i+9]};if(m===0xD8||m===0x01||(m>=0xD0&&m<=0xD7)){i+=2;continue}i+=2+(b[i+2]<<8|b[i+3])}return null}

<script>
/* ===== APP ===== */
const CNPJ_AKS='21070897000108';
const PUB_JWK={"kty":"EC","crv":"P-256","x":"GaKgVf2w-KTEOplcdqUj21MBYF55V8Up3vMVOWRMvig","y":"h0CxiHABZOJpQ3QkXK88pmJwQpKVX8xPkzzKoCgsiVk","ext":true};
const soDig=s=>String(s||'').replace(/\D/g,'');
function cnpjValido(c){c=soDig(c);if(c.length!==14||/^(\d)\1+$/.test(c))return false;const d=n=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=+c[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return d(12)===+c[12]&&d(13)===+c[13]}
const fromB64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));
async function verificaCodigo(code,cnpj){
  const p=String(code||'').trim().split('.');
  if(p.length!==4||p[0]!=='AKS2')return{ok:false,msg:'Código inválido (precisa ser um código do Gestão AKS).'};
  const c=soDig(cnpj),val=p[2];
  if(p[1]!==c)return{ok:false,msg:'Este código é de outro CNPJ.'};
  try{
    if(!(window.crypto&&crypto.subtle))return{ok:false,msg:'Este navegador não consegue validar o código. Abra o app por um endereço seguro (https).'};
    const key=await crypto.subtle.importKey('jwk',PUB_JWK,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,fromB64u(p[3]),new TextEncoder().encode('AKSLIC2|'+c+'|'+val));
    if(!ok)return{ok:false,msg:'Código não confere.'};
  }catch(e){return{ok:false,msg:'Código inválido.'}}
  if(val!=='0'&&hoje()>val)return{ok:false,msg:'Licença vencida em '+val.split('-').reverse().join('/')+'.'};
  return{ok:true,validade:val}
}
let LIC={ok:true};
async function checkLic(){
  const c=soDig(S.cfg.grupo.cnpj);
  if(c===CNPJ_AKS){LIC={ok:true,tipo:'proprio'};return render()}
  LIC={ok:false,pend:true};render();
  if(c.length===14&&cnpjValido(c))for(const l of (S.licencas||[])){if(l.cnpj===c){const r=await verificaCodigo(l.codigo,c);if(r.ok){LIC={ok:true,tipo:'licenca',validade:r.validade};return render()}}}
  LIC={ok:false,msg:c.length?(cnpjValido(c)?'Sem licença válida para este CNPJ.':'CNPJ inválido.'):'Informe o CNPJ da empresa.'};render()
}
async function ativar(){
  const c=soDig(S.cfg.grupo.cnpj),code=document.getElementById('licCod').value.trim();
  if(!cnpjValido(c)){LIC.msg='Informe um CNPJ válido em Ajustes.';return render()}
  const r=await verificaCodigo(code,c);
  if(!r.ok){LIC={ok:false,msg:r.msg};return render()}
  S.licencas=(S.licencas||[]).filter(l=>l.cnpj!==c);S.licencas.push({cnpj:c,codigo:code});save();checkLic()
}

function propNum(cliId,data){const c=cli(cliId),d=soDig(c.cnpj).slice(0,4).padEnd(4,'0'),dt=(data||hoje()),base='LAB-'+d+'-'+dt.slice(5,7)+'-'+dt.slice(0,4);
  let n=base,k=1;while(S.props.some(p=>p.num===n)){k++;n=base+'-'+k}return n}
function log(p,t){(p.hist=p.hist||[]).push({em:new Date().toISOString(),t})}
function waLink(tel,txt){let d=soDig(tel);if(d.length&&!d.startsWith('55')&&d.length<=11)d='55'+d;return 'https://wa.me/'+d+'?text='+encodeURIComponent(txt)}
async function copia(txt){try{await navigator.clipboard.writeText(txt);toast('Copiado.')}catch(e){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Copiado.')}catch(x){toast('Não deu para copiar aqui.')}t.remove()}}
function copiaId(id){const e=document.getElementById(id);copia(e.value!==undefined?e.value:e.textContent)}

/* ===== LÓGICA DO PROCESSO ===== */
const saud=()=>{const h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'};
const pn=c=>(c.contato||'').trim().split(/\s+/)[0];
const LAB=()=>S.cfg.lab;
const ult=p=>(p.fu&&p.fu.ult)||p.enviada||p.criada;
function proxAcao(p){const d=hoje(),L=LAB();
  if(p.status==='solicitada')return{t:'Montar e enviar a proposta',u:difDias(p.criada,d)>=1?2:1};
  if(p.status==='analise'){const n=difDias(ult(p),d),f=L.cobrarDias||3;return n>=f?{t:'Cobrar andamento ('+n+' dias sem contato)',u:2}:{t:'Aguardando o cliente (cobrar em '+(f-n)+' dia(s))',u:0}}
  if(p.status==='nao_aprovada'){if(!p.rej||!p.rej.motivo)return{t:'Registrar o motivo da recusa',u:2};if(!p.rej.pergEm)return{t:'Perguntar ao cliente por que não aprovou',u:2};if(!p.rej.resp)return{t:'Anotar a resposta do cliente',u:1};return{t:'Encerrada',u:0}}
  if(p.status==='aprovada'){const e=p.etapa;
    if(!(p.fisc&&p.fisc.art)&&e!=='pago')return{t:'Emitir a ART',u:2,k:'art'};
    if(e==='os')return{t:'Aguardando material (conferir no recebimento)',u:1};
    if(e==='recebido')return{t:'Ensaiar e emitir o relatório',u:1};
    if(e==='ensaiado')return{t:'Entregar o material ao cliente',u:2};
    if(e==='entregue')return{t:'Emitir a nota fiscal',u:2};
    if(e==='faturado'){const v=p.cob&&p.cob.venc,n=v?difDias(hoje(),v):0;return n<0?{t:'Cobrança VENCIDA há '+(-n)+' dia(s)',u:2}:n===0?{t:'Vence hoje: cobrar',u:2}:{t:'Aguardando pagamento (vence '+fd(v)+')',u:n<=2?1:0}}
    return{t:'Concluída e paga',u:0}}
  return{t:'',u:0}}
function etapaIdx(p){return ETAPAS.findIndex(e=>e[0]===p.etapa)}

let SGD=false;
function abreAss(id,tipo){const p=getP(id),c=cli(p.cli);SGD=false;$('#ovl').innerHTML=`<div class="ovl"><div class="sheet"><h3 style="margin-top:0">Assinatura do cliente</h3><p class="hint">${tipo==='ent'?'Entrega do material ensaiado.':'Recebimento do material.'} Passe o celular ao cliente para assinar com o dedo.</p><label>Nome de quem assina</label><input id="as_n" value="${esc(c.contato||'')}"><label>CPF ou RG</label><input id="as_d" inputmode="numeric"><label style="margin-top:8px">Assine abaixo</label><canvas id="sg" width="720" height="300"></canvas><div class="fl" style="margin-top:12px"><button class="b" onclick="assOk('${id}','${tipo}')">Confirmar assinatura</button><button class="b s" onclick="limpaAss()">Limpar</button><button class="b s" onclick="closeO()">Voltar</button></div></div></div>`;
  const cv=$('#sg'),x=cv.getContext('2d');x.lineWidth=4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#0b1f4d';let dw=false,l=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{dw=true;l=pt(e);cv.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(l[0],l[1]);x.lineTo(l[0]+.1,l[1]+.1);x.stroke();SGD=true;e.preventDefault()};
  cv.onpointermove=e=>{if(!dw)return;const q=pt(e);x.beginPath();x.moveTo(l[0],l[1]);x.lineTo(q[0],q[1]);x.stroke();l=q;e.preventDefault()};
  cv.onpointerup=cv.onpointercancel=()=>{dw=false}}
function limpaAss(){const cv=$('#sg');cv.getContext('2d').clearRect(0,0,cv.width,cv.height);SGD=false}
async function hashTxt(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,16).toUpperCase().replace(/(.{4})/g,'$1-').slice(0,19)}catch(e){return''}}
async function assOk(id,tipo){const p=getP(id),n=$('#as_n').value.trim(),dc=$('#as_d').value.trim();if(!n)return toast('Informe o nome.');if(!SGD)return toast('Falta a assinatura.');

  const em=new Date().toISOString(),base=[p.num,tipo,n,dc,em,JSON.stringify(p.os.itens.map(i=>[i.d,i.qp,i.qr]))].join('|');
  const ass={nome:n,doc:dc,em,img:t.toDataURL('image/jpeg',.85),cod:await hashTxt(base)};
  if(tipo==='ent'){p.os.entAss=ass}else{p.os.termo=ass}log(p,'Termo de '+(tipo==='ent'?'entrega':'recebimento')+' assinado por '+n);save();closeO();toast('Assinatura registrada.');render()}

const b64b=u=>Uint8Array.from(atob(u.split(',')[1]),c=>c.charCodeAt(0));
function jpgDe(src){try{if(!src||!/^data:image\/jpe?g/.test(src))return null;const b=b64b(src),i=jpgInfo(b);return i&&i.c===3?{b,w:i.w,h:i.h}:null}catch(e){return null}}

function marca(pg){const C=[226,233,246],cx=PW/2,cy=PH/2+20,k=1.9;const P=(pts,lw)=>{for(let i=0;i<pts.length-1;i++)pg.line(cx+pts[i][0]*k,cy+pts[i][1]*k,cx+pts[i+1][0]*k,cy+pts[i+1][1]*k,C,lw||3)};
  P([[-22,-95],[-22,-40],[-70,45],[-62,60],[62,60],[70,45],[22,-40],[22,-95],[-22,-95]]);P([[-38,-100],[38,-100]]);P([[-52,15],[52,15]],2.2);
  P([[-30,35],[-18,25],[-6,35],[6,25],[18,35],[30,25]],2);
  P([[-130,-60],[-130,40],[-100,40],[-100,-60],[-130,-60]],2.5);P([[-130,-30],[-100,-30]],2);
  P([[105,-70],[132,-70],[132,45],[105,45],[105,-70]],2.5);P([[105,-20],[132,-20]],2);P([[105,15],[132,15]],2);
  P([[10,-20],[-8,12],[4,12],[-6,40],[18,5],[6,5],[10,-20]],2.2);

async function entregaPdf(bytes,nome,modo){const blob=new Blob([bytes],{type:'application/pdf'});
  if(navigator.canShare){const f=new File([blob],nome,{type:'application/pdf'});if(navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:nome});return}catch(e){if(e&&e.name==='AbortError')return}}}
  const u=URL.createObjectURL(blob);
  try{const a=document.createElement('a');a.href=u;a.download=nome;a.target='_blank';document.body.appendChild(a);a.click();a.remove()}catch(e){}
  setTimeout(()=>{try{window.open(u,'_blank')}catch(e){}},400);
  setTimeout(()=>URL.revokeObjectURL(u),120000);toast('PDF gerado: '+nome)}

const LF=[['razao','Razão social (da empresa jurídica)'],['fantasia','Nome fantasia'],['cnpj','CNPJ do laboratório'],['im','Inscrição municipal'],['end','Endereço do laboratório'],['cidade','Cidade/UF'],['tel','Telefone'],['email','E-mail'],['redes','Redes sociais (Instagram, site)'],['resp','Engenheira(o) responsável (nome)'],['crea','CREA'],['cnae','CNAE do serviço (confirme com o contador)'],['itemLC','Item da lista de serviços LC 116 (confirme com o contador)'],['aliq','Alíquota do ISS (%)'],['pix','Chave PIX'],['banco','Dados bancários (opcional)'],['prazoEntrega','Prazo de execução padrão']];
function vCfg(){const L=LAB();MAIN(`<div class="card"><div class="sec"><i></i>Identidade da proposta</div><p class="hint" style="margin-top:-4px">Logo, assinatura e carimbo saem nos PDFs. Use foto ou imagem; fundo branco é o ideal.</p>${[['logo','Logo da Automattic Lab'],['assin','Assinatura da engenheira'],['carimbo','Carimbo da empresa']].map(([k,t])=>`<div class="emp"><div style="flex:1;min-width:0"><b style="font-size:14px">${t}</b><div style="margin-top:6px">${L[k]?`<img src="${L[k]}" style="max-height:60px;max-width:180px;border:1px solid var(--bd);border-radius:8px;background:#fff">`:'<span class="hint">Não enviado</span>'}</div></div><div class="fl"><label class="b s" style="display:inline-block;margin:0;cursor:pointer;padding:8px 12px">${L[k]?'Trocar':'Enviar'}<input type="file" accept="image/*" style="display:none" onchange="imgUp(this,'${k}')"></label>${L[k]?`<button class="b d" style="padding:8px 12px" onclick="S.cfg.lab['${k}']='';if('${k}'==='logo')S.cfg.lab.semLogo=true;save();render()">×</button>`:''}</div></div>`).join('')}</div>
  <div class="card"><div class="sec"><i></i>Dados do laboratório</div><p class="hint" style="margin-top:-4px">Aparecem nos PDFs, na ART e na nota. Preencha o CNPJ para não sair em branco.</p>${LF.map(([k,t])=>`<label>${t}</label><input value="${esc(L[k]||'')}" onchange="S.cfg.lab['${k}']=this.value.trim();save()">`).join('')}<div class="row2"><div><label>Pagamento (dias após a NF)</label><input inputmode="numeric" value="${L.pagDias}" onchange="S.cfg.lab.pagDias=+this.value||15;save()"></div><div><label>Cobrar andamento após (dias)</label><input inputmode="numeric" value="${L.cobrarDias}" onchange="S.cfg.lab.cobrarDias=+this.value||3;save()"></div></div><div class="row2"><div><label>Validade da proposta (dias)</label><input inputmode="numeric" value="${L.validade}" onchange="S.cfg.lab.validade=+this.value||15;save()"></div><div></div></div></div>
  <div class="card"><div class="sec"><i></i>Serviços e valores</div><p class="hint" style="margin-top:-4px">Atalhos do orçamento. Coloque o valor unitário de cada um.</p>${S.cfg.cat.map((c,i)=>`<div class="it" style="grid-template-columns:1fr 54px 90px 28px"><input value="${esc(c.d)}" onchange="S.cfg.cat[${i}].d=this.value;save()"><input value="${esc(c.u)}" onchange="S.cfg.cat[${i}].u=this.value;save()"><input inputmode="decimal" value="${String(c.v||'').replace('.',',')}" placeholder="R$" onchange="S.cfg.cat[${i}].v=num(this.value);save()"><button class="b d" style="padding:6px" onclick="S.cfg.cat.splice(${i},1);save();render()">×</button></div>`).join('')}<button class="b s" onclick="S.cfg.cat.push({d:'',u:'un',v:0});save();render()">+ Serviço</button></div>
  <div class="card"><div class="sec"><i></i>Clientes (${S.clientes.length})</div>${S.clientes.map(c=>`<div class="emp" onclick="editCli('${c.id}')" style="cursor:pointer"><div style="flex:1"><b>${esc(c.nome)}</b><div class="hint">${esc([c.contato,c.wa].filter(Boolean).join(' · '))}</div></div><span style="color:var(--mut)">›</span></div>`).join('')||'<p class="hint">Nenhum cliente ainda.</p>'}<div style="margin-top:8px"><button class="b s" onclick="editCli('')">+ Novo cliente</button></div></div>
  <div class="card"><div class="sec"><i></i>Grupo e licença</div><label>CNPJ do grupo (licença)</label><input value="${esc(S.cfg.grupo.cnpj)}" onchange="S.cfg.grupo.cnpj=this.value;save();checkLic()"><p class="hint">${LIC.tipo==='proprio'?'Liberado para o Grupo AKS.':'Licença ativa até '+(LIC.validade==='0'?'sem vencimento':fd(LIC.validade))}</p></div>
  <div class="card"><div class="sec"><i></i>Backup</div><p class="hint" style="margin-top:-4px">Os dados ficam neste celular. Baixe um backup de vez em quando.</p><div class="fl"><button class="b" onclick="bkExp()">Baixar backup</button><label class="b s" style="display:inline-block;margin:0;cursor:pointer">Restaurar<input type="file" accept=".json,application/json" style="display:none" onchange="bkImp(this)"></label></div></div>`)}
function imgUp(inp,k){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=k==='logo'?700:500,e=Math.min(1,m/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*e);c.height=Math.round(im.height*e);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);S.cfg.lab[k]=c.toDataURL('image/jpeg',.9);save();toast('Imagem salva.');render()};im.onerror=()=>toast('Não consegui ler a imagem.');im.src=r.result};r.readAsDataURL(f)}
function bkExp(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='gestao-aks-backup-'+hoje()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);toast('Backup baixado.')}
function bkImp(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.props||!j.cfg)throw 0;$('#ovl').innerHTML=`<div class="ovl"><div class="sheet"><h3 style="margin-top:0">Restaurar backup?</h3><p>Isto substitui os dados atuais por ${j.props.length} orçamento(s) e ${j.clientes.length} cliente(s) do arquivo.</p><div class="fl"><button class="b d" id="bkok">Restaurar</button><button class="b s" onclick="closeO()">Voltar</button></div></div></div>`;$('#bkok').onclick=()=>{S=Object.assign(defState(),j);save();closeO();toast('Backup restaurado.');render()}}catch(e){toast('Arquivo inválido.')}};r.readAsText(f)}
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
render();checkLic();

</script>
</body>
</html>
