<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#15171a">
<title>Relatório de ensaio · Automattic Lab</title>
<style>
:root{--bg:#f3f2ef;--surface:#fff;--field:#fff;--ink:#15171a;--muted:#6e737a;--line:#cdcac4;--accent:#e8420c;--accent-ink:#fff;--ok:#14753c;--ok-bg:#dff1e6;--bad:#b3261e;--bad-bg:#f8dcd9;--pend:#8a5a00;--pend-bg:#fbefd3;--body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--display:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);overflow-x:hidden}
.wrap{max-width:980px;margin:0 auto;padding:0 12px calc(24px + env(safe-area-inset-bottom,0px))}
.top{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px}
.top .back{font:600 13px var(--display);text-decoration:none;color:var(--accent);padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.logos{display:flex;gap:10px;align-items:center}.logos img{height:34px;width:auto}
.ttl{font:700 17px var(--display);letter-spacing:.03em;text-transform:uppercase}.sub{font-size:12px;color:var(--muted)}
.mode{display:none}
.savest{font-size:12px;padding:4px 8px;border-radius:3px;margin-left:auto}.savest.ok{background:var(--ok-bg);color:var(--ok)}.savest.pend{background:var(--pend-bg);color:var(--pend)}.savest.err{background:var(--bad-bg);color:var(--bad)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:1;min-width:110px;font:600 14px var(--display);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;text-align:left;cursor:pointer;color:var(--ink)}
.tabs button small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}.tabs button[aria-selected=true] small{color:#c9ccd1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:16px;overflow:hidden}
.card>h2{display:flex;align-items:center;gap:10px;margin:0;padding:12px 16px;font:700 14px var(--display);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line);background:var(--bg)}
.card>h2 .n{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;padding:16px}
.gtabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 0}
.gtab{white-space:nowrap;font:600 13px var(--display);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:4px;cursor:pointer}
.gtab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.gtab .cnt{margin-left:6px;font-size:11px;background:var(--bad-bg);padding:1px 6px;border-radius:9px;color:var(--ink)}.gtab .cnt:empty{display:none}.gtab.on:not([aria-selected=true]){border-color:var(--ok)}
details.met{padding:10px 16px 0}details.met summary{cursor:pointer;font-size:13px;color:var(--muted)}
.metx{white-space:pre-wrap;font-size:12px;background:var(--bg);padding:10px;border-radius:4px;margin:6px 0}
#modeBanner{display:none!important}
.grid .full{grid-column:1/-1}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;min-width:0}
label.f input,label.f select,label.f textarea{font:400 15px var(--body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:4px;padding:9px 10px;min-height:42px;width:100%;min-width:0}
label.f textarea{min-height:84px;resize:vertical}
label.f input[readonly]{background:transparent;border-style:dashed;font-family:var(--mono);font-size:14px}
.hint{font-weight:400;font-size:11px;color:var(--muted)}
.group{border-top:3px solid var(--ink);margin:0}
.group:first-of-type{border-top:0}
.group>.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px 0;flex-wrap:wrap}
.group>.gh b{font:700 15px var(--display);letter-spacing:.05em;text-transform:uppercase}
.subh{font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 16px 0}
.item{border-top:1px solid var(--line)}
.item-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px 0;flex-wrap:wrap}
.item-h b{font:600 14px var(--display);letter-spacing:.04em;text-transform:uppercase}
.chip{display:inline-block;font:600 12px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:3px}
.chip.ok,.chip.ap{background:var(--ok-bg);color:var(--ok)}.chip.bad,.chip.rep{background:var(--bad-bg);color:var(--bad)}.chip.pend{background:var(--pend-bg);color:var(--pend)}
.seg{display:flex;gap:0;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:6px;padding:9px 12px;border:1px solid var(--line);margin-left:-1px;cursor:pointer;font-size:14px;color:var(--ink);background:var(--field);min-height:42px;font-weight:400}
.seg label:first-child{margin-left:0;border-radius:4px 0 0 4px}.seg label:last-child{border-radius:0 4px 4px 0}
.seg input{accent-color:var(--accent)}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn{font:600 13px var(--display);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:4px;cursor:pointer;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 10px;min-height:34px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.6;cursor:wait}
.row-actions{padding:14px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)}
.bar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;box-shadow:0 -4px 16px rgba(0,0,0,.12);padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.bar .sum{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;font-size:14px;z-index:20;max-width:90vw}
.refs{padding:0 16px 16px;color:var(--muted);font-size:12px}
.note{margin:14px 16px 0;padding:10px 12px;border-radius:4px;background:var(--pend-bg);color:var(--pend);font-size:13px}
table.ref{border-collapse:collapse;font-size:12.5px;width:100%}
table.ref th,table.ref td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right;font-family:var(--mono)}
table.ref th:first-child,table.ref td:first-child{text-align:left}
table.tx th,table.tx td{text-align:left;font-family:var(--body);vertical-align:top}
.scroll{overflow-x:auto;padding:0 16px 16px}
.ins-card{border-top:1px solid var(--line)}
.ins-card:first-of-type{border-top:0}
.thumb{max-height:90px;max-width:100%;border:1px solid var(--line);border-radius:3px;background:#fff}
canvas.pad{width:100%;max-width:420px;aspect-ratio:3/1;background:#fff;border:1px solid var(--line);border-radius:4px;touch-action:none;cursor:crosshair}
.sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;padding:16px}
.sigs .box{display:flex;flex-direction:column;gap:8px;min-width:0}
.sigs .box b{font:600 13px var(--display);letter-spacing:.05em;text-transform:uppercase}
.sigimg{max-width:260px;max-height:90px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:4px}
.tarja{padding:10px 16px;font:700 16px var(--display);letter-spacing:.08em;text-transform:uppercase;text-align:center;border-radius:4px;margin:14px 16px}
.tarja.ap{background:var(--ok);color:#fff}.tarja.rep{background:var(--bad);color:#fff}.tarja.pend{background:var(--pend);color:#fff}
@media (prefers-reduced-motion:no-preference){.chip{transition:background .15s}}
</style>

    <span class="savest ok" id="savest">Nada a salvar</span><button class="btn small" data-act="savenow" id="savebtn">Salvar agora</button>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="main"></main>
</div>
<div id="toast" class="toast" hidden></div>

let DB=null,ME={id:"local",name:""},MODE="local",CAN_WRITE=true;
const LOCKEY="ensaio-diel-v3-loc";let LOC={};const LISTEN=[];
try{LOC=JSON.parse(localStorage.getItem(LOCKEY)||"{}")}catch(e){}
function locSave(){try{localStorage.setItem(LOCKEY,JSON.stringify(LOC))}catch(e){toast("Sem espaço para salvar neste navegador.")}}
const colRows=col=>Object.keys(LOC).filter(k=>k.startsWith(col+"/")&&k.indexOf("/",col.length+1)<0).map(k=>Object.assign({id:k.slice(col.length+1)},LOC[k]));
const B={
 async get(p){if(DB){const s=await DB.doc(p).get();return s.exists?s.data():null}return LOC[p]?clone(LOC[p]):null},
 async set(p,d){if(DB){await DB.doc(p).set(clone(d));return}LOC[p]=clone(d);locSave();const col=p.slice(0,p.lastIndexOf("/"));LISTEN.filter(l=>l.col===col).forEach(l=>l.cb(colRows(col)))},
 async del(p){if(DB){await DB.doc(p).delete();return}delete LOC[p];locSave();const col=p.slice(0,p.lastIndexOf("/"));LISTEN.filter(l=>l.col===col).forEach(l=>l.cb(colRows(col)))},
 watch(col,cb){if(DB){return DB.collection(col).onSnapshot(s=>cb(s.docs.map(d=>Object.assign({id:d.id},d.data()))),e=>console.warn("watch",col,e))}
   const l={col,cb};LISTEN.push(l);setTimeout(()=>cb(colRows(col)),0);return()=>{const i=LISTEN.indexOf(l);if(i>=0)LISTEN.splice(i,1)}},
 async list(col){if(DB){const s=await DB.collection(col).get();return s.docs.map(d=>Object.assign({id:d.id},d.data()))}return colRows(col)},
 async lock(name){if(!DB)return true;for(let i=0;i<8;i++){try{const r=await DB.doc("locks/"+name).acquire({holder:ME.id+"-"+uid(),ttlMs:15000});if(r.acquired)return true}catch(e){}await wait(1200)}return false}
};
/* arquivos grandes (certificados, ART) em partes de 200 mil caracteres */
const FILEC={};
async function saveFile(dataUrl,name){
  const fid="f"+uid(),mime=(dataUrl.match(/^data:([^;]+);/)||[])[1]||"application/octet-stream",n=Math.ceil(dataUrl.length/200000);
  for(let i=0;i<n;i++)await B.set("files/"+fid+"/parts/"+i,{d:dataUrl.slice(i*200000,(i+1)*200000)});
  await B.set("files/"+fid,{name:name||"arquivo",mime,n,size:dataUrl.length});FILEC[fid]=dataUrl;return{fid,mime,name:name||"arquivo"}}
async function loadFile(fid){
  if(!fid)return null;if(FILEC[fid])return FILEC[fid];
  const m=await B.get("files/"+fid);if(!m)return null;let s="";
  for(let i=0;i<m.n;i++){const p=await B.get("files/"+fid+"/parts/"+i);if(!p)return null;s+=p.d}
  FILEC[fid]=s;return s}
async function delFile(fid){if(!fid)return;try{const m=await B.get("files/"+fid);if(m)for(let i=0;i<m.n;i++)await B.del("files/"+fid+"/parts/"+i);await B.del("files/"+fid)}catch(e){}delete FILEC[fid]}

  const st=it.parecer==="auto"?auto:it.parecer;

function refresh(initial){
  if(S.tab!=="new")return;
  R.groups.forEach((g,gi)=>{let a=0,r=0,p=0;g.items.forEach((it,i)=>{const e=evalItem(g,it);
    const chip=document.querySelector(`[data-chip="${gi}-${i}"]`);if(chip){chip.className="chip "+e.st;chip.textContent=stTxt[e.st]}
    const why=document.querySelector(`[data-why="${gi}-${i}"]`);if(why)why.textContent=it.parecer==="auto"?(e.st==="pend"?e.need:e.reasons.length?"Reprovado automaticamente: "+e.reasons.join("; ")+".":(TYPES[g.type].noFuga?"Resultado do ensaio conforme.":"Corrente de fuga dentro do limite de "+fmtMA(e.lim)+" mA.")):"Parecer definido manualmente.";
    if(e.st==="ap")a++;else if(e.st==="rep")r++;else p++});
    const gc=document.querySelector(`[data-gchip="${gi}"]`);if(gc){gc.className="chip "+(r?"rep":p?"pend":"ap");gc.textContent=a+" aprov. / "+r+" reprov."+(p?" / "+p+" pend.":"")}
    const gn=document.querySelector(`[data-gcnt="${gi}"]`);if(gn){const n=grpUsed(g)?g.items.filter(itemFilled).length:0;gn.textContent=n?String(n):"";gn.parentElement.classList.toggle("on",n>0)}});
  const c=counts();
  $("#sum").innerHTML=`<span class="chip ap">${c.a} aprovado${c.a!==1?"s":""}</span><span class="chip rep">${c.r} reprovado${c.r!==1?"s":""}</span>${c.p?`<span class="chip pend">${c.p} pendente${c.p!==1?"s":""}</span>`:""}<span>de ${c.t} item${c.t!==1?"ns":""}</span>`;
  const tj=c.p?["pend",c.p+" ITEM(NS) PENDENTE(S)"]:c.r?["rep",c.r+" ITEM(NS) REPROVADO(S) DE "+c.t]:["ap","TODOS OS "+c.t+" ITENS APROVADOS"];
  $("#resumo").innerHTML=`<div class="scroll" style="padding-top:12px"><table class="ref tx"><tr><th>Grupo</th><th>Classe</th><th>Total</th><th>Aprovados</th><th>Reprovados</th></tr>${R.groups.map((g,i)=>c.per[i].u?`<tr><td>${esc(grpTitle(g))}</td><td>${esc(g.classe)}</td><td>${g.items.length}</td><td>${c.per[i].a}</td><td>${c.per[i].r}</td></tr>`:"").join("")||`<tr><td colspan="5">Nenhuma aba preenchida ainda.</td></tr>`}<tr><td><b>Total</b></td><td></td><td><b>${c.t}</b></td><td><b>${c.a}</b></td><td><b>${c.r}</b></td></tr></table></div><div class="tarja ${tj[0]}">${tj[1]}</div>`;
  if(!R.conclManual)R.concl=autoConcl();
  const ta=$("#t_concl");if(ta&&(initial||!R.conclManual))ta.value=R.concl;
  autoNormas();{const a=$("#a_nt"),b=$("#a_nc");if(a&&document.activeElement!==a)a.value=R.amb.normasTec;if(b&&document.activeElement!==b)b.value=R.amb.normasComp}
  updateRefs();saveDraft();
}

const fmtCode=h=>h?h.slice(0,12).toUpperCase().replace(/(.{4})(?=.)/g,"$1-"):"";
async function sha256(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return ("00000000"+(h>>>0).toString(16)).repeat(8).slice(0,64)}}

/* ---- assinatura / imagens ---- */
function initPad(id){
  const c=document.getElementById(id);if(!c)return;c.width=600;c.height=200;
  const ctx=c.getContext("2d");ctx.lineWidth=3.5;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#111";
  const me=myProfile();if(me.sig){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,c.width,c.height);im.src=me.sig}
  let d=false,l=null;const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.onpointerdown=e=>{d=true;PADBUSY=true;l=pos(e);try{c.setPointerCapture(e.pointerId)}catch(x){}ctx.beginPath();ctx.moveTo(l[0],l[1]);ctx.lineTo(l[0]+.1,l[1]);ctx.stroke()};
  c.onpointermove=e=>{if(!d)return;const p=pos(e);ctx.beginPath();ctx.moveTo(l[0],l[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();l=p};
  c.onpointerup=c.onpointercancel=()=>{if(!d)return;d=false;PADBUSY=false;setMe({sig:c.toDataURL("image/png")},true)}}
function setMe(patch,now){
  let p=TEAM.find(x=>x.id===ME.id);if(!p){p={id:ME.id,nome:ME.name||"",reg:"",funcao:"tec",sig:""};TEAM.push(p)}
  Object.assign(p,patch);const cur=()=>{const q=TEAM.find(x=>x.id===ME.id)||p;const {id,...d}=q;return d};
  if(now){clearTimeout(wq["team/"+ME.id]);B.set("team/"+ME.id,cur()).catch(e=>toast("Não foi possível salvar o perfil: "+(e&&e.message||e)))}else saveDebounced("team/"+ME.id,cur)}
function readFile(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>res(fr.result);fr.readAsDataURL(file)})}
function loadImage(file,maxW,type,q){return readFile(file).then(src=>new Promise((res,rej)=>{const im=new Image();im.onerror=rej;im.onload=()=>{
  const k=Math.min(1,maxW/im.width);const cv=document.createElement("canvas");cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
  const x=cv.getContext("2d");if(type==="image/jpeg"){x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height)}x.drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL(type,q))};im.src=src}))}
async function prepAttachment(file){ // devolve dataURL; imagens são reduzidas, PDF limitado a 6 MB
  if(file.type==="application/pdf"){if(file.size>6*1024*1024)throw new Error("PDF acima de 6 MB. Reduza o arquivo antes de anexar.");return readFile(file)}
  return loadImage(file,1600,"image/jpeg",.8)}

function validate(){
  const p=[];if(!R.h.empresa.trim())p.push("Informe o cliente.");
  if(!R.h.dataEnsaio)p.push("Informe a data da realização dos ensaios.");
  if(num(R.amb.temp)===null)p.push("Informe a temperatura ambiente.");
  if(num(R.amb.ura)===null)p.push("Informe a umidade relativa (URA).");
  if(!R.eng||!person(R.eng))p.push("Escolha o engenheiro responsável.");
  if(!R.tec||!person(R.tec))p.push("Escolha o responsável pelo ensaio (cadastre em Configurações).");
  const used=R.groups.filter(grpUsed);if(!used.length)p.push("Preencha pelo menos uma aba de equipamento com itens ensaiados.");
  used.forEach(g=>{const t=TYPES[g.type],gn=t.tab+": ";
    if(!t.noFuga){if(!g.tensao.trim()||num(g.tensao)===null)p.push(gn+"informe a tensão de ensaio.");if(!g.tempo.trim())p.push(gn+"informe o tempo de aplicação.")}
    if(t.free&&!g.titulo.trim())p.push(gn+"informe o nome do item.");
    g.items.forEach((it,i)=>{const e=evalItem(g,it);const nm=gn+itemName(g,i)+": ";
      if(!it.serie.trim())p.push(nm+"informe o número de série ou marque 'Não possui número de série'.");
      if(t.lado&&!it.lado)p.push(nm+"informe o lado (direita ou esquerda).");
      if(!t.noFuga){if(e.f===null)p.push(nm+(t.dual?"informe a menor e a maior leitura de corrente.":"informe a corrente de fuga."));else if(e.st==="pend"&&e.lim===null)p.push(nm+"informe o limite de corrente de fuga ou escolha o parecer.")}
      if(t.func&&!it.func)p.push(nm+"informe o resultado: "+t.func.toLowerCase()+".")})});
  insOn().forEach(x=>{if(x.val&&x.val<R.h.dataEnsaio)p.push("Calibração vencida: "+(x.nome||"instrumento")+" (validade "+brDate(x.val)+").")});
