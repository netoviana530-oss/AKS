<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ponto AKS</title>
<style>

:root{--navy:#071633;--blue:#0b3d91;--blue2:#1d63e0;--red:#e5383b;--yel:#ffc928;--bg:#eef2f8;--ink:#0f1b33;--mut:#667085;--bd:#e3e8f1;--ok:#0a7f4f;--bad:#b42318;--sh:0 10px 30px rgba(7,22,51,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;color:var(--ink);background:var(--bg) radial-gradient(circle at 1px 1px,rgba(11,61,145,.07) 1px,transparent 0) 0 0/22px 22px;padding-bottom:calc(88px + env(safe-area-inset-bottom));min-height:100vh}
body::before{content:"";position:fixed;left:0;right:0;bottom:0;height:75vh;background:var(--wm) no-repeat center bottom/min(1150px,160vw) auto;pointer-events:none;z-index:0}
header{position:sticky;top:0;z-index:6;color:#fff;padding:14px 16px 17px;display:flex;align-items:center;gap:12px;background:var(--wmh) no-repeat right -30px center/auto 170%,linear-gradient(120deg,#06122b,#0b3d91 68%,#1d63e0);box-shadow:0 8px 24px rgba(7,22,51,.28)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#1d63e0 0 33.3%,#e5383b 33.3% 66.6%,#ffc928 66.6%)}
header img{height:44px;max-width:96px;object-fit:contain;background:#fff;border-radius:12px;padding:3px 5px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
header h1{font-size:19px;margin:0;white-space:nowrap;letter-spacing:.2px;font-weight:800}
header small{display:block;opacity:.78;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.hcomp{margin-left:auto;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;justify-content:space-around;gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border-top:1px solid var(--bd);box-shadow:0 -8px 24px rgba(7,22,51,.06)}
nav button{flex:1;max-width:120px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px/1 inherit;color:var(--mut);padding:8px 2px;border-radius:14px;cursor:pointer;transition:.15s}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--blue);background:rgba(29,99,224,.11)}
main{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:16px 14px}
.card{background:rgba(255,255,255,.88);border:1px solid rgba(227,232,241,.9);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:var(--sh);animation:rise .35s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h3{font-size:16px}
.hero{background:linear-gradient(135deg,#071633,#0b3d91 70%,#1d63e0);color:#fff;border:0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,201,40,.45),transparent 65%)}
.hero .eyebrow{font-size:12px;opacity:.75;text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.hero .big{font-size:26px;font-weight:800;margin:2px 0 10px}
.hero label{color:rgba(255,255,255,.75)}
.hero input,.hero select{background:rgba(255,255,255,.96)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>*{flex:1;min-width:130px}
label{display:block;font-size:11.5px;color:var(--mut);font-weight:700;margin-bottom:4px;letter-spacing:.2px}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:12px;font:inherit;background:#fff;transition:.15s;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue2);box-shadow:0 0 0 4px rgba(29,99,224,.15)}
input[type=checkbox]{width:auto}
button.b{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;box-shadow:0 6px 14px rgba(11,61,145,.28);transition:transform .12s,box-shadow .12s}
button.b:active{transform:scale(.97)}
button.b.s{background:#fff;color:var(--blue);border:1.5px solid rgba(11,61,145,.3);box-shadow:none}
button.b.d{background:linear-gradient(135deg,#ef5350,#b42318);box-shadow:0 6px 14px rgba(180,35,24,.25)}
.emp{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:11px 0;border-bottom:1px solid var(--bd)}
.emp:last-child{border:0}
.emp .mid{flex:1;min-width:150px}
.emp .acts{display:flex;gap:8px}
@media(max-width:560px){.emp .acts{width:100%}.emp .acts .b{flex:1}}.emp b{display:block}.emp span{color:var(--mut);font-size:13px}
.av{flex:none;width:42px;height:42px;border-radius:14px;color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px;box-shadow:0 4px 10px rgba(7,22,51,.18)}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#e8f0ff;color:var(--blue);margin-right:4px}
.kpis.card{background:none;border:0;box-shadow:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:rgba(255,255,255,.95);border-radius:16px;padding:12px 12px 12px 14px;box-shadow:var(--sh);border-left:5px solid var(--blue2);animation:rise .4s both}
.kpi:nth-child(2){border-color:var(--red)}.kpi:nth-child(3){border-color:#12a150}.kpi:nth-child(4){border-color:var(--yel)}.kpi:nth-child(5){border-color:#7c3aed}.kpi:nth-child(6){border-color:var(--navy)}
.kpi small{color:var(--mut);display:block;font-size:11.5px;font-weight:600}
.kpi b{font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.ovl{position:fixed;inset:0;background:rgba(6,18,43,.55);backdrop-filter:blur(6px);z-index:20;overflow:auto;padding:12px}
.sheet{background:#fff;max-width:780px;margin:16px auto;border-radius:22px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:rise .3s both}
.hint{font-size:12px;color:var(--mut)}
table.pt{width:100%;border-collapse:collapse;font-size:13px}
table.pt th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
table.pt td,table.pt th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left}
table.pt tr:nth-child(even) td{background:rgba(238,242,248,.5)}
table.pt td.r,table.pt th.r{text-align:right;font-variant-numeric:tabular-nums}
/* contracheque */
.slip{position:relative;border:1.5px solid #0f1b33;border-radius:8px;padding:16px 12px 12px;font-size:12px;color:#000;background:#fff var(--wms) no-repeat center 64%/80% auto;margin-bottom:14px;page-break-inside:avoid;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.slip::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#1d63e0 0 33.3%,#e5383b 33.3% 66.6%,#ffc928 66.6%)}
.slip .top{display:flex;gap:12px;align-items:center;border-bottom:1.5px solid #0f1b33;padding-bottom:9px}
.slip .top img{max-height:62px;max-width:130px;object-fit:contain}
.slip .top h2{margin:0;font-size:15px;color:#071633}.slip .top div{flex:1}
.slip .tit{text-align:center;font-weight:800;margin:9px 0;letter-spacing:.6px;color:#0b3d91}
.slip .box{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;border:1px solid #0f1b33;border-radius:6px;padding:7px;margin-bottom:9px;background:rgba(238,242,248,.7)}
.slip table{width:100%;border-collapse:collapse;table-layout:fixed}
.slip td{word-break:break-word}
.slip th:nth-child(1){width:11%!important}.slip th:nth-child(3){width:15%!important}.slip th:nth-child(4),.slip th:nth-child(5){width:19%!important}
@media(max-width:560px){.sheet{padding:12px;margin:8px auto}.slip{font-size:11px;padding:14px 8px 10px}.slip th{font-size:9.5px;padding:3px 2px}.slip td{padding:2px 3px}.slip .box{grid-template-columns:1fr}.slip .liq{font-size:13px}}
.slip th{background:#0b3d91;color:#fff;border:1px solid #0b3d91;padding:4px 5px;font-size:11px}
.slip td{border-left:1px solid #9aa7bd;border-right:1px solid #9aa7bd;padding:2.5px 5px}
.slip td.r{text-align:right}
.slip tr.tot td{border:1px solid #0f1b33;font-weight:800;background:rgba(238,242,248,.85)}
.slip .liq{display:flex;justify-content:space-between;border-radius:8px;padding:9px 12px;margin:9px 0;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(120deg,#071633,#0b3d91);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.slip .bases{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border:1px solid #0f1b33;border-radius:6px;padding:6px;font-size:11px;background:rgba(238,242,248,.7)}
.slip .ass{margin-top:28px;display:flex;gap:22px;font-size:11px}.slip .ass div{flex:1;border-top:1px solid #0f1b33;padding-top:3px;text-align:center}
#printArea{display:none}
@media print{body{background:#fff}body::before{display:none}header,nav,main,.ovl{display:none!important}#printArea{display:block}.slip{margin:0 0 8mm}}

body{padding-bottom:30px}
.chip.w{background:#fff4d6;color:#8a5a00}.chip.g{background:#e3f6ec;color:#0a7f4f}.chip.r{background:#fde8e8;color:#b42318}
.clock{font-size:46px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin:2px 0}
.bt{display:block;width:100%;padding:22px 16px;font-size:20px;border-radius:20px}
.alert{background:#fde8e8;border:1px solid #f3b3ae;color:#7a1710;border-radius:16px;padding:12px 14px;margin-bottom:14px;font-weight:700;animation:rise .3s both}
.pl{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);gap:8px}.pl:last-child{border:0}
.pl b{font-variant-numeric:tabular-nums}
.sel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sel button{padding:12px 8px;font-size:13px}
.prev{width:100%;max-height:260px;object-fit:cover;border-radius:16px;margin:8px 0;border:1px solid var(--bd)}
.sec{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px;font-weight:800;color:var(--navy)}.sec i{width:6px;height:18px;border-radius:3px;background:linear-gradient(var(--blue2),var(--red))}
.big2{font-size:34px;font-weight:800;margin:0 0 4px}
</style>
</head>

<main id="main"></main>
<div id="ovl"></div>

const KEY='aks_ponto_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const p2=n=>String(n).padStart(2,'0');
const hhmm=d=>p2(d.getHours())+':'+p2(d.getMinutes());
const dkey=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const DIAS=['domingo','segunda','terça','quarta','quinta','sexta','sábado'],MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,3200)}
const TIPOS={entrada:'Entrada',saida_almoco:'Saída para o almoço',volta_almoco:'Volta do almoço',saida:'Fim do expediente',extra_ini:'Início de hora extra',extra_fim:'Fim de hora extra'};
const ABRE=['entrada','volta_almoco','extra_ini'];
const PROX={'':'entrada',entrada:'saida_almoco',saida_almoco:'volta_almoco',volta_almoco:'saida',saida:'extra_ini',extra_ini:'extra_fim',extra_fim:'extra_ini'};
const HORA_TIPO={entrada:'h_ent',saida_almoco:'h_alm',volta_almoco:'h_vol',saida:'h_sai'};
let S={u:'',k:'',t:'',cfg:null,marc:[],avisos:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Memória do aparelho cheia. Fale com a gestora.')}}
/* convite: #c=base64url({u,k,t}) */
(function(){const m=location.hash.match(/c=([^&]+)/);if(!m)return;try{const j=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));
  if(j.u&&j.k&&j.t){if(S.t!==j.t){S={u:j.u.replace(/\/+$/,''),k:j.k,t:j.t,cfg:null,marc:[],avisos:{}}}else{S.u=j.u.replace(/\/+$/,'');S.k=j.k}save()}}catch(e){}
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}})();
async function rpc(fn,body){
  const r=await fetch(S.u+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:S.k,Authorization:'Bearer '+S.k},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>null);if(!r.ok){const e=new Error((j&&j.message)||('erro '+r.status));e.status=r.status;throw e}return j}
const hojeKey=()=>dkey(new Date());
const doDia=k=>S.marc.filter(m=>dkey(new Date(m.ts))===k).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
const ativas=l=>l.filter(m=>!m.cancelada).map(m=>m.pedido?(m.novo_ts?{...m,tipo:m.novo_tipo,ts:m.novo_ts}:null):m).filter(Boolean).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
function proximo(){const h=ativas(doDia(hojeKey()));return PROX[h.length?h[h.length-1].tipo:'']}
function minHM(s){const m=String(s||'').match(/^(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null}
function horasDia(list){let o=null,t=0;for(const m of ativas(list)){const ts=new Date(m.ts).getTime();if(ABRE.includes(m.tipo)){o=ts}else if(o!==null){t+=ts-o;o=null}}return t/36e5}
const fmtH=h=>{const m=Math.round(h*60);return Math.floor(m/60)+'h'+p2(m%60)};
/* ---- sincronização ---- */
let syncing=false;
async function sync(){if(syncing||!S.t||!S.u)return;syncing=true;
  try{
    for(const m of S.marc.filter(x=>!x.sync)){
      await rpc('ponto_bater',{p_token:S.t,p_tipo:m.tipo,p_ts:m.ts,p_lat:m.lat??null,p_lon:m.lon??null,p_prec:m.prec??null,p_foto:m.foto||null});
      m.sync=true;delete m.foto;save()}
    const d=new Date();d.setDate(d.getDate()-1);d.setHours(0,0,0,0);
    const srv=await rpc('ponto_hoje',{p_token:S.t,p_desde:d.toISOString()});
    for(const s of srv){const ts=new Date(s.ts).getTime();const lo=S.marc.find(m=>m.tipo===s.tipo&&Math.abs(new Date(m.ts).getTime()-ts)<1000);if(lo){lo.cancelada=!!s.cancelada;lo.pedido=!!s.pedido;lo.novo_tipo=s.novo_tipo||null;lo.novo_ts=s.novo_ts||null}else S.marc.push({id:uid(),tipo:s.tipo,ts:new Date(s.ts).toISOString(),sync:true,cancelada:!!s.cancelada,pedido:!!s.pedido,novo_tipo:s.novo_tipo||null,novo_ts:s.novo_ts||null})}
    S.marc=S.marc.filter(m=>Date.now()-new Date(m.ts)<20*864e5);save();S.erro='';
  }catch(e){S.erro=(e.status===400||e.status===401||e.status===403||/código/.test(e.message))?'invalido':'rede';if(S.erro==='invalido'&&/código/.test(e.message)){}}
  syncing=false;render()}
async function carregaCfg(){if(!S.t)return;try{S.cfg=await rpc('ponto_cfg',{p_token:S.t});S.erro='';save()}catch(e){if(/código/.test(e.message)){S.erro='revogado'}}render()}
/* ---- bater ponto ---- */
let P=null;
function abrirBater(tipo){P={tipo,foto:null,loc:null,locMsg:'Obtendo localização…'};
  if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{if(!P)return;P.loc={lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),prec:Math.round(p.coords.accuracy)};P.locMsg='Local registrado (precisão ~'+P.loc.prec+' m)';pintaBater()},e=>{if(!P)return;P.locMsg='Sem localização — ative o GPS e a permissão de localização.';pintaBater()},{enableHighAccuracy:true,timeout:20000,maximumAge:0});
  else P.locMsg='Este aparelho não informa localização.';
  pintaBater()}
function pintaBater(){if(!P)return;
  $('#ovl').innerHTML=`<div class="ovl"><div class="sheet"><h3 style="margin-top:0">${TIPOS[P.tipo]}</h3>
  <p class="hint">Hora do aparelho: <b>${hhmm(new Date())}</b></p>
  <label>1. Selfie (obrigatória)</label><input type="file" id="selfie" accept="image/*" capture="user" onchange="tiraFoto(this)">
  ${P.foto?`<img class="prev" src="${P.foto}">`:''}
  <label style="margin-top:8px">2. Local de trabalho</label><div class="${P.loc?'ok':(P.locMsg.startsWith('Obtendo')?'hint':'bad')}" style="font-weight:700;font-size:14px">${esc(P.locMsg)}</div>
  <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="b" style="flex:1;${P.foto?'':'opacity:.5'}" ${P.foto?'':'disabled'} onclick="confirmaBater()">Confirmar ponto</button><button class="b s" onclick="P=null;$('#ovl').innerHTML=''">Cancelar</button></div></div></div>`}
function tiraFoto(inp){const f=inp.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const w=Math.min(360,im.width),h=Math.round(im.height*w/im.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);P.foto=c.toDataURL('image/jpeg',.6);URL.revokeObjectURL(u);pintaBater()};im.onerror=()=>toast('Não consegui abrir a foto.');im.src=u}
function confirmaBater(){if(!P||!P.foto)return;
  const m={id:uid(),tipo:P.tipo,ts:new Date().toISOString(),sync:false,foto:P.foto};if(P.loc){m.lat=P.loc.lat;m.lon=P.loc.lon;m.prec=P.loc.prec}
  S.marc.push(m);save();const t=P.tipo;P=null;$('#ovl').innerHTML='';toast(TIPOS[t]+' registrada às '+hhmm(new Date(m.ts))+(m.lat==null?' (sem local)':''));render();sync()}
function pedirCancel(id){const m=S.marc.find(x=>x.id===id);if(!m)return;
  $('#ovl').innerHTML=`<div class="ovl"><div class="sheet"><h3 style="margin-top:0">Pedir cancelamento</h3><p class="hint">${TIPOS[m.tipo]} às ${hhmm(new Date(m.ts))}. Só a diretoria pode cancelar: ela vai analisar o seu pedido. </p><label>Marcação correta</label><select id="pc_k">${Object.keys(TIPOS).map(k=>`<option value="${k}"${k===m.tipo?' selected':''}>${TIPOS[k]}</option>`).join('')}</select><label style="margin-top:8px">Horário correto (deixe vazio só para cancelar)</label><input id="pc_h" type="time"><p class="hint">O horário certo vale se a diretoria aprovar. Aceita até 3 dias para trás.</p><label>Por que bateu errado?</label><textarea id="pc_t" rows="3" placeholder="ex.: bati saída, mas era a saída do almoço às 12:00"></textarea><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="b" onclick="enviaPedido('${id}')">Enviar pedido</button><button class="b s" onclick="$('#ovl').innerHTML=''">Voltar</button></div></div></div>`}
async function enviaPedido(id){const m=S.marc.find(x=>x.id===id),t=document.getElementById('pc_t').value.trim();if(!m)return;if(t.length<3)return toast('Escreva o motivo.');
  const hv=document.getElementById('pc_h').value,nk=document.getElementById('pc_k').value;let nts=null;
  if(hv){const d=new Date(m.ts),[hh,mi]=hv.split(':').map(Number);d.setHours(hh,mi,0,0);if(d.getTime()>Date.now()+6e5)return toast('Esse horário ainda não chegou.');nts=d.toISOString()}
  try{await rpc('ponto_pedir_cancel',{p_token:S.t,p_tipo:m.tipo,p_ts:m.ts,p_motivo:t,p_novo_tipo:nts?nk:null,p_novo_ts:nts});m.pedido=true;m.novo_tipo=nts?nk:null;m.novo_ts=nts;save();$('#ovl').innerHTML='';toast(nts?'Pedido enviado com o horário correto.':'Pedido enviado. Agora bata o ponto correto.');render()}catch(e){toast('Não foi possível enviar: '+e.message)}}
function outroTipo(){$('#ovl').innerHTML=`<div class="ovl"><div class="sheet"><h3 style="margin-top:0">Outro tipo de marcação</h3><div class="sel">${Object.keys(TIPOS).map(k=>`<button class="b s" onclick="abrirBater('${k}')">${TIPOS[k]}</button>`).join('')}</div><div style="margin-top:12px"><button class="b s" onclick="$('#ovl').innerHTML=''">Fechar</button></div></div></div>`}
/* ---- lembretes ---- */
function agenda(){const c=S.cfg;if(!c)return[];return Object.entries(HORA_TIPO).map(([t,k])=>({tipo:t,min:minHM(c[k])})).filter(x=>x.min!=null)}
function alertaAtual(){const c=S.cfg;if(!c)return null;const d=new Date(),dw=d.getDay();if(dw===0||dw===6)return null;
  const nx=proximo(),a=agenda().find(x=>x.tipo===nx);if(!a)return null;const now=d.getHours()*60+d.getMinutes();
  if(now>=a.min+5)return{tipo:nx,hora:p2(Math.floor(a.min/60))+':'+p2(a.min%60)};return null}
function verificaAviso(){const a=alertaAtual();if(!a)return;const k=hojeKey()+a.tipo;
  if(!S.avisos[k]&&window.Notification&&Notification.permission==='granted'){S.avisos[k]=1;save();try{new Notification('Ponto AKS',{body:'Não esqueça: '+TIPOS[a.tipo]+' (previsto '+a.hora+')',icon:LOGO,tag:k})}catch(e){}}}
function ativaAvisos(){if(!window.Notification)return toast('Este navegador não permite avisos. Use os lembretes do calendário.');Notification.requestPermission().then(p=>{toast(p==='granted'?'Avisos ativados (valem com o app aberto).':'Avisos não permitidos.');render()})}
function baixaLembretes(){const c=S.cfg;if(!c)return;const d=new Date();let L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Grupo AKS//Ponto//PT','CALSCALE:GREGORIAN'];
  const base=d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate());
  for(const [t,k] of Object.entries(HORA_TIPO)){const m=minHM(c[k]);if(m==null)continue;const h=p2(Math.floor(m/60)),mi=p2(m%60),m2=m+5,he=p2(Math.floor(m2/60)),me=p2(m2%60);
    L.push('BEGIN:VEVENT','UID:aks-ponto-'+S.t.slice(0,8)+'-'+t+'@grupoaks','DTSTAMP:'+base+'T000000Z','DTSTART:'+base+'T'+h+mi+'00','DTEND:'+base+'T'+he+me+'00','RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR','SUMMARY:Bater ponto - '+TIPOS[t],'DESCRIPTION:Abra o Ponto AKS e registre: '+TIPOS[t],'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Bater ponto - '+TIPOS[t],'TRIGGER:PT0S','END:VALARM','END:VEVENT')}
  L.push('END:VCALENDAR');const b=new Blob([L.join('\r\n')],{type:'text/calendar'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='lembretes-ponto-aks.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);toast('Abra o arquivo baixado e adicione ao calendário do celular.')}
/* ---- telas ---- */
function render(){
  const i=$('#hlogo');i.src=LOGO;i.style.display='';$('#hsub').textContent=S.cfg?S.cfg.nome:'Registro de ponto';
  const d=new Date();$('#hcomp').textContent=p2(d.getDate())+'/'+p2(d.getMonth()+1);
  if(!S.t||!S.u){$('#main').innerHTML=`<div class="card"><h3 style="margin-top:0">Ponto AKS</h3><p>Para usar, abra o <b>link de convite</b> que a gestora do Grupo AKS enviou para você (pelo WhatsApp).</p></div>`;return}
  if(S.erro==='revogado'){$('#main').innerHTML=`<div class="card"><h3 style="margin-top:0">Acesso desativado</h3><p>Este código não está mais ativo. Peça um novo link à gestora.</p></div>`;return}
  const c=S.cfg,hoje=doDia(hojeKey()),nx=proximo(),al=alertaAtual(),pend=S.marc.filter(m=>!m.sync).length;
  const dias=[];for(let n=0;n<7;n++){const dd=new Date();dd.setDate(dd.getDate()-n);dias.push(dd)}
  $('#main').innerHTML=`
  <div class="card hero"><div class="eyebrow">${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}</div><div class="clock" id="clk">${hhmm(d)}</div>
   <div style="opacity:.85;font-size:14px">${c?esc(c.nome)+(c.funcao?' · '+esc(c.funcao):''):'Conectando…'}</div>
   ${c?`<div style="opacity:.8;font-size:12.5px;margin-top:6px">Horários: ${esc(c.h_ent)} · almoço ${esc(c.h_alm)}–${esc(c.h_vol)} · saída ${esc(c.h_sai)}</div>`:''}</div>
  ${al?`<div class="alert">⏰ Não esqueça: <b>${TIPOS[al.tipo]}</b> (previsto ${al.hora}). Se já está fazendo, bata o ponto agora.</div>`:''}
  <div class="card"><button class="b bt" onclick="abrirBater('${nx}')" ${c?'':'disabled'}>${TIPOS[nx]}</button>
   <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><button class="b s" onclick="outroTipo()">Outro tipo / hora extra</button><span class="hint">${pend?'<span class="chip w">'+pend+' aguardando envio</span>':(S.erro==='rede'?'<span class="chip w">Sem internet</span>':'<span class="chip g">Tudo enviado</span>')}</span></div></div>
  <div class="card"><div class="sec"><i></i>Hoje</div>${hoje.length?hoje.map(m=>`<div class="pl" style="flex-wrap:wrap"><span style="${m.cancelada?'text-decoration:line-through;opacity:.6':''}">${TIPOS[m.tipo]}${m.lat==null&&!m.cancelada?' <span class="chip r">sem local</span>':''}</span><b style="${m.cancelada?'text-decoration:line-through;opacity:.6':''}">${hhmm(new Date(m.ts))} ${m.sync?'✓':'⏳'}</b>${m.cancelada?'<span class="chip r">cancelada pela diretoria</span>':(m.pedido?'<span class="chip w">${m.novo_ts?'correção pedida: '+TIPOS[m.novo_tipo]+' às '+hhmm(new Date(m.novo_ts)):'cancelamento pedido'} — aguardando a diretoria</span>':(m.sync?`<button class="b s" style="padding:4px 10px;font-size:12px" onclick="pedirCancel('${m.id}')">Bati errado? Pedir cancelamento</button>`:''))}</div>`).join('')+`<div class="pl"><span class="hint">Trabalhado hoje</span><b>${fmtH(horasDia(hoje))}</b></div>`:'<p class="hint">Nenhuma marcação hoje.</p>'}</div>
  <div class="card"><div class="sec"><i></i>Lembretes no celular</div><p class="hint" style="margin-top:-4px">Para o celular avisar mesmo com o app fechado, baixe os lembretes e abra no calendário. Eles tocam de segunda a sexta nos horários do seu expediente.</p>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="b" onclick="baixaLembretes()" ${c?'':'disabled'}>Baixar lembretes (calendário)</button><button class="b s" onclick="ativaAvisos()">Avisos com o app aberto${window.Notification&&Notification.permission==='granted'?' ✓':''}</button></div></div>
  <div class="card"><div class="sec"><i></i>Últimos 7 dias</div>${dias.map(dd=>{const l=doDia(dkey(dd));return `<div class="pl"><span>${DIAS[dd.getDay()]} ${p2(dd.getDate())}/${p2(dd.getMonth()+1)}<br><span class="hint">${ativas(l).map(m=>hhmm(new Date(m.ts))).join(' · ')||'—'}</span></span><b>${l.length?fmtH(horasDia(l)):''}</b></div>`}).join('')}</div>
  <p class="hint" style="text-align:center">O ponto registra a hora do seu aparelho, a selfie e o local. Use sempre o seu próprio celular.</p>`}
setInterval(()=>{const e=$('#clk');if(e)e.textContent=hhmm(new Date())},1000);
setInterval(()=>{verificaAviso();if(!document.hidden&&!P&&!$('#ovl').innerHTML)render()},30000);
addEventListener('online',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden){sync();render()}});
render();carregaCfg().then(sync);setInterval(sync,60000);
</script>
</body>
</html>
