<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freela AKS — Serviços prestados e recibos</title>
<style>

:root{--navy:#071633;--blue:#0b3d91;--blue2:#1d63e0;--red:#e5383b;--yel:#ffc928;--bg:#eef2f8;--ink:#0f1b33;--mut:#667085;--bd:#e3e8f1;--ok:#0a7f4f;--bad:#b42318;--sh:0 10px 30px rgba(7,22,51,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;color:var(--ink);background:var(--bg) radial-gradient(circle at 1px 1px,rgba(11,61,145,.07) 1px,transparent 0) 0 0/22px 22px;padding-bottom:calc(88px + env(safe-area-inset-bottom));min-height:100vh}
body::before{content:"";position:fixed;left:0;right:0;bottom:0;height:75vh;background:var(--wm) no-repeat center bottom/min(1150px,160vw) auto;pointer-events:none;z-index:0}
header{position:sticky;top:0;z-index:6;color:#fff;padding:14px 16px 17px;display:flex;align-items:center;gap:12px;background:var(--wmh) no-repeat right -30px center/auto 170%,linear-gradient(120deg,#06122b,#0b3d91 68%,#1d63e0);box-shadow:0 8px 24px rgba(7,22,51,.28)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#1d63e0 0 33.3%,#e5383b 33.3% 66.6%,#ffc928 66.6%)}
header img{height:44px;max-width:96px;object-fit:contain;background:#fff;border-radius:12px;padding:3px 5px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
header h1{font-size:19px;margin:0;white-space:nowrap;letter-spacing:.2px;font-weight:800}
header small{display:block;opacity:.78;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.hcomp{margin-left:auto;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;justify-content:space-around;gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border-top:1px solid var(--bd);box-shadow:0 -8px 24px rgba(7,22,51,.06)}
nav button{flex:1;max-width:120px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px/1 inherit;color:var(--mut);padding:8px 2px;border-radius:14px;cursor:pointer;transition:.15s}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--blue);background:rgba(29,99,224,.11)}
main{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:16px 14px}
.card{background:rgba(255,255,255,.88);border:1px solid rgba(227,232,241,.9);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:var(--sh);animation:rise .35s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h3{font-size:16px}
.hero{background:linear-gradient(135deg,#071633,#0b3d91 70%,#1d63e0);color:#fff;border:0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,201,40,.45),transparent 65%)}
.hero .eyebrow{font-size:12px;opacity:.75;text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.hero .big{font-size:26px;font-weight:800;margin:2px 0 10px}
.hero label{color:rgba(255,255,255,.75)}
.hero input,.hero select{background:rgba(255,255,255,.96)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>*{flex:1;min-width:130px}
label{display:block;font-size:11.5px;color:var(--mut);font-weight:700;margin-bottom:4px;letter-spacing:.2px}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:12px;font:inherit;background:#fff;transition:.15s;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue2);box-shadow:0 0 0 4px rgba(29,99,224,.15)}
input[type=checkbox]{width:auto}
button.b{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;box-shadow:0 6px 14px rgba(11,61,145,.28);transition:transform .12s,box-shadow .12s}
button.b:active{transform:scale(.97)}
button.b.s{background:#fff;color:var(--blue);border:1.5px solid rgba(11,61,145,.3);box-shadow:none}
button.b.d{background:linear-gradient(135deg,#ef5350,#b42318);box-shadow:0 6px 14px rgba(180,35,24,.25)}
.emp{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:11px 0;border-bottom:1px solid var(--bd)}
.emp:last-child{border:0}
.emp .mid{flex:1;min-width:150px}
.emp .acts{display:flex;gap:8px}
@media(max-width:560px){.emp .acts{width:100%}.emp .acts .b{flex:1}}.emp b{display:block}.emp span{color:var(--mut);font-size:13px}
.av{flex:none;width:42px;height:42px;border-radius:14px;color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px;box-shadow:0 4px 10px rgba(7,22,51,.18)}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#e8f0ff;color:var(--blue);margin-right:4px}
.kpis.card{background:none;border:0;box-shadow:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:rgba(255,255,255,.95);border-radius:16px;padding:12px 12px 12px 14px;box-shadow:var(--sh);border-left:5px solid var(--blue2);animation:rise .4s both}
.kpi:nth-child(2){border-color:var(--red)}.kpi:nth-child(3){border-color:#12a150}.kpi:nth-child(4){border-color:var(--yel)}.kpi:nth-child(5){border-color:#7c3aed}.kpi:nth-child(6){border-color:var(--navy)}
.kpi small{color:var(--mut);display:block;font-size:11.5px;font-weight:600}
.kpi b{font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.ovl{position:fixed;inset:0;background:rgba(6,18,43,.55);backdrop-filter:blur(6px);z-index:20;overflow:auto;padding:12px}
.sheet{background:#fff;max-width:780px;margin:16px auto;border-radius:22px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:rise .3s both}
.hint{font-size:12px;color:var(--mut)}
table.pt{width:100%;border-collapse:collapse;font-size:13px}
table.pt th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
table.pt td,table.pt th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left}
table.pt tr:nth-child(even) td{background:rgba(238,242,248,.5)}
table.pt td.r,table.pt th.r{text-align:right;font-variant-numeric:tabular-nums}
/* contracheque */
.slip{position:relative;border:1.5px solid #0f1b33;border-radius:8px;padding:16px 12px 12px;font-size:12px;color:#000;background:#fff var(--wms) no-repeat center 64%/80% auto;margin-bottom:14px;page-break-inside:avoid;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.slip::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#1d63e0 0 33.3%,#e5383b 33.3% 66.6%,#ffc928 66.6%)}
.slip .top{display:flex;gap:12px;align-items:center;border-bottom:1.5px solid #0f1b33;padding-bottom:9px}
.slip .top img{max-height:62px;max-width:130px;object-fit:contain}
.slip .top h2{margin:0;font-size:15px;color:#071633}.slip .top div{flex:1}
.slip .tit{text-align:center;font-weight:800;margin:9px 0;letter-spacing:.6px;color:#0b3d91}
.slip .box{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;border:1px solid #0f1b33;border-radius:6px;padding:7px;margin-bottom:9px;background:rgba(238,242,248,.7)}
.slip table{width:100%;border-collapse:collapse;table-layout:fixed}
.slip td{word-break:break-word}
.slip th:nth-child(1){width:11%!important}.slip th:nth-child(3){width:15%!important}.slip th:nth-child(4),.slip th:nth-child(5){width:19%!important}
@media(max-width:560px){.sheet{padding:12px;margin:8px auto}.slip{font-size:11px;padding:14px 8px 10px}.slip th{font-size:9.5px;padding:3px 2px}.slip td{padding:2px 3px}.slip .box{grid-template-columns:1fr}.slip .liq{font-size:13px}}
.slip th{background:#0b3d91;color:#fff;border:1px solid #0b3d91;padding:4px 5px;font-size:11px}
.slip td{border-left:1px solid #9aa7bd;border-right:1px solid #9aa7bd;padding:2.5px 5px}
.slip td.r{text-align:right}
.slip tr.tot td{border:1px solid #0f1b33;font-weight:800;background:rgba(238,242,248,.85)}
.slip .liq{display:flex;justify-content:space-between;border-radius:8px;padding:9px 12px;margin:9px 0;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(120deg,#071633,#0b3d91);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.slip .bases{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border:1px solid #0f1b33;border-radius:6px;padding:6px;font-size:11px;background:rgba(238,242,248,.7)}
.slip .ass{margin-top:28px;display:flex;gap:22px;font-size:11px}.slip .ass div{flex:1;border-top:1px solid #0f1b33;padding-top:3px;text-align:center}
#printArea{display:none}
@media print{body{background:#fff}body::before{display:none}header,nav,main,.ovl{display:none!important}#printArea{display:block}.slip{margin:0 0 8mm}}

.chip.w{background:#fff4d6;color:#8a5a00}.chip.g{background:#e3f6ec;color:#0a7f4f}.chip.r{background:#fde8e8;color:#b42318}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hv{font-size:12px;color:var(--blue);font-weight:700;margin-top:4px;min-height:16px}
.chk{display:flex;gap:9px;align-items:center;font-size:14px;color:var(--ink);font-weight:600;margin:8px 0;cursor:pointer}
.chk input{width:20px;height:20px;flex:none}
.sec{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px;font-weight:800;color:var(--navy)}
.sec i{width:6px;height:18px;border-radius:3px;background:linear-gradient(var(--blue2),var(--red))}
.hero .tot{font-size:34px;font-weight:800;margin:2px 0 12px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.via{display:block;text-align:right;font-size:9.5px;font-weight:800;color:#0b3d91;letter-spacing:.8px;margin:-4px 0 5px}
.slip.fr th:nth-child(1){width:46%!important}.slip.fr th:nth-child(2){width:20%!important}.slip.fr th:nth-child(3),.slip.fr th:nth-child(4){width:17%!important}
.slip.fr .txt{margin:6px 0 10px;line-height:1.55;font-size:12.5px;text-align:justify}
.slip.fr .bases{grid-template-columns:repeat(4,1fr);margin-top:9px}
.slip.fr .bases div{display:flex;flex-direction:column;justify-content:space-between;gap:3px}.slip.fr .bases small{display:block;font-size:9px;color:#475467;font-weight:700;text-transform:uppercase;letter-spacing:.2px;min-height:22px;line-height:1.15}
.slip.fr .ass{gap:14px}
@media(max-width:560px){.slip.fr .txt{font-size:11.5px}.slip.fr th:nth-child(1){width:35%!important}.slip.fr th:nth-child(2){width:23%!important}.slip.fr th:nth-child(3),.slip.fr th:nth-child(4){width:21%!important}.slip.fr th{font-size:8.5px!important;letter-spacing:0}.hgrid{grid-template-columns:1fr 1fr}}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#071633;color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:13px;z-index:40;box-shadow:var(--sh);opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}#toast.on{opacity:1}
@media print{#toast{display:none!important}}
</style>
</head>
<body>
<header><img id="hlogo" alt="" style="display:none"><div style="min-width:0"><h1>Freela AKS</h1><small id="hsub">Serviços prestados e recibos</small></div><div class="hcomp" id="hcomp"></div></header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="ovl"></div>
<div id="printArea"></div>
<div id="toast"></div>

<script id="engine">
/* ===== MOTOR DE CÁLCULO (puro, sem DOM) ===== */
const R2=n=>Math.round((n+Number.EPSILON)*100)/100;
const N=x=>{x=parseFloat(String(x).replace(',','.'));return isFinite(x)?x:0};
const Hh=x=>{x=String(x==null?'':x).trim();if(x.indexOf(':')>=0){const p=x.split(':');return Math.max(0,N(p[0])+N(p[1])/60)}return Math.max(0,N(x))};
const CATS=[['dia','Dia normal'],['not','Noturno'],['dom','Domingos'],['fer','Feriados']];
const DEF={ano:2026,peric:0.30,pericBase:'total',mult:{dia:1,not:1.2,dom:2,fer:2},trDia:0,refDia:0,inssAut:0.11,inssTeto:8475.55,
  funcs:[{k:'eletricista',n:'Eletricista',vh:0},{k:'tecnico',n:'Técnico',vh:0},{k:'engenheiro',n:'Engenheiro',vh:0},{k:'ajudante',n:'Ajudante',vh:0},{k:'auxiliar',n:'Auxiliar de eletricista',vh:0}],
  jornada:8,feriadosLocais:'12/01, 15/08',
  clausula:'Declaro que os serviços foram prestados de forma eventual e autônoma e dou plena quitação do valor acima recebido.'};
/* tabela de retenção (IRRF mensal 2026 + redutor Lei 15.270/2025) */
const RET={irrf:[[2428.80,0,0],[2826.65,0.075,182.16],[3751.05,0.15,394.16],[4664.68,0.225,675.49],[1e12,0.275,908.73]],depIR:189.59,simpl:607.20,redAte:5000,redAte2:7350,redA:978.62,redB:0.133145};
function calcIRRF(rend,inss,deps,pensao,P){
  const legal=inss+deps*P.depIR+pensao;const usouSimpl=P.simpl>legal;const ded=Math.max(legal,P.simpl);
  const base=Math.max(0,R2(rend-ded));let imp=0;
  for(const [lim,al,pd] of P.irrf){if(base<=lim){imp=base*al-pd;break}}
  imp=Math.max(0,imp);let red=0;
  if(rend<=P.redAte)red=imp;else if(rend<=P.redAte2)red=Math.max(0,P.redA-P.redB*rend);
  red=Math.min(red,imp);
  return{valor:R2(imp-red),base,usouSimpl,reducao:R2(red),bruto:R2(imp)}
}
const fh=h=>String(Math.round(h*100)/100).replace('.',',');
const mm=n=>n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pc=x=>String(Math.round(x*10000)/100).replace('.',',');
function calcF(d,P){
  const f=P.funcs.find(x=>x.k===d.func)||P.funcs[0]||{n:'',vh:0};
  const vh=(d.vh!==''&&d.vh!=null)?N(d.vh):N(f.vh);
  const L=[],cat={};let horas=0,vH=0;
  for(const [k,n] of CATS){
    const h=Hh((d.h||{})[k]),m=P.mult[k]||1,rate=R2(vh*m),v=h>0?R2(h*rate):0;
    cat[k]={h,rate,val:v};
    if(h>0){horas+=h;vH+=v;L.push({t:'p',desc:'Horas — '+n+(m!==1?' (×'+String(m).replace('.',',')+')':''),ref:fh(h)+' h × '+mm(rate),val:v})}
  }
  vH=R2(vH);horas=R2(horas);
  const basico=R2(horas*vh),pBase=P.pericBase==='basico'?basico:vH;
  const peric=(d.peric&&vH>0)?R2(pBase*P.peric):0;
  if(peric)L.push({t:'p',desc:'Adicional de periculosidade ('+pc(P.peric)+'%)',ref:pc(P.peric)+'% s/ '+mm(pBase),val:peric});
  const dias=Math.max(0,Math.round(N(d.dias)));
  const trD=(d.trDia!==''&&d.trDia!=null)?N(d.trDia):N(P.trDia),rfD=(d.refDia!==''&&d.refDia!=null)?N(d.refDia):N(P.refDia);
  const transp=d.usaTr?R2(dias*trD):0,refeicao=d.usaRef?R2(dias*rfD):0;
  if(transp)L.push({t:'p',desc:'Transporte',ref:dias+' dia(s) × '+mm(trD),val:transp});
  if(refeicao)L.push({t:'p',desc:'Refeição / alimentação',ref:dias+' dia(s) × '+mm(rfD),val:refeicao});
  const outros=Math.max(0,R2(N(d.oVal)));
  if(outros>0)L.push({t:'p',desc:d.oDesc||'Outros acréscimos',ref:'',val:outros});
  const rend=R2(vH+peric+outros),bruto=R2(rend+transp+refeicao);
  let inss=0,irrf=0;
  if(d.inss&&rend>0){const b=Math.min(rend,P.inssTeto);inss=R2(b*P.inssAut);L.push({t:'d',desc:'INSS retido ('+pc(P.inssAut)+'%)',ref:'s/ '+mm(b),val:inss})}
  if(d.irrf&&rend>0){const ir=calcIRRF(rend,inss,0,0,RET);irrf=ir.valor;if(irrf>0)L.push({t:'d',desc:'IRRF retido',ref:'base '+mm(ir.base),val:irrf})}
  const descV=Math.max(0,R2(N(d.dVal)));
  if(descV>0)L.push({t:'d',desc:d.dDesc||'Descontos / adiantamento',ref:'',val:descV});
  const totDesc=R2(inss+irrf+descV);
  return{vh,funNome:f.n,linhas:L,cat,horas,vHoras:vH,basico,peric,pericPct:P.peric,transp,refeicao,outros,rend,bruto,inss,irrf,descV,totDesc,liquido:R2(bruto-totDesc),dias}
}
/* calendário: dias normais, domingos e feriados nacionais de um período */
function pascoa(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),t=h+l-7*m+114;return Date.UTC(y,Math.floor(t/31)-1,(t%31)+1)}
const FER_FIXOS={'01-01':'Confraternização Universal','04-21':'Tiradentes','05-01':'Dia do Trabalho','09-07':'Independência','10-12':'N. Sra. Aparecida','11-02':'Finados','11-15':'Proclamação da República','11-20':'Consciência Negra','12-25':'Natal'};
function feriadosDe(y,extras){
  const M={};for(const k in FER_FIXOS)M[y+'-'+k]=FER_FIXOS[k];
  const sx=new Date(pascoa(y)-2*864e5);M[y+'-'+String(sx.getUTCMonth()+1).padStart(2,'0')+'-'+String(sx.getUTCDate()).padStart(2,'0')]='Sexta-feira Santa';
  String(extras||'').split(/[,;\s]+/).forEach(t=>{const m=t.match(/^(\d{1,2})\/(\d{1,2})$/);if(m)M[y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')]='Feriado local'});
  return M}
function calendario(ini,fim,extras){
  if(!ini||!fim)return null;const a=Date.parse(ini+'T00:00:00Z'),b=Date.parse(fim+'T00:00:00Z');
  if(!(b>=a)||(b-a)/864e5>400)return null;
  const r={total:0,dia:0,dom:0,fer:0,lista:[]},cache={};
  for(let t=a;t<=b;t+=864e5){const d=new Date(t),y=d.getUTCFullYear(),iso=d.toISOString().slice(0,10);
    const F=cache[y]||(cache[y]=feriadosDe(y,extras));r.total++;
    if(F[iso]){r.fer++;r.lista.push(iso.slice(8)+'/'+iso.slice(5,7)+' '+F[iso]+(d.getUTCDay()===0?' (domingo)':''))}
    else if(d.getUTCDay()===0)r.dom++;else r.dia++}
  return r}
/* valor por extenso (reais) */
function extenso(v){
  v=Math.round(v*100);const r=Math.floor(v/100),c=v%100;
  const U=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const D=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const C=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const t=n=>{if(n===100)return'cem';const p=[],cc=Math.floor(n/100),d=n%100;if(cc)p.push(C[cc]);if(d){if(d<20)p.push(U[d]);else{const dz=Math.floor(d/10),u=d%10;p.push(D[dz]+(u?' e '+U[u]:''))}}return p.join(' e ')};
  const g=[];const mi=Math.floor(r/1e6),mil=Math.floor(r%1e6/1000),un=r%1000;
  if(mi)g.push([t(mi)+(mi===1?' milhão':' milhões'),mi]);
  if(mil)g.push([mil===1?'mil':t(mil)+' mil',mil]);
  if(un)g.push([t(un),un]);

  const p=String(code||'').trim().split('.');

function syncCal(){const P=S.params,jd=N(F.jd)||P.jornada;let tot=0;

  F.dias=tot>0?String(tot):'';const e=$('#f_dias');if(e)e.value=F.dias}

    else{F.n={dia:String(c.dia),not:'',dom:String(c.dom),fer:String(c.fer)};for(const [kk] of CATS){const e=$('#f_n_'+kk);if(e)e.value=F.n[kk]}syncCal()}}
  S.draft=F;save();upd()}
function setN(k,v){if(k==='not'){const o=N(F.n.not),nv=N(v);F.n.dia=String(Math.max(0,N(F.n.dia)-(nv-o)));const e=$('#f_n_dia');if(e)e.value=F.n.dia}

function pickPessoa(v){const p=S.pessoas.find(x=>x.nome.toLowerCase()===String(v).trim().toLowerCase());if(!p)return;

function gerar(){

  const f=fnObj(F.func);

  else{const ano=new Date().getFullYear();S.seq[ano]=(S.seq[ano]||0)+1;

/* ---- PDF: baixar / compartilhar ---- */
const b64b=u=>Uint8Array.from(atob(u.split(',')[1]),c=>c.charCodeAt(0));
const loadImg=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src});
async function jpegDe(src,fundo){try{
  if(/^data:image\/jpe?g/.test(src)&&!fundo){const b=b64b(src),i=jpgInfo(b);if(i&&i.c===3)return{b,w:i.w,h:i.h}}
  const im=await loadImg(src),c=document.createElement('canvas');c.width=fundo?fundo[0]:(im.naturalWidth||im.width);c.height=fundo?fundo[1]:(im.naturalHeight||im.height);
  const k=c.getContext('2d');k.fillStyle='#fff';k.fillRect(0,0,c.width,c.height);k.drawImage(im,0,0,c.width,c.height);
  const u=c.toDataURL('image/jpeg',.9),b=b64b(u);return{b,w:c.width,h:c.height}}catch(e){return null}}
async function pdfRec(id,modo){const x=S.recibos.find(r=>r.id===id);if(!x)return;toast('Gerando PDF…');
  try{
    const logo=S.empresa.logo?await jpegDe(S.empresa.logo):null;
    const wm=await jpegDe('data:image/svg+xml;utf8,'+encodeURIComponent(subSVG('#0b3d91',.1)),[1800,860]);
    const bytes=pdfRecibo(x,S.empresa,S.params,{logo,wm});
    const nome='Recibo-'+nn(x).replace('/','-')+'-'+(x.d.nome||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().split(/\s+/)[0].replace(/[^A-Za-z0-9]/g,'')+'.pdf';
    const blob=new Blob([bytes],{type:'application/pdf'});
    if(modo==='share'&&navigator.canShare){const f=new File([blob],nome,{type:'application/pdf'});if(navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:nome});return}catch(e){if(e&&e.name==='AbortError')return}}}
    const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
    toast('PDF gerado: '+nome)
  }catch(e){toast('Não foi possível gerar o PDF aqui.')}}
function printRec(id){const x=S.recibos.find(r=>r.id===id);$('#printArea').innerHTML=reciboHTML(x,'VIA DA EMPRESA')+reciboHTML(x,'VIA DO PRESTADOR');try{window.print()}catch(e){toast('Impressão bloqueada aqui. Use "Baixar PDF".')}}

   <div><label>INSS autônomo (0,11 = 11%)</label><input inputmode="decimal" value="${P.inssAut}" onchange="pSet('inssAut',this.value)"></div>
   <div><label>Teto do INSS (R$)</label><input inputmode="decimal" value="${P.inssTeto}" onchange="pSet('inssTeto',this.value)"></div>
   <div><label>Horas por dia (padrão)</label><input inputmode="decimal" value="${P.jornada}" onchange="pSet('jornada',this.value)"></div>
   <div style="flex-basis:100%"><label>Feriados locais (dd/mm, separados por vírgula)</label><input value="${esc(P.feriadosLocais)}" onchange="S.params.feriadosLocais=this.value;save()"></div></div>
   <p class="hint">Os feriados nacionais e a Sexta-feira Santa já são automáticos. Confira os locais (aqui: aniversário de Belém 12/01 e Adesão do Pará 15/08) e acrescente outros se precisar.</p></div>
  <div class="card"><label>Texto final do recibo</label><textarea rows="3" onchange="S.params.clausula=this.value;save()">${esc(P.clausula)}</textarea><p class="hint">Peça ao contador/jurídico para revisar este texto.</p></div>`}
function fSet(i,k,v){S.params.funcs[i][k]=k==='vh'?N(v):v;save()}
function fAdd(){S.params.funcs.push({k:'f'+uid(),n:'Nova função',vh:0});save();render()}
function fDel(i,b){if(b.dataset.c){S.params.funcs.splice(i,1);save();return render()}b.dataset.c=1;b.textContent='?'}
function mSet(k,v){S.params.mult[k]=N(v)||1;save()}
function pSet(k,v){S.params[k]=N(v);save()}

/* ---- Empresa + backup ---- */
function vEmp(){const E=S.empresa;const f=(k,n)=>`<div><label>${n}</label><input value="${esc(E[k])}" oninput="S.empresa['${k}']=this.value;save();head()" ${k==='cnpj'?'onchange="checkLic()"':''}></div>`;
  $('#main').innerHTML=(LIC.ok?`<div class="card"><small class="ok">${LIC.tipo==='proprio'?'Uso liberado: Grupo AKS.':'Licença ativa para este CNPJ'+(LIC.validade&&LIC.validade!=='0'?' até '+LIC.validade.split('-').reverse().join('/'):'')+'.'}</small></div>`:painelLic())+`<div class="card"><div class="row">${f('nome','Razão social / nome')}${f('sub','Subtítulo')}${f('cnpj','CNPJ')}${f('end','Endereço')}${f('cidade','Cidade / UF')}${f('resp','Responsável que assina pela empresa (gestora)')}</div></div>
  <div class="card"><label>Logo da empresa (aparece no recibo)</label><input type="file" accept="image/*" onchange="setLogo(this)">${E.logo?`<p><img src="${E.logo}" style="max-height:80px"></p><button class="b s" onclick="S.empresa.logo='';S.semLogo=true;save();render()">Remover logo</button>`:''}</div>
  <div class="card"><div class="sec"><i></i>Backup</div><p class="hint">Os dados ficam salvos neste navegador. Copie o backup e guarde num arquivo seguro.</p><button class="b" onclick="cpBkp()">Copiar backup</button>
  <div style="margin-top:10px"><label>Restaurar (cole o backup aqui)</label><textarea id="bk" rows="5"></textarea><button class="b s" style="margin-top:8px" onclick="rsBkp()">Restaurar</button></div></div>`}
function setLogo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const w=Math.min(400,im.width),h=im.height*w/im.width,c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);S.empresa.logo=c.toDataURL('image/png');S.semLogo=false;save();render()};im.src=r.result};r.readAsDataURL(f)}
function cpBkp(){const t=JSON.stringify(S);const a=document.getElementById('bk');try{navigator.clipboard.writeText(t).then(()=>toast('Backup copiado.'),()=>{a.value=t;a.select();toast('Copie o texto selecionado.')})}catch(e){a.value=t;a.select();toast('Copie o texto selecionado.')}}
function rsBkp(){try{const o=JSON.parse(document.getElementById('bk').value);S=Object.assign(defState(),o);S.params=Object.assign(clone(DEF),S.params);S.params.mult=Object.assign({},DEF.mult,S.params.mult);F=newDraft();save();toast('Restaurado.');render()}catch(e){toast('Backup inválido.')}}
render();checkLic();
</script>
</body>
</html>
