<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#122438">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Laudo de Subestação">
<title>Laudo de Subestação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#122438; --ink2:#41566A; --mute:#6F7F8E; --line:#D3DBE2; --paper:#EEF1F3; --card:#FFFFFF;
  --acc:#1F4FD1; --accsoft:#E4EBFB; --navy:#122438; --navy2:#1C3550;
  --s0:#1E9A62; --s1:#E0AE00; --s2:#E8741A; --s3:#C9303B; --none:#B9C3CC;
  --head:'Barlow Semi Condensed','Segoe UI',system-ui,sans-serif;
  --body:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--head);margin:0;font-weight:600;letter-spacing:.005em}
button{cursor:pointer}
.app{max-width:960px;margin:0 auto;min-height:100vh;padding-bottom:90px}

/* topo */
.top{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.top .bar{display:flex;align-items:center;gap:10px;min-height:44px}
.top h1{font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font:400 13px var(--body);color:#9FB3C6;margin-top:-2px;overflow:hidden;text-overflow:ellipsis}
.ib{background:transparent;border:1px solid #3A5573;color:#fff;border-radius:6px;min-height:40px;padding:0 12px;display:inline-flex;align-items:center;gap:6px}
.ib.solid{background:var(--acc);border-color:var(--acc);font-weight:500}
.uni{overflow-x:auto;padding:6px 0 4px;scrollbar-width:none}
.uni::-webkit-scrollbar{display:none}
.uni svg{display:block;min-width:100%}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 14px;position:sticky;top:0;z-index:20;background:var(--navy)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:transparent;border:0;border-bottom:3px solid transparent;color:#B7C7D6;padding:10px 12px 9px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:7px;min-height:44px}
.tab.on{color:#fff;border-bottom-color:#fff}
.dot{width:10px;height:10px;border-radius:50%;background:var(--none);flex:none}
.dot.d0{background:var(--s0)}.dot.d1{background:var(--s1)}.dot.d2{background:var(--s2)}.dot.d3{background:var(--s3)}

main{padding:14px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.sec>h2{font-size:19px;margin-bottom:4px}
.sec>p.hint{margin:0 0 12px;color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
.f.w2{grid-column:span 2}
@media(max-width:520px){.f.w2{grid-column:span 1}}
input,select,textarea{color:var(--ink);width:100%;min-height:44px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:8px 10px;font-size:16px}
textarea{min-height:96px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;min-height:44px;padding:0 14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.dan{color:var(--s3);border-color:#E6B9BD}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* tipos de subestação */
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.type{text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:2px}
.type b{font:600 17px var(--head)}
.type span{font-size:13px;color:var(--mute)}
.type.on{border:2px solid var(--acc);background:var(--accsoft);padding:11px}

/* cartões de ensaio */
.test{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--none);border-radius:10px;padding:14px;margin-bottom:12px}
.test.d0{border-left-color:var(--s0)}.test.d1{border-left-color:var(--s1)}.test.d2{border-left-color:var(--s2)}.test.d3{border-left-color:var(--s3)}
.test>header{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.test h3{font-size:18px}
.test header small{color:var(--mute);font-size:13px}
.irow{display:grid;grid-template-columns:minmax(120px,1.3fr) repeat(auto-fit,minmax(86px,1fr));gap:8px;align-items:end;margin-bottom:8px}
.irow .rl{font-size:15px;font-weight:500;align-self:center;padding-top:16px}
.irow.dyn{grid-template-columns:minmax(120px,1.3fr) repeat(auto-fit,minmax(86px,1fr)) 40px}
.vi{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
.vi input{text-align:right}
.gtitle{font:600 15px var(--head);margin:8px 0 4px;color:var(--ink2)}
.x{border:1px solid var(--line);background:#fff;border-radius:6px;min-height:44px;color:var(--s3);font-size:20px;line-height:1}
.add{background:transparent;border:1px dashed #9FB0BF;border-radius:6px;min-height:40px;padding:0 12px;color:var(--acc);font-weight:500;margin-top:2px}
.chk{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;margin-bottom:6px}
.chk span{font-size:15px}
.chk select{min-height:40px}
@media(max-width:480px){.chk{grid-template-columns:1fr 128px}}

/* resultados */
.res{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.res .empty{margin:0;color:var(--mute);font-size:14px}
.rr{display:grid;grid-template-columns:1fr;gap:4px;padding:8px 0;border-bottom:1px solid #EAEFF2}
.rr:last-of-type{border-bottom:0}
.rr b{font-weight:600}
.rr .v{font-size:15px}
.rr .crit{font-size:12.5px;color:var(--mute)}
.sbar{display:flex;align-items:center;gap:8px}
.sbar i{display:flex;gap:3px}
.sbar i u{width:26px;height:9px;border-radius:2px;background:#E3E9ED;display:block}
.sbar i u.on0{background:var(--s0)}.sbar i u.on1{background:var(--s1)}.sbar i u.on2{background:var(--s2)}.sbar i u.on3{background:var(--s3)}
.sbar em{font-style:normal;font-weight:600;font-size:13.5px}
.chart{margin-top:10px}
.chart svg{width:100%;height:auto;display:block}
.chart figcaption{font-size:12.5px;color:var(--mute);margin-top:2px}
.chart,.chart figure{margin-left:0;margin-right:0}

/* análise */
.ana{background:var(--accsoft);border:1px solid #C6D4F4;border-radius:10px;padding:14px;margin:14px 0}
.ana h2{font-size:18px;margin-bottom:6px}
.ana p{margin:4px 0}
.ana ul{margin:4px 0 8px;padding-left:20px}
.ana li{margin:3px 0}
.ana h4{margin:10px 0 2px;font:600 15px var(--head)}

/* fotos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.ph{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.ph img{width:100%;height:120px;object-fit:cover;display:block}
.ph input{border:0;border-top:1px solid var(--line);border-radius:0;min-height:38px;font-size:14px}
.ph button{width:100%;border:0;border-top:1px solid var(--line);background:#fff;color:var(--s3);min-height:34px;font-size:13px}
input[type=file]{display:none}

/* home */
.hero{background:var(--navy);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 20px}
.hero .brand{display:flex;align-items:center;gap:12px}
.hero .brand img{height:40px;max-width:150px;object-fit:contain;background:#fff;border-radius:6px;padding:4px 6px}
.hero h1{font-size:26px;line-height:1.1}
.hero p{margin:2px 0 0;color:#9FB3C6;font-size:14px}
.hero .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.hist{display:flex;flex-direction:column;gap:10px}
.rep{background:#fff;border:1px solid var(--line);border-left:6px solid var(--none);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.rep.d0{border-left-color:var(--s0)}.rep.d1{border-left-color:var(--s1)}.rep.d2{border-left-color:var(--s2)}.rep.d3{border-left-color:var(--s3)}
.rep .main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.rep .main b{font:600 18px var(--head);display:block}
.rep .main span{font-size:13.5px;color:var(--mute);display:block}
.empty-home{padding:28px 16px;text-align:center;color:var(--ink2)}
.empty-home h2{font-size:20px;margin-bottom:6px}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(10,20,32,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:14px 14px 0 0;max-height:82vh;overflow:auto;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.sheet h2{font-size:19px;margin-bottom:8px}
.pick{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px;font-weight:500;min-height:44px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:14px}

/* resumo geral */
.overall{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.overall .big{font:700 28px var(--head)}
.cnt{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.cnt span{border-radius:99px;padding:3px 12px;font-size:13.5px;font-weight:600}
.eqlist .rep{cursor:pointer}
.crit-det{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff}
.crit-det summary{padding:12px;font-weight:600;cursor:pointer;min-height:44px}
.crit-det .in{padding:0 12px 10px}
.crow{display:grid;grid-template-columns:1fr repeat(3,72px);gap:6px;align-items:center;margin-bottom:6px;font-size:14px}
.crow input{min-height:38px;padding:4px 6px;text-align:right}
.crow.h{font-size:12px;color:var(--mute)}

/* ===== Documento (visualização e impressão) ===== */
.pvbar{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.pvbar b{flex:1;font:600 18px var(--head);min-width:120px}
.doc{background:#fff;max-width:794px;margin:14px auto;padding:18px 20px 22px;border:1px solid var(--line);color:#111;font-size:13.5px;line-height:1.45}
.brandrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:10px;border-bottom:3px solid var(--navy)}
.brandrow .b1 img{height:50px;display:block;max-width:100%}
.brandrow .b2{display:flex;align-items:center;gap:8px}
.brandrow .b2 span{font-size:10.5px;line-height:1.15;color:#41566A;text-align:right;max-width:64px}
.brandrow .b2 img{height:46px;display:block}
.brandrow b{font:600 18px var(--head);color:var(--navy)}
.cover{background:var(--navy);color:#fff;padding:22px 22px 18px}
.cover h1{font-size:30px;line-height:1.08;font-weight:700}
.cover .sub{color:#B7C7D6;margin-top:8px;font-size:14px}
.cover .cmeta{margin-top:16px;padding-top:9px;border-top:1px solid #3A5573;font-size:12px;color:#9FB3C6}
.doc h2{font-size:18px;color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:3px;margin:22px 0 8px}
.doc h3{font-size:15px;margin:14px 0 4px;color:var(--navy)}
.doc p{margin:4px 0}
.doc ul{margin:4px 0;padding-left:20px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 18px;margin:10px 0 6px}
.kv div{border-bottom:1px solid #E3E8EC;padding:3px 0;font-size:13px}
.kv span{display:block;color:#5C6C7A;font-size:11.5px}
.doc table{width:100%;border-collapse:collapse;margin:6px 0 8px;font-size:12px}
.doc th{background:#E7ECF0;text-align:left;padding:5px 6px;border:1px solid #C9D2D9;font-weight:600}
.doc td{padding:5px 6px;border:1px solid #D5DCE2;vertical-align:top}
.doc td.st{font-weight:600;text-align:center;white-space:nowrap}
.doc .eqh{display:flex;align-items:center;gap:10px;margin:0 0 6px;padding:8px 10px;border-left:8px solid var(--none);background:#F1F4F6}
.doc .eqh b{font:600 16px var(--head);flex:1}
.doc .pill{border-radius:99px;padding:2px 12px;font-weight:600;font-size:12px}
.doc .chart{margin:6px 0}
.doc .chart svg{max-width:520px}
.doc .ana{margin:8px 0;background:#F4F7FD;font-size:12.5px}
.doc .laudo{white-space:pre-wrap;margin:6px 0}
.doc .photos{margin:6px 0;grid-template-columns:repeat(3,1fr)}
.doc .ph img{height:130px}
.doc .ph div{font-size:11px;padding:3px 5px;border-top:1px solid var(--line);min-height:22px}
.doc .unif{margin:10px 0 0;background:var(--navy);padding:6px 8px}
.doc .unif svg{max-width:100%;height:auto}
.doc .docdiag h3{margin-top:10px}
.doc .dsteps{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0}
.doc figure.dstep{padding:3px;border-color:#D5DCE2}
.doc figure.dstep figcaption{font-size:10px;line-height:1.3;color:#333}
.doc .dnota{margin:2px 0 6px;font-size:10px}
.doc h2,.doc h3{break-after:avoid}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin:22px 0 10px}
.sign .sgbox{height:50px;text-align:center}
.sign .sgbox img{max-height:48px;max-width:100%}
.sign .sl{border-top:1px solid #111;padding-top:4px;font-size:12px;text-align:center}
.foot{margin:14px 0 0;font-size:11px;color:#5C6C7A;border-top:1px solid #D5DCE2;padding-top:6px}

/* diagramas (aplicativo) */
.diag{border:1px solid var(--line);border-radius:8px;margin:0 0 10px;background:#FAFBFC}
.diag>summary{padding:10px 12px;font-weight:600;cursor:pointer;min-height:44px;display:flex;align-items:center}
.diag>.dsteps,.diag>.dnota,.diag .irow{margin-left:12px;margin-right:12px}
.dsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin-bottom:8px}
figure.dstep{margin:0;border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px}
figure.dstep.wide{grid-column:1/-1}
.dsvg svg{width:100%;height:auto;display:block}
.dstep.wide .dsvg svg{max-width:340px;margin:0 auto}
figure.dstep figcaption{font-size:13px;line-height:1.35;padding:4px 4px 2px;color:var(--ink2)}
figure.dstep figcaption b{color:var(--ink)}
.dnota{font-size:12.5px;color:var(--mute);margin-top:0;margin-bottom:10px}
.chkl{display:flex;gap:10px;align-items:center;font-size:15px}
input[type=checkbox]{width:22px;min-height:22px;height:22px;flex:none}
.eqblock{break-inside:auto}
.avoid{break-inside:avoid}

.concl{margin:10px 0 4px;padding:10px 12px;border-left:3px solid var(--acc);background:#F3F6FB;border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.5;color:var(--ink)}
.concl b{color:var(--acc)}
@media print{.concl{font-size:10.5pt;break-inside:avoid;background:#F3F6FB;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.chip button{border:0;background:none;padding:8px 12px;font-size:14px;color:var(--ink)}
.chip .x{padding:8px 11px;color:#B3261E;border-left:1px solid var(--line)}
.nota{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fff}
.notah{display:flex;align-items:center;gap:8px;margin-bottom:8px}.notah b{flex:1}
.nota textarea{min-height:76px}
/* fotos de ensaio */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:112px;background:#fff}
.slot.on{border-style:solid;padding:0;overflow:hidden}
.slot img{width:100%;height:100px;object-fit:cover;display:block}
.slot .sl{font-size:12.5px;font-weight:600;color:var(--ink);padding:0 2px}
.slot.on .sl{padding:0 8px;color:var(--acc)}
.slot.on input{margin:0 8px;width:calc(100% - 16px);font-size:13px}
.slot.on button{margin:0 8px 8px;border:0;background:none;color:#B3261E;font-size:13px;text-align:left}
.slb{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.tphb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tphb span{flex:1 1 180px;font-size:14px;font-weight:500}
.phk{font-size:11.5px;font-weight:600;color:var(--acc);padding:3px 8px 0}
@page{size:A4;margin:14mm 14mm 17mm;@bottom-right{content:"Página " counter(page) " de " counter(pages);font:8.5pt Barlow,Segoe UI,sans-serif;color:#5C6C7A}}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#fff;margin:0}
  .app{max-width:none;margin:0;padding:0;min-height:0}
  .pvbar,.toast,.ov{display:none!important}
  .doc{border:0;margin:0;padding:0;max-width:none;width:auto}
  .eqblock{break-before:page}
  .avoid,.chart,.photos,tr,figure.dstep,.ph{break-inside:avoid}
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="ovl"></div>
<input id="fcam" type="file" accept="image/*" capture="environment">
<input id="flib" type="file" accept="image/*" multiple>
<input id="flogo" type="file" accept="image/*">
<input id="flogog" type="file" accept="image/*">
<input id="fjson" type="file" accept="application/json,.json">
<script>
/* ===== Catálogo: tipos de subestação, equipamentos e ensaios ===== */
const ST = [
  { n: 'Conforme',     c: '#1E9A62', tc: '#FFFFFF' },
  { n: 'Atenção',      c: '#E0AE00', tc: '#1B1500' },
  { n: 'Não conforme', c: '#E8741A', tc: '#FFFFFF' },
  { n: 'Condenado',    c: '#C9303B', tc: '#FFFFFF' }
];

const R_MT   = { dir: 'min', t: [1000, 500, 100] };   // MΩ, isolação MT
const R_BT   = { dir: 'min', t: [100, 10, 1] };       // MΩ, isolação BT / secundários
const R_5410 = { dir: 'min', t: [1, 0.5, 0.1] };       // MΩ, NBR 5410 (mín. 0,5 MΩ até 500 V; 1 MΩ acima)
const R_WBT  = { dir: 'min', t: [500, 100, 10] };     // MΩ, enrolamento BT de transformador

const thermo = () => ({
  id: 'thermo', kind: 'val', title: 'Termografia (elevação de temperatura ΔT)', unit: '°C',
  instr: 'Câmera termográfica', dyn: true, rows: ['Conexões e terminais'],
  rule: { dir: 'max', t: [3, 15, 40] }, trend: 'up_bad'
});
const insp = items => ({ id: 'insp', kind: 'check', title: 'Inspeção visual e funcional', instr: 'Inspeção do técnico', items });
const irMT = rows => rows.map(l => ({ l, vt: 5000 }));

const CAT = {
  trafo_oleo: {
    n: 'Transformador a óleo', ab: 'TO',
    idf: [['fab','Fabricante'],['serie','Nº de série'],['ano','Ano de fabricação'],['kva','Potência (kVA)'],['classe','Classe de tensão (kV)'],['vat','Tensão AT (kV)'],['vbt','Tensão BT (V)'],['grp','Grupo de ligação'],['loc','Localização']],
    tests: [

function initTestData(t) {

    case 'val':    return { rows: t.rows.map(l => ({ l, v: '' })) };
    case 'ir':     return { t: '', rows: t.rows.map(r => ({ l: r.l, vt: String(r.vt), v: '', c: ['', '', '', '', '', '', '', ''] })) };
    case 'pi':     return { rows: t.rows.map(l => ({ l, a: '', b: '', c: ['', '', '', '', '', '', '', ''] })) };
    case 'phases': return { t: '', groups: t.groups.map(g => ({ l: g.l, v: ['', '', ''] })) };
    case 'dev':    return { rows: t.rows.map(l => ({ l, nom: '', m: t.cols.map(() => '') })) };
    case 'check':  return { items: t.items.map(l => ({ l, s: '' })) };
  }
}

const num = s => {
  if (s == null || s === '') return null;
  s = String(s).trim();
  const n = parseFloat(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s);
  return isFinite(n) ? n : null;
};
const fmt = (n, d = 2) => n == null || !isFinite(n) ? '—' : Number(n).toLocaleString('pt-BR', { maximumFractionDigits: d });

let SETTINGS = { empresa: 'KVAR Automattic', sub: 'Engenharia de Manutenção', grupo: 'Grupo AKS', cnpj: '', contato: '', logo: '', logoGrupo: '', eng: 'Eng. Euclides Neto', crea: 'CREA-PA 17184-D', ai: '', sigEng: '', rules: {} };

function ev(v, r) {
  if (v == null || isNaN(v)) return null;
  const [a, b, c] = r.t;
  if (r.dir === 'min') return v >= a ? 0 : v >= b ? 1 : v >= c ? 2 : 3;
  return v <= a ? 0 : v <= b ? 1 : v <= c ? 2 : 3;
}
function getRule(typeId, t, idx, base) {
  const key = typeId + '.' + t.id + (idx != null ? '#' + idx : '');
  const o = SETTINGS.rules && SETTINGS.rules[key];
  return o ? { dir: base.dir, t: o } : base;
}
function ruleTxt(r, unit) {
  const [a, b, c] = r.t, s = r.dir === 'min' ? '≥' : '≤';

const worst = (a, b) => a == null ? b : b == null ? a : Math.max(a, b);

function computeTest(eq, t) {

function computeEq(eq) {

/* Análise de engenheiro: achados, comparação com o ciclo anterior, causas prováveis e recomendações */
function analyzeEq(eq, comp, prevMap) {
  const def = CAT[eq.type], findings = [], cmp = [], causes = new Set(), recs = new Set();
  let nrows = 0, nbad = 0;
  comp.tests.forEach(({ t, res }) => {
    nrows += res.rows.length;
    res.rows.forEach(r => {
      if (r.st >= 1) {
        nbad++;

        if (CAUSES[t.id]) causes.add(CAUSES[t.id]);

      if (a < 5) { cmp.push({ w: 0, txt: `${base}, comportamento estável.` }); return; }
      const worse = (t.trend === 'down_bad' && dlt < 0) || (t.trend === 'up_bad' && dlt > 0) || (t.trend === 'both' && a >= 5);
      if (worse) {

        if (a >= 15 && CAUSES[t.id]) causes.add(CAUSES[t.id]);
        if (a >= 15 && RECS[t.id]) recs.add(RECS[t.id]);

  if (comp.st == null) resumo = `${name}: ainda sem ensaios registrados.`;
  else resumo = `${name}: ${ST[comp.st].n.toLowerCase()}. Foram avaliados ${nrows} parâmetros e ${nbad} ficaram fora do critério de conformidade.`;
  return { resumo, findings: findings.sort((a, b) => b.st - a.st), cmp, causes: [...causes], recs: [...recs], nrows, nbad };
}

function fmtDate(s) { if (!s) return ''; const d = new Date(s + 'T12:00:00'); return isNaN(d) ? s : d.toLocaleDateString('pt-BR'); }

function genLaudo(R, PREV) {
  const m = R.meta, sub = SUBTIPOS.find(s => s.id === m.tipo);
  const comps = R.eqs.map(e => ({ e, c: computeEq(e) }));
  const done = comps.filter(x => x.c.st != null);
  const overall = reportStatus(R);
  const P = [];
  P.push(`Em ${fmtDate(m.data) || 'data não informada'}, foi realizada manutenção elétrica${m.mtipo ? ' ' + m.mtipo.toLowerCase() : ''} na subestação${sub ? ' ' + sub.n.toLowerCase() : ''} de ${m.cliente || 'cliente não informado'}${m.unidade ? ', unidade ' + m.unidade : ''}, com inspeção visual e ensaios elétricos em ${R.eqs.length} equipamento(s): ${R.eqs.map(e => CAT[e.type].n.toLowerCase() + (e.tag ? ' ' + e.tag : '')).join('; ') || 'nenhum cadastrado'}.`);
  if (PREV) P.push(`Os resultados foram comparados com o relatório anterior (${fmtDate(PREV.meta.data) || 'data não informada'}) sempre que havia medição equivalente.`);
  else P.push('Este é o primeiro registro da subestação neste sistema. Os valores medidos passam a ser a linha de base para a análise de tendência nos próximos ciclos.');

    const worse = a.cmp.filter(x => x.w === 2);

    'Há equipamento(s) condenado(s) pelos critérios adotados. Recomenda-se avaliação imediata do engenheiro responsável sobre a continuidade da operação desses equipamentos.'

  P.push('Conclusão: ' + (overall == null ? 'sem dados suficientes para conclusão.' : concl[overall]));

/* relação de espiras teórica pelos dados de placa (por fase) */

  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Desvio da relação medida" font-family="Barlow,Segoe UI,sans-serif">`;
  [mx, 0, -mx].forEach(v => { s += `<line x1="${L}" y1="${ys(v)}" x2="${W - Rm}" y2="${ys(v)}" stroke="${v ? '#E3E9ED' : '#9AA9B6'}"/><text x="${L - 5}" y="${ys(v) + 3.5}" font-size="10" text-anchor="end" fill="#41566A">${fmt(v, 2)}</text>`; });
  if (lim) [lim, -lim].forEach(v => { s += `<line x1="${L}" y1="${ys(v)}" x2="${W - Rm}" y2="${ys(v)}" stroke="#122438" stroke-dasharray="5 4"/>`; });
  s += `<text x="${W - Rm}" y="${ys(lim || 0) - 3}" font-size="10" text-anchor="end" fill="#122438">limite ±${fmt(lim || 0, 2)} %</text>`;
  bars.forEach((b, i) => {
    const x = L + step * i + (step - bw) / 2, yv = ys(b.d), ok = lim == null || Math.abs(b.d) <= lim, col = ok ? '#1E9B5A' : '#E0701F';
    s += `<rect x="${x}" y="${Math.min(y0, yv)}" width="${bw}" height="${Math.max(1, Math.abs(yv - y0))}" fill="${col}"/>`;
    s += `<text x="${x + bw / 2}" y="${b.d >= 0 ? yv - 3 : yv + 11}" font-size="10" font-weight="600" text-anchor="middle" fill="#122438">${fmt(b.d, 2)}</text>`;
    s += `<text x="${x + bw / 2}" y="${T + PH + 14}" font-size="10" text-anchor="middle" fill="#41566A" transform="rotate(-25 ${x + bw / 2} ${T + PH + 14})">${esc(trunc(b.l, 14))}</text>`;
  });
  return s + '</svg>';
}

function chartBlock(t, res, prevMap, eq) {
  const svg = chartSVG(res, prevMap, t), cv = res.curves && res.curves.length ? curveSVG(res.curves) : '', dv = t.kind === 'dev' && res.devs && res.devs.length ? devSVG(res.devs, res.limit && res.limit.v) : '';
  if (!svg && !cv && !dv) return '';
  let cap = 'A cor da barra segue a classificação; a linha tracejada marca o limite de conformidade.';
  if (t.kind === 'ir' && num(eq.d[t.id].t) != null) cap = 'Valores corrigidos para 20 °C. ' + cap;
  if (t.kind === 'phases') cap = 'Valores medidos por fase. A classificação considera ' + (t.metric === 'unbal' ? 'o desequilíbrio' : t.metric === 'dmin' ? 'o desvio entre fases' : 'a diferença entre fases') + '.';
  if (!res.limit && t.kind !== 'phases') cap = '';
  const dvf = dv ? `<figure class="chart">${dv}<figcaption>Desvio percentual de cada medida em relação à relação nominal. As linhas tracejadas marcam o limite de conformidade.</figcaption></figure>` : '';
  return dvf + (svg ? `<figure class="chart">${svg}${cap ? `<figcaption>${cap}</figcaption>` : ''}</figure>` : '') + (cv ? `<figure class="chart">${cv}<figcaption>Resistência de isolamento em função do tempo de aplicação da tensão (curva de absorção e polarização).</figcaption></figure>` : '');
}

function testResultHTML(t, res, prevMap, eq) {
  if (!res.rows.length) return '<p class="empty">Preencha os valores medidos para ver a classificação e o gráfico.</p>';
  const rows = res.rows.map(r => `<div class="rr"><div class="v"><b>${esc(r.l)}</b>${t.kind === 'check' ? '' : '<br>' + esc(r.val)}</div>${r.crit ? `<div class="crit">${esc(r.crit)}</div>` : ''}${sbar(r.st)}</div>`).join('');
  const ct = conclTest(eq, t, res, prevMap);
  return rows + chartBlock(t, res, prevMap, eq) + (ct ? `<div class="concl"><b>Conclusão técnica.</b> ${esc(ct)}</div>` : '');
}

/* ===== Banco local (IndexedDB com reserva em memória) ===== */
const DB = {
  db: null, mem: new Map(),
  open() {
    return new Promise(res => {
      try {
        const q = indexedDB.open('aks-subestacao', 1);
        q.onupgradeneeded = () => q.result.createObjectStore('reports', { keyPath: 'id' });
        q.onsuccess = () => { this.db = q.result; res(); };
        q.onerror = () => res();
      } catch (e) { res(); }
    });
  },
  req(mode, fn) {
    return new Promise((res, rej) => {
      const r = fn(this.db.transaction('reports', mode).objectStore('reports'));
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async all() { return this.db ? this.req('readonly', s => s.getAll()) : [...this.mem.values()]; },
  async get(id) { if (!id) return null; return this.db ? (await this.req('readonly', s => s.get(id))) || null : this.mem.get(id) || null; },
  async put(o) { if (this.db) await this.req('readwrite', s => s.put(o)); else this.mem.set(o.id, o); },
  async del(id) { if (this.db) await this.req('readwrite', s => s.delete(id)); else this.mem.delete(id); }
};

  const pt = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  c.addEventListener('pointerdown', e => { down = true; c._drawn = true; c.setPointerCapture(e.pointerId); const [a, b] = pt(e); x.beginPath(); x.moveTo(a, b); x.lineTo(a + .1, b + .1); x.stroke(); });
  c.addEventListener('pointermove', e => { if (!down) return; const [a, b] = pt(e); x.lineTo(a, b); x.stroke(); });
  c.addEventListener('pointerup', () => { down = false; });
  c.addEventListener('pointercancel', () => { down = false; });
}

}
function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }

/* ===== Início ===== */

  const list = S.list.map(r => {
    const st = reportStatus(r), m = r.meta, sub = SUBTIPOS.find(s => s.id === m.tipo);
    return `<div class="rep ${st == null ? '' : 'd' + st}"><button class="main" data-act="open" data-id="${r.id}"><b>${esc(m.cliente || 'Sem cliente')}</b><span>${esc(m.unidade || 'Sem unidade')}</span><span>${esc(fmtDate(m.data))}${sub ? ', ' + esc(sub.n) : ''}, ${r.eqs.length} equipamento(s)</span>${sbar(st)}</button>` +
      `<button class="btn sm" data-act="repmenu" data-id="${r.id}" aria-label="Mais ações">Opções</button></div>`;
  }).join('');
  return `<div class="hero"><div class="brand">${LOGO() ? `<img src="${LOGO()}" alt="">` : ''}<div><h1>Laudo de subestação</h1><p>${esc(SETTINGS.empresa)}, uma empresa do ${esc(SETTINGS.grupo)}</p></div></div>` +
    `<div class="actions"><button class="btn pri" data-act="new">Nova manutenção</button><button class="ib" data-act="settings">Configurações</button><button class="ib" data-act="import">Importar relatório</button></div></div>` +
    `<main>${list ? `<div class="hist">${list}</div>` : `<div class="sec empty-home"><h2>Nenhum relatório ainda</h2><p>Toque em Nova manutenção, escolha o tipo de subestação e os equipamentos. O laudo é montado enquanto você lança as medições.</p></div>`}</main>`;
}

/* ===== Edição ===== */
function tabsHTML() {
  const t = (id, label, st) => `<button class="tab ${S.tab === id ? 'on' : ''}" data-act="tab" data-v="${id}">${st === undefined ? '' : `<span class="dot ${st == null ? '' : 'd' + st}"></span>`}${esc(label)}</button>`;
  return t('geral', 'Geral') +
    R.eqs.map((e, i) => t(i, e.tag ? `${CAT[e.type].ab} ${e.tag}` : CAT[e.type].n, computeEq(e).st)).join('') +
    `<button class="tab" data-act="addeq">+ Equipamento</button>` + t('notas', 'Notas e recomendações') + t('resumo', 'Resumo e laudo', reportStatus(R));
}
function viewEdit() {
  const m = R.meta;
  return `<div class="top"><div class="bar"><button class="ib" data-act="home" aria-label="Voltar">Início</button><h1 id="ttl">${esc(m.cliente || 'Novo relatório')}<small>${esc(m.unidade || '')} <span id="sv">Salvo</span></small></h1><button class="ib solid" data-act="preview">Relatório</button></div>` +
    `<div class="uni" id="uni">${unifilar(R.eqs, true)}</div></div><nav class="tabs" id="tabs">${tabsHTML()}</nav><main id="tabc">${S.tab === 'geral' ? tabGeral() : S.tab === 'resumo' ? tabResumo() : S.tab === 'notas' ? tabNotas() : tabEq(S.tab)}</main>`;
}
function refreshChrome() { const u = $('#uni'), t = $('#tabs'); if (u) u.innerHTML = unifilar(R.eqs, true); if (t) t.innerHTML = tabsHTML(); }

function tabGeral() {
  const m = R.meta;
  const prevOpts = ['<option value="">Sem comparação</option>'].concat(S.list.filter(r => r.id !== R.id).map(r => `<option value="${r.id}" ${R.prevId === r.id ? 'selected' : ''}>${esc((r.meta.cliente || 'Sem cliente') + ', ' + (r.meta.unidade || '') + ', ' + fmtDate(r.meta.data))}</option>`)).join('');
  return `<section class="sec"><h2>Tipo de subestação</h2><p class="hint">Ao escolher o tipo, o app já sugere os equipamentos mais comuns. Você pode adicionar ou remover depois.</p><div class="types">${SUBTIPOS.map(s => `<button class="type ${m.tipo === s.id ? 'on' : ''}" data-act="settype" data-id="${s.id}"><b>${s.n}</b><span>${s.d}</span></button>`).join('')}</div></section>` +
    `<section class="sec"><h2>Identificação</h2><div class="grid">` +
    fld('Cliente', inp('meta.cliente', m.cliente)) + fld('Unidade ou planta', inp('meta.unidade', m.unidade)) + fld('Endereço', inp('meta.endereco', m.endereco), 'w2') +
    fld('Data da manutenção', inp('meta.data', m.data, { type: 'date' })) + fld('Ordem de serviço', inp('meta.os', m.os)) +
    fld('Tipo de manutenção', `<select data-b="meta.mtipo">${['Preventiva programada', 'Preditiva', 'Corretiva', 'Pós-instalação (comissionamento)'].map(o => `<option ${m.mtipo === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`) +
    fld('Tensão nominal (kV)', inp('meta.vn', m.vn, { num: 1 })) + fld('Potência instalada (kVA)', inp('meta.kva', m.kva, { num: 1 })) + `</div></section>` +
    `<section class="sec"><h2>Condições do ensaio</h2><div class="grid">` + fld('Temperatura ambiente (°C)', inp('meta.tamb', m.tamb, { num: 1 })) + fld('Umidade relativa (%)', inp('meta.ur', m.ur, { num: 1 })) + fld('Condição do tempo', inp('meta.clima', m.clima, { ph: 'Seco, nublado, chuva recente' })) + `</div></section>` +
    `<section class="sec"><h2>Responsáveis</h2><div class="grid">` + fld('Engenheiro responsável', inp('meta.eng', m.eng)) + fld('Registro profissional', inp('meta.crea', m.crea)) + fld('ART nº', inp('meta.art', m.art)) + fld('Técnico executante', inp('meta.tec', m.tec)) + fld('Acompanhante do cliente', inp('meta.acomp', m.acomp)) + `</div><div class="row-actions">${sigBtn('meta.sigEng', 'Assinatura do engenheiro', m.sigEng || SETTINGS.sigEng)}${sigBtn('meta.sigTec', 'Assinatura do técnico', m.sigTec)}</div></section>` +
    `<section class="sec"><h2>Opções do relatório</h2><label class="chkl"><input type="checkbox" data-b="meta.diag" ${m.diag === false ? '' : 'checked'}> Incluir os diagramas de ligação dos ensaios no relatório</label></section>` +
    `<section class="sec"><h2>Instrumentos utilizados</h2><p class="hint">Entram no relatório com número do certificado de calibração e validade.</p>` +
    R.instr.map((it, i) => `<div class="grid" style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)">${fld('Instrumento', inp(`instr.${i}.name`, it.name))}${fld('Nº de série', inp(`instr.${i}.serie`, it.serie))}${fld('Certificado de calibração', inp(`instr.${i}.cert`, it.cert))}${fld('Validade', inp(`instr.${i}.valid`, it.valid, { type: 'date' }))}<button class="btn dan sm" data-act="delinstr" data-i="${i}" style="align-self:end">Remover</button></div>`).join('') +
    `<div class="row-actions"><button class="btn" data-act="addinstr">Adicionar instrumento</button>${R.instr.length ? '' : '<button class="btn" data-act="definstr">Adicionar os instrumentos padrão</button>'}</div></section>` +
    `<section class="sec"><h2>Comparação com o ano anterior</h2><p class="hint">Escolha o relatório anterior desta subestação. Os gráficos e o laudo passam a mostrar a evolução de cada medição.</p>${fld('Relatório anterior', `<select data-b="prevId" data-reload="1">${prevOpts}</select>`)}</section>` +
    `<section class="sec"><h2>Fotos gerais</h2><p class="hint">Fachada, visão geral da subestação, placas de sinalização.</p>${photoBtns('g')}${photoGrid(R.fotos, 'fotos')}</section>` +
    `<div class="row-actions"><button class="btn dan" data-act="delrep">Excluir este relatório</button></div>`;
}

function photoBtns(target) {
  return `<div class="row-actions" style="margin-top:0"><button class="btn" data-act="cam" data-t="${target}">Tirar foto</button><button class="btn" data-act="lib" data-t="${target}">Escolher da galeria</button></div>`;
}
function photoGrid(arr, base) {
  if (!arr.length) return '';
  return `<div class="photos">${arr.map((p, i) => `<div class="ph"><img src="${p.src}" alt="Foto ${i + 1}">${p.kind ? `<div class="phk">${p.kind === 'op' ? 'Operador' : 'Instrumento'}</div>` : ''}<input data-b="${base}.${i}.cap" value="${esc(p.cap)}" placeholder="Legenda da foto"><button data-act="delphoto" data-base="${base}" data-i="${i}">Remover</button></div>`).join('')}</div>`;
}

/* ----- Aba do equipamento ----- */
function tabEq(i) {
  const eq = R.eqs[i]; if (!eq) return '';
  const def = CAT[eq.type], b = `eqs.${i}`;
  return `<section class="sec"><h2>${esc(def.n)}</h2><div class="grid">` + fld('Identificação (TAG)', inp(`${b}.tag`, eq.tag, { ph: 'Ex.: TR-01' })) +
    def.idf.map(f => f[0] === 'grp' ? fld(f[1], `<select data-b="${b}.idf.grp" data-rr="1">${Object.keys(GRUPOS).map(k => `<option ${grupoDe(eq) === k ? 'selected' : ''}>${k}</option>`).join('')}</select>`) : fld(f[1], f[0] === 'fab' ? inp(`${b}.idf.fab`, eq.idf.fab || '', { ph: 'Escolha ou digite' }).replace('<input ', '<input list="mfr" ') : inp(`${b}.idf.${f[0]}`, eq.idf[f[0]] || ''))).join('') + `</div>${eq.type.startsWith('trafo') ? `<figure class="dstep wide" style="margin:12px 0 0"><div class="dsvg">${phasorSVG(grupoDe(eq))}</div></figure>` : ''}<div class="row-actions"><button class="btn dan sm" data-act="deleq" data-i="${i}">Remover equipamento</button></div></section>` +
    modelosHTML(i, eq) + refHTML(i, eq) + def.tests.map(t => `<article class="test" id="t-${t.id}"><header><h3>${esc(t.title)}</h3><small>${esc(t.instr)}</small></header>${(() => { const dg = diagHTML(eq, t); return dg ? `<details class="diag"><summary>Como ligar o instrumento</summary>${dg}</details>` : ''; })()}${ttrHint(i, t, eq)}<div class="in">${testInputs(i, t, eq)}</div>${testPhotos(i, t, eq)}<div class="res" data-res="${t.id}"></div></article>`).join('') +
    `<section class="sec"><h2>Fotos do equipamento</h2>${photoBtns('e' + i)}${photoGrid(eq.photos, b + '.photos')}</section>` +
    `<section class="sec"><h2>Observações do técnico</h2><textarea data-b="${b}.obs" placeholder="Condições encontradas, intervenções realizadas, pendências">${esc(eq.obs)}</textarea></section>` +
    `<div class="ana" id="ana"></div>`;
}

function modelosHTML(i, eq) {
  eq.ref = eq.ref || {};
  const ms = SETTINGS.modelos.map((m, k) => [m, k]).filter(x => x[0].type === eq.type);
  return `<datalist id="mfr">${mfrList(eq.type).map(x => `<option value="${esc(x)}">`).join('')}</datalist><section class="sec"><h2>Modelos salvos</h2><p class="hint">Salve a identificação e os valores de fábrica deste equipamento como modelo. Na próxima vez é só tocar no modelo para preencher tudo.</p>` +
    (ms.length ? `<div class="chips">${ms.map(([m, k]) => `<span class="chip"><button data-act="usemodel" data-i="${i}" data-m="${k}">${esc(m.name)}</button><button class="x" data-act="delmodel" data-m="${k}" aria-label="Excluir modelo">×</button></span>`).join('')}</div>` : '') +
    `<div class="row-actions" style="margin-top:8px"><button class="btn sm" data-act="savemodel" data-i="${i}">Salvar este equipamento como modelo</button></div></section>`;
}
function normaAtiva(eq) {
  const f = (row) => { const r = netaRule(eq, { l: row }, {}); return r ? fmt(r.t[0], 0) : null; };
  if (eq.type.startsWith('trafo')) {
    const a = f('AT × Massa'), b = f('BT × Massa');
    return a && b ? `isolamento mínimo de ${a} MΩ no enrolamento AT e de ${b} MΩ no BT, a 20 °C (ANSI/NETA MTS, Tab. 100.5).` : 'preencha a tensão AT e a tensão BT acima para o app aplicar o mínimo da norma (ANSI/NETA MTS, Tab. 100.5).';
  }
  const x = f('');
  return x ? `isolamento mínimo de ${x} MΩ a 20 °C (ANSI/NETA MTS, Tab. 100.1).` : 'preencha a tensão nominal do equipamento para o app aplicar o mínimo da norma.';
}
function refHTML(i, eq) {
  const def = REFDEF[eq.type]; if (!def) return '';
  const b = `eqs.${i}.ref`;
  let calc = '';
  if (eq.type.startsWith('trafo')) {
    const s = num(eq.idf.kva), va = num(eq.idf.vat), vb = num(eq.idf.vbt);
    if (eq.idf.classe === '15') calc += `<p class="hint">Classe 15 kV: tensão suportável à frequência industrial de 34 kV e impulso atmosférico de 95 kV (ABNT NBR 5356-3).</p>`;
    if (s && va && vb) calc += `<p class="hint">Corrente nominal pelos dados de placa: AT ${fmt(s / (Math.sqrt(3) * va), 1)} A e BT ${fmt(s * 1000 / (Math.sqrt(3) * vb), 0)} A.${relTeorica(eq) ? ` Relação de espiras por fase: ${fmt(relTeorica(eq), 3)}.` : ''}</p>`;
  }
  return `<section class="sec"><h2>Valores de fábrica (opcional)</h2><p class="hint"><b>Pode deixar em branco.</b> Sem o relatório de fábrica, o app avalia pela norma: <span id="norma-ativa">${normaAtiva(eq)}</span> Se um dia você tiver o relatório de fábrica, preencha para o app também comparar com ele.</p>${calc}<div class="grid">` +
    def.map(f => f[2] ? fld(f[1], `<select data-b="${b}.${f[0]}">${f[2].map(o => `<option ${(eq.ref[f[0]] || f[2][0]) === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`) : fld(f[1], inp(`${b}.${f[0]}`, eq.ref[f[0]] || '', { num: 1 }))).join('') + `</div></section>`;
}
function ttrHint(i, t, eq) {
  if (t.id !== 'ttr' || !eq.type.startsWith('trafo')) return '';
  const rt = relTeorica(eq); if (!rt) return `<p class="hint" style="margin:6px 12px">Preencha tensão AT, tensão BT e grupo de ligação para calcular a relação teórica.</p>`;
  return `<div class="row-actions" style="margin:6px 12px"><button class="btn sm" data-act="usertheory" data-i="${i}">Usar relação teórica da placa: ${fmt(rt, 3)}</button></div>`;
}
function testPhotos(i, t, eq) {
  const d = eq.d[t.id]; d.ph = d.ph || [];
  const base = `eqs.${i}.d.${t.id}.ph`, key = `t:${i}:${t.id}`, sl = slotsFor(eq, t);
  const btns = k => `<button class="btn sm" data-act="cam" data-t="${key}:${k}">Câmera</button><button class="btn sm" data-act="lib" data-t="${key}:${k}">Galeria</button>`;
  const cards = sl.map(s => {
    const j = d.ph.findIndex(p => p.kind === s.k);
    if (j < 0) return `<div class="slot"><div class="sl">${esc(s.l)}</div><div class="slb">${btns(s.k)}</div></div>`;
    const p = d.ph[j];
    return `<div class="slot on"><img src="${p.src}" alt=""><div class="sl">${esc(s.l)}</div><input data-b="${base}.${j}.cap" value="${esc(p.cap)}" placeholder="Legenda da foto"><button data-act="delphoto" data-base="${base}" data-i="${j}">Remover</button></div>`;
  }).join('');
  const ext = d.ph.map((p, j) => [p, j]).filter(x => !sl.some(s => s.k === x[0].kind));
  const extra = ext.map(([p, j]) => `<div class="slot on"><img src="${p.src}" alt=""><div class="sl">Foto adicional</div><input data-b="${base}.${j}.cap" value="${esc(p.cap)}" placeholder="Legenda da foto"><button data-act="delphoto" data-base="${base}" data-i="${j}">Remover</button></div>`).join('');
  const filled = d.ph.length;
  return `<details class="diag tph"${filled ? ' open' : ''}><summary>Fotos do ensaio (${filled} de ${sl.length})</summary><div style="padding:0 12px 10px"><div class="slots">${cards}${extra}</div><div class="tphb" style="margin-top:10px"><span>Foto adicional</span>${btns('x')}</div></div></details>`;
}
function testInputs(i, t, eq) {
  const b = `eqs.${i}.d.${t.id}`, d = eq.d[t.id];
  if (t.kind === 'val') {
    return d.rows.map((r, j) => `<div class="irow ${t.dyn ? 'dyn' : ''}">${t.dyn ? inp(`${b}.rows.${j}.l`, r.l, { ph: 'Descrição do ponto', label: 'Descrição' }) : `<span class="rl">${esc(r.l)}</span>`}<div class="vi"><span>Valor (${t.unit})</span>${inp(`${b}.rows.${j}.v`, r.v, { num: 1 })}</div>${t.dyn ? (d.rows.length > 1 ? `<button class="x" data-act="delrow" data-eq="${i}" data-t="${t.id}" data-i="${j}" aria-label="Remover">×</button>` : '<span></span>') : ''}</div>`).join('') +
      (t.dyn ? `<button class="add" data-act="addrow" data-eq="${i}" data-t="${t.id}">Adicionar ponto</button>` : '');
  }
  if (t.kind === 'ir') {
    return `<div class="grid" style="margin-bottom:8px">${fld('Temperatura do equipamento (°C)', inp(`${b}.t`, d.t, { num: 1, ph: 'Para corrigir a 20 °C' }))}</div>` +
      d.rows.map((r, j) => `<div class="irow"><span class="rl">${esc(r.l)}</span><div class="vi"><span>Tensão (V)</span>${inp(`${b}.rows.${j}.vt`, r.vt, { num: 1 })}</div><div class="vi"><span>Valor (MΩ)</span>${inp(`${b}.rows.${j}.v`, r.v, { num: 1 })}</div></div><details class="diag" style="margin:-2px 0 10px"><summary>Curva resistência × tempo, ${esc(r.l)}</summary><div class="irow" style="grid-template-columns:repeat(4,1fr)">${PI_T.map((lb, k) => `<div class="vi"><span>${lb} (MΩ)</span>${inp(`${b}.rows.${j}.c.${k}`, (r.c || [])[k] || '', { num: 1 })}</div>`).join('')}</div><p class="dnota" style="margin:0 12px 10px">Opcional. Com as leituras de 30 s, 1 min e 10 min o app calcula DAR e IP e desenha o gráfico. Se o campo Valor ficar vazio, usa a leitura de 1 min.</p></details>`).join('');
  }
  if (t.kind === 'pi') {
    return d.rows.map((r, j) => `<div class="irow"><span class="rl">${esc(r.l)}</span><div class="vi"><span>1 min (MΩ)</span>${inp(`${b}.rows.${j}.a`, r.a, { num: 1 })}</div><div class="vi"><span>10 min (MΩ)</span>${inp(`${b}.rows.${j}.b`, r.b, { num: 1 })}</div></div>`).join('');
  }
  if (t.kind === 'phases') {
    return (t.temp ? `<div class="grid" style="margin-bottom:6px">${fld('Temperatura do enrolamento (°C)', inp(`${b}.t`, d.t, { num: 1 }))}</div>` : '') +
      d.groups.map((g, gi) => `<div class="gtitle">${esc(g.l)} (${t.unit})</div><div class="irow" style="grid-template-columns:repeat(3,1fr)">${t.groups[gi].labels.map((lb, j) => `<div class="vi"><span>${esc(lb)}</span>${inp(`${b}.groups.${gi}.v.${j}`, g.v[j], { num: 1 })}</div>`).join('')}</div>`).join('');
  }
  if (t.kind === 'dev') {
    return d.rows.map((r, j) => `<div class="gtitle">${t.dyn ? inp(`${b}.rows.${j}.l`, r.l, { label: 'Descrição' }) : esc(r.l)}</div><div class="irow ${t.dyn && d.rows.length > 1 ? 'dyn' : ''}" style="grid-template-columns:repeat(${t.cols.length + 1},1fr)${t.dyn && d.rows.length > 1 ? ' 44px' : ''}"><div class="vi"><span>${t.nomLabel || 'Nominal'}</span>${inp(`${b}.rows.${j}.nom`, r.nom, { num: 1 })}</div>${t.cols.map((c, k) => `<div class="vi"><span>${c}</span>${inp(`${b}.rows.${j}.m.${k}`, r.m[k], { num: 1 })}</div>`).join('')}${t.dyn && d.rows.length > 1 ? `<button class="x" data-act="delrow" data-eq="${i}" data-t="${t.id}" data-i="${j}" aria-label="Remover">×</button>` : ''}</div>`).join('') +
      (t.dyn ? `<button class="add" data-act="addrow" data-eq="${i}" data-t="${t.id}">${t.id === 'ttr' ? 'Adicionar tap' : 'Adicionar item'}</button>` : '');
  }
  if (t.kind === 'check') {
    return d.items.map((it, j) => `<div class="chk"><span>${esc(it.l)}</span><select data-b="${b}.items.${j}.s" aria-label="${esc(it.l)}"><option value="">Não avaliado</option>${[['ok', 'Conforme'], ['att', 'Atenção'], ['nok', 'Não conforme'], ['na', 'Não se aplica']].map(o => `<option value="${o[0]}" ${it.s === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></div>`).join('');
  }
  return '';
}

function refreshEq(i) {
  const eq = R.eqs[i]; if (!eq) return;
  const comp = computeEq(eq), pm = matchPrev(R, eq, PREV);
  comp.tests.forEach(({ t, res }) => {
    const box = $(`[data-res="${t.id}"]`), card = $(`#t-${t.id}`);
    if (box) box.innerHTML = testResultHTML(t, res, pm, eq);
    if (card) card.className = 'test' + (res.st == null ? '' : ' d' + res.st);
  });
  const ana = $('#ana'); if (ana) ana.innerHTML = anaHTML(analyzeEq(eq, comp, pm), !!pm);
  refreshChrome();
}

/* ----- Aba de resumo ----- */
function tabNotas() {
  R.notas = R.notas || [];
  return `<section class="sec"><h2>Notas e recomendações</h2><p class="hint">Registre o que apareceu em campo e não está nos ensaios. Exemplo: nota, ventilação forçada do transformador desativada; recomendação, verificar e reativar. Entra no relatório em uma página própria.</p>` +
    R.notas.map((n, i) => `<div class="nota"><div class="notah"><b>Nota ${i + 1}</b><select data-b="notas.${i}.p">${['Alta', 'Média', 'Baixa'].map(o => `<option ${(n.p || 'Média') === o ? 'selected' : ''}>${o}</option>`).join('')}</select><button class="btn dan sm" data-act="delnota" data-i="${i}">Remover</button></div>` +
      fld('Nota (o que foi encontrado)', `<textarea data-b="notas.${i}.n" placeholder="Ex.: Ventilação forçada do transformador encontra-se desativada">${esc(n.n || '')}</textarea>`) +
      fld('Recomendação', `<textarea data-b="notas.${i}.r" placeholder="Ex.: Verificar o circuito de comando e reativar a ventilação forçada">${esc(n.r || '')}</textarea>`) + `</div>`).join('') +
    `<div class="row-actions"><button class="btn" data-act="addnota">Adicionar nota</button></div></section>`;
}
function tabResumo() {
  ensureLaudo();
  const st = reportStatus(R), cnt = [0, 0, 0, 0];
  R.eqs.forEach(e => { const s = computeEq(e).st; if (s != null) cnt[s]++; });
  return `<section class="sec"><h2>Situação geral</h2><div class="overall"><div class="big">${st == null ? 'Sem dados' : ST[st].n}</div>${sbar(st)}</div><div class="cnt">${ST.map((s, k) => `<span style="background:${s.c};color:${s.tc}">${cnt[k]} ${s.n.toLowerCase()}</span>`).join('')}</div></section>` +
    `<section class="sec eqlist"><h2>Equipamentos</h2><div class="hist" style="margin-top:8px">${R.eqs.map((e, i) => { const s = computeEq(e).st; return `<div class="rep ${s == null ? '' : 'd' + s}" data-act="tab" data-v="${i}"><div class="main"><b>${esc(CAT[e.type].n)}</b><span>${esc(e.tag || 'Sem TAG')}</span>${sbar(s)}</div></div>`; }).join('') || '<p class="hint">Nenhum equipamento cadastrado.</p>'}</div></section>` +
    `<section class="sec"><h2>Texto do laudo</h2><p class="hint">Gerado automaticamente a partir das medições e do histórico. Você pode editar; se editar, o app não sobrescreve até você pedir.</p><textarea id="laudo" data-b="laudo.text" style="min-height:300px">${esc(R.laudo.text)}</textarea><div class="row-actions"><button class="btn" data-act="regen">Gerar texto novamente</button>${SETTINGS.ai ? '<button class="btn" data-act="ai">Refinar com IA</button>' : ''}<button class="btn pri" data-act="preview">Gerar relatório</button></div></section>`;
}

/* ----- Visualização / impressão ----- */
function viewPreview() {
  const ft = `${SETTINGS.empresa}, uma empresa do ${SETTINGS.grupo}. ${R.meta.cliente || ''}`.replace(/[\\"]/g, '').replace(/[<>&]/g, '');
  return `<style>@page{@bottom-left{content:"${ft}";font:8.5pt Barlow,Segoe UI,sans-serif;color:#5C6C7A}}</style><div class="pvbar"><button class="ib" data-act="back-edit">Voltar</button><b>Relatório</b><button class="ib solid" data-act="print">Imprimir ou salvar PDF</button></div><div class="doc">${docHTML(R, PREV)}</div>`;
}

/* ----- Configurações ----- */
function ruleEntries(typeId) {
  const out = [];
  CAT[typeId].tests.forEach(t => {
    if (t.kind === 'ir') {
      out.push({ key: `${typeId}.${t.id}`, label: `${t.title}, padrão`, r: t.rule, u: 'MΩ' });
      t.rows.forEach((r, i) => { if (r.rule) out.push({ key: `${typeId}.${t.id}#${i}`, label: `${t.title}, ${r.l}`, r: r.rule, u: 'MΩ' }); });
    } else if (t.rule) {
      const u = t.kind === 'pi' ? '' : t.kind === 'dev' ? '%' : t.kind === 'phases' ? (t.metric === 'range' ? t.unit : '%') : t.unit;
      out.push({ key: `${typeId}.${t.id}`, label: t.title, r: t.rule, u });
      if (t.abs) out.push({ key: `${typeId}.${t.id}#abs`, label: `${t.title}, valor absoluto máximo`, r: t.abs, u: t.unit });
    }
  });
  return out;
}
function viewSettings() {
  const c = SETTINGS;
  const sf = (label, k, o = {}) => fld(label, `<input data-s="${k}" value="${esc(c[k])}"${o.ph ? ` placeholder="${o.ph}"` : ''}>`, o.cls || '');
  return `<div class="top"><div class="bar"><button class="ib" data-act="home">Início</button><h1>Configurações</h1></div></div><main>` +
    `<section class="sec"><h2>Identidade da empresa</h2><p class="hint">Aparece na capa e no rodapé de todos os relatórios. A empresa é a responsável pela manutenção; o grupo aparece no canto oposto da capa.</p><div class="grid">${sf('Nome da empresa', 'empresa')}${sf('Complemento', 'sub')}${sf('Grupo', 'grupo')}${sf('CNPJ da empresa', 'cnpj')}${sf('Contato (telefone, e-mail)', 'contato')}${sf('Engenheiro responsável padrão', 'eng')}${sf('Registro profissional padrão', 'crea')}</div>` +
    `<div class="row-actions" style="align-items:center"><img src="${LOGO()}" alt="" style="height:44px;background:#fff;border:1px solid var(--line);padding:3px;border-radius:6px"><button class="btn" data-act="logo">Trocar logo da empresa</button>${c.logo ? '<button class="btn dan sm" data-act="dellogo">Voltar ao padrão</button>' : ''}</div>` +
    `<div class="row-actions" style="align-items:center"><img src="${LOGOG()}" alt="" style="height:44px;background:#fff;border:1px solid var(--line);padding:3px;border-radius:6px"><button class="btn" data-act="logog">Trocar logo do grupo</button>${c.logoGrupo ? '<button class="btn dan sm" data-act="dellogog">Voltar ao padrão</button>' : ''}</div></section>` +
    `<section class="sec"><h2>Assinatura padrão do engenheiro</h2><p class="hint">Usada em todos os relatórios novos. Você pode trocar em cada relatório.</p><div class="row-actions">${sigBtn('cfg.sigEng', 'engenheiro', c.sigEng)}${c.sigEng ? '<button class="btn dan sm" data-act="sigdelcfg">Remover</button>' : ''}</div></section>` +
    `<section class="sec"><h2>IA para o texto do laudo (opcional)</h2><p class="hint">O app já gera o texto do laudo com regras de engenharia, sem internet. Para refinar com um modelo de IA, informe o endereço do seu servidor intermediário. O app envia um POST em JSON com os campos system e prompt e espera um JSON com o campo text (ou uma resposta no formato da API de mensagens da Anthropic).</p>${sf('Endereço do servidor de IA', 'ai', { ph: 'https://...', cls: 'w2' })}</section>` +
    `<section class="sec"><h2>Critérios de conformidade</h2><p class="hint">Valores de referência iniciais. Ajuste conforme o procedimento da empresa, o manual do fabricante e a norma aplicável. Para valores mínimos, o semáforo usa o limite como “maior ou igual”; para máximos, como “menor ou igual”.</p>` +
    Object.keys(CAT).map(tid => `<details class="crit-det"><summary>${esc(CAT[tid].n)}</summary><div class="in"><div class="crow h"><span></span><span>Conforme</span><span>Atenção</span><span>Não conf.</span></div>${ruleEntries(tid).map(e => { const t = (c.rules[e.key] || e.r.t); return `<div class="crow"><span>${esc(e.label)}<br><small style="color:var(--mute)">${e.r.dir === 'min' ? 'mínimo' : 'máximo'}${e.u ? ', ' + e.u : ''}</small></span>${[0, 1, 2].map(k => `<input data-rule="${e.key}" data-k="${k}" data-dir="${e.r.dir}" inputmode="decimal" value="${t[k]}">`).join('')}</div>`; }).join('')}</div></details>`).join('') +
    `<div class="row-actions"><button class="btn" data-act="resetrules">Restaurar critérios padrão</button></div></section>` +
    `<section class="sec"><h2>Backup</h2><p class="hint">Os relatórios ficam salvos neste aparelho. Exporte um arquivo para guardar uma cópia ou levar a outro aparelho.</p><div class="row-actions"><button class="btn" data-act="exportall">Exportar todos os relatórios</button><button class="btn" data-act="import">Importar relatórios</button></div></section></main>`;
}

/* ===== Folha de seleção de equipamentos ===== */
function sheet(html) { $('#ovl').innerHTML = `<div class="ov" data-act="closesheet"><div class="sheet">${html}</div></div>`; }
function closeSheet() { $('#ovl').innerHTML = ''; }

/* ===== Fotos ===== */
async function toDataURL(file, max = 1280, q = .78) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg', q);
}
async function addPhotos(files) {
  if (!photoTarget || !files.length) return;
  let arr, kind = '', cap0 = '';
  if (photoTarget === 'g') arr = R.fotos;
  else if (photoTarget[0] === 't') {
    const [, i, tid, k] = photoTarget.split(':'), eq = R.eqs[+i], dd = eq.d[tid]; dd.ph = dd.ph || []; arr = dd.ph; kind = k;
    const tt = CAT[eq.type].tests.find(x => x.id === tid), sl = slotsFor(eq, tt).find(s => s.k === k);
    cap0 = sl ? sl.l : 'Foto adicional';
    if (sl) { const j = arr.findIndex(p => p.kind === k); if (j >= 0) arr.splice(j, 1); }
  }
  else arr = R.eqs[+photoTarget.slice(1)].photos;
  for (const f of files) { try { arr.push({ id: uid(), src: await toDataURL(f), cap: cap0, kind }); } catch (e) { toast('Não foi possível ler a imagem'); } }
  save(); rerender();
}

/* ===== Copiar para o próximo ciclo ===== */
function nextCycle(old) {
  const n = JSON.parse(JSON.stringify(old));
  n.id = uid(); n.created = n.updated = Date.now(); n.prevId = old.id; n.fotos = []; n.notas = []; n.laudo = { auto: true, text: '' };
  Object.assign(n.meta, { data: today(), os: '', tamb: '', ur: '', clima: '', art: '' });
  n.eqs.forEach(e => {
    e.obs = ''; e.photos = []; e.uid = uid();
    CAT[e.type].tests.forEach(t => {
      const d = e.d[t.id]; if (!d) return;
      if (d.t !== undefined) d.t = '';
      d.ph = [];
      (d.rows || []).forEach(r => { if ('v' in r) r.v = ''; if ('a' in r) { r.a = ''; r.b = ''; } if ('c' in r) r.c = ['', '', '', '', '', '', '', '']; if ('m' in r) r.m = r.m.map(() => ''); });
      (d.groups || []).forEach(g => { g.v = ['', '', '']; });
      (d.items || []).forEach(it => { it.s = ''; });
    });
  });
  return n;
}

/* ===== Eventos ===== */
document.addEventListener('input', onField);
document.addEventListener('change', e => { if (e.target.dataset.rule) onRule(e.target); else onField(e); });
function onField(e) {
  const el = e.target, d = el.dataset;
  if (d.s) { SETTINGS[d.s] = el.value; saveSettings(); return; }
  if (!d.b || !R) return;
  setPath(R, d.b, el.type === 'checkbox' ? el.checked : el.value);
  if (d.b === 'laudo.text') R.laudo.auto = false;
  save();
  if (d.reload) { openAfterPrev(); return; }
  if (d.rr) { rerender(); return; }
  if (d.b.startsWith('eqs.')) { const i = +d.b.split('.')[1]; if (S.tab === i) { refreshEq(i); const na = $('#norma-ativa'); if (na) na.textContent = normaAtiva(R.eqs[i]); } }
  else if (d.b === 'meta.cliente' || d.b === 'meta.unidade') { const t = $('#ttl'); if (t) t.firstChild.textContent = R.meta.cliente || 'Novo relatório'; const sm = $('#ttl small'); if (sm) sm.firstChild.textContent = R.meta.unidade + ' '; }
}
async function openAfterPrev() { PREV = await DB.get(R.prevId); }
function onRule(el) {
  const key = el.dataset.rule, k = +el.dataset.k;
  const all = [...document.querySelectorAll(`[data-rule="${CSS.escape(key)}"]`)].map(x => num(x.value));
  if (all.some(v => v == null)) { toast('Informe números válidos'); return; }
  const dir = el.dataset.dir, ok = dir === 'min' ? all[0] >= all[1] && all[1] >= all[2] : all[0] <= all[1] && all[1] <= all[2];
  if (!ok) { toast(dir === 'min' ? 'Use valores decrescentes: conforme, atenção, não conforme' : 'Use valores crescentes: conforme, atenção, não conforme'); return; }
  SETTINGS.rules[key] = all; saveSettings();
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  if (a === 'closesheet') { if (e.target === el) closeSheet(); return; }
  if (a === 'sheetx') { closeSheet(); return; }
  if (a === 'sig') { openSig(d.k); return; }
  if (a === 'sigclear') { const c = $('#sigc'); c.getContext('2d').clearRect(0, 0, c.width, c.height); c._drawn = false; return; }
  if (a === 'sigsave') {
    const c = $('#sigc'); if (!c._drawn) { toast('Faça a assinatura antes de salvar'); return; }
    const url = c.toDataURL('image/png');
    if (d.k === 'cfg.sigEng') { SETTINGS.sigEng = url; saveSettings(); } else { R.meta[d.k.split('.')[1]] = url; save(); }
    closeSheet(); render(); toast('Assinatura salva'); return;
  }
  if (a === 'sigdelcfg') { SETTINGS.sigEng = ''; saveSettings(); render(); return; }
  if (a === 'sigdel') { delete R.meta[d.k.split('.')[1]]; save(); rerender(); return; }
  if (a === 'home') return goHome();
  if (a === 'new') { R = newReport(); PREV = null; await DB.put(R); await refreshList(); S.view = 'edit'; S.tab = 'geral'; render(); return; }
  if (a === 'open') return openReport(d.id);
  if (a === 'settings') { S.view = 'settings'; render(); window.scrollTo(0, 0); return; }
  if (a === 'tab') { S.tab = d.v === 'geral' || d.v === 'resumo' || d.v === 'notas' ? d.v : +d.v; if (S.view !== 'edit') S.view = 'edit'; if (S.tab === 'geral') await refreshList(); render(); window.scrollTo(0, 0); const t = $('.tab.on'); if (t) t.scrollIntoView({ inline: 'center', block: 'nearest' }); return; }
  if (a === 'settype') {
    R.meta.tipo = d.id;
    if (!R.eqs.length) { SUBTIPOS.find(s => s.id === d.id).eq.forEach(t => R.eqs.push(newEq(t))); toast('Equipamentos típicos adicionados'); }
    save(); rerender(); refreshChrome(); return;
  }
  if (a === 'addeq') {
    sheet(`<h2>Adicionar equipamento</h2>${Object.keys(CAT).map(k => `<button class="pick" data-act="pickeq" data-k="${k}">${CAT[k].n}</button>`).join('')}`); return;
  }
  if (a === 'pickeq') { R.eqs.push(newEq(d.k)); closeSheet(); S.tab = R.eqs.length - 1; save(); render(); window.scrollTo(0, 0); return; }
  if (a === 'deleq') { if (!confirm('Remover este equipamento e todas as suas medições?')) return; R.eqs.splice(+d.i, 1); S.tab = 'geral'; save(); render(); return; }
  if (a === 'addrow') {
    const eq = R.eqs[+d.eq], t = CAT[eq.type].tests.find(x => x.id === d.t), dd = eq.d[t.id];
    if (t.kind === 'val') dd.rows.push({ l: '', v: '' }); else dd.rows.push({ l: `${t.id === 'ttr' ? 'Tap' : 'Item'} ${dd.rows.length + 1}`, nom: '', m: t.cols.map(() => '') });
    save(); rerender(); return;
  }
  if (a === 'delrow') { const eq = R.eqs[+d.eq]; eq.d[d.t].rows.splice(+d.i, 1); save(); rerender(); return; }
  if (a === 'cam' || a === 'lib') { photoTarget = d.t; $(a === 'cam' ? '#fcam' : '#flib').click(); return; }
  if (a === 'addnota') { R.notas = R.notas || []; R.notas.push({ n: '', r: '', p: 'Média' }); save(); rerender(); return; }
  if (a === 'delnota') { R.notas.splice(+d.i, 1); save(); rerender(); return; }
  if (a === 'savemodel') { const eq = R.eqs[+d.i], x = eq.idf, name = [x.fab, x.modelo, x.kva && x.kva + ' kVA', x.vat && x.vat + ' kV', x.vn && x.vn + ' kV'].filter(Boolean).join(' ') || CAT[eq.type].n;
    const idf = { ...x }; delete idf.serie; delete idf.ano; delete idf.loc;
    const j = SETTINGS.modelos.findIndex(m => m.type === eq.type && m.name === name), mm = { type: eq.type, name, idf, ref: { ...(eq.ref || {}) } };
    if (j >= 0) SETTINGS.modelos[j] = mm; else SETTINGS.modelos.push(mm); saveSettings(); rerender(); toast('Modelo salvo: ' + name); return; }
  if (a === 'usemodel') { const m = SETTINGS.modelos[+d.m], eq = R.eqs[+d.i]; if (!m) return; const keep = { serie: eq.idf.serie, ano: eq.idf.ano, loc: eq.idf.loc }; eq.idf = { ...m.idf, ...keep }; eq.ref = { ...m.ref }; save(); rerender(); toast('Modelo aplicado'); return; }
  if (a === 'delmodel') { SETTINGS.modelos.splice(+d.m, 1); saveSettings(); rerender(); return; }
  if (a === 'usertheory') { const eq = R.eqs[+d.i], rt = relTeorica(eq); if (rt) { eq.d.ttr.rows[0].nom = rt.toFixed(4).replace('.', ','); save(); rerender(); } return; }
  if (a === 'delphoto') { getPath(R, d.base).splice(+d.i, 1); save(); rerender(); return; }
  if (a === 'addinstr') { R.instr.push({ name: '', serie: '', cert: '', valid: '' }); save(); rerender(); return; }
  if (a === 'delinstr') { R.instr.splice(+d.i, 1); save(); rerender(); return; }
  if (a === 'definstr') { ['Megômetro', 'TTR', 'Ponte Kelvin', 'Micro-ohmímetro', 'Terrômetro', 'Câmera termográfica', 'Rigidômetro'].forEach(n => R.instr.push({ name: n, serie: '', cert: '', valid: '' })); save(); rerender(); return; }
  if (a === 'delrep') { if (!confirm('Excluir este relatório? Essa ação não pode ser desfeita.')) return; await DB.del(R.id); return goHome(); }
  if (a === 'regen') { R.laudo.auto = true; R.laudo.text = genLaudo(R, PREV); save(); rerender(); toast('Texto do laudo atualizado'); return; }
  if (a === 'preview') { S.view = 'preview'; render(); window.scrollTo(0, 0); return; }
  if (a === 'back-edit') { S.view = 'edit'; render(); return; }
  if (a === 'print') { window.print(); return; }
  if (a === 'ai') return askAI(el);
  if (a === 'repmenu') {
    const r = S.list.find(x => x.id === d.id);
    sheet(`<h2>${esc(r.meta.cliente || 'Relatório')}</h2><button class="pick" data-act="next" data-id="${r.id}">Criar manutenção do próximo ciclo a partir deste</button><button class="pick" data-act="export" data-id="${r.id}">Exportar este relatório</button><button class="pick" style="color:var(--s3)" data-act="delfromlist" data-id="${r.id}">Excluir</button>`); return;
  }
  if (a === 'next') { const old = await DB.get(d.id), n = nextCycle(old); await DB.put(n); closeSheet(); await openReport(n.id); toast('Novo ciclo criado. Preencha as medições de hoje'); return; }
  if (a === 'delfromlist') { if (!confirm('Excluir este relatório?')) return; await DB.del(d.id); closeSheet(); await refreshList(); render(); return; }
  if (a === 'export') { const r = await DB.get(d.id); download(`laudo-${(r.meta.cliente || 'subestacao').replace(/\W+/g, '-')}-${r.meta.data}.json`, JSON.stringify([r])); closeSheet(); return; }
  if (a === 'exportall') { download(`laudos-backup-${today()}.json`, JSON.stringify(await DB.all())); return; }
  if (a === 'import') { $('#fjson').click(); return; }
  if (a === 'logo') { $('#flogo').click(); return; }
  if (a === 'logog') { $('#flogog').click(); return; }
  if (a === 'dellogog') { SETTINGS.logoGrupo = ''; saveSettings(); render(); return; }
  if (a === 'dellogo') { SETTINGS.logo = ''; saveSettings(); render(); return; }
  if (a === 'resetrules') { if (!confirm('Restaurar todos os critérios para os valores padrão?')) return; SETTINGS.rules = {}; saveSettings(); render(); return; }
});

$('#fcam').addEventListener('change', e => { addPhotos([...e.target.files]); e.target.value = ''; });
$('#flib').addEventListener('change', e => { addPhotos([...e.target.files]); e.target.value = ''; });
$('#flogo').addEventListener('change', async e => { const f = e.target.files[0]; if (f) { SETTINGS.logo = await toDataURL(f, 400, .9); saveSettings(); render(); } e.target.value = ''; });
$('#flogog').addEventListener('change', async e => { const f = e.target.files[0]; if (f) { SETTINGS.logoGrupo = await toDataURL(f, 500, .9); saveSettings(); render(); } e.target.value = ''; });
$('#fjson').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const arr = JSON.parse(await f.text()), list = Array.isArray(arr) ? arr : [arr];
    let n = 0; for (const r of list) { if (r && r.id && r.meta && r.eqs) { await DB.put(r); n++; } }
    await refreshList(); render(); toast(n ? `${n} relatório(s) importado(s)` : 'Arquivo sem relatórios válidos');
  } catch (err) { toast('Arquivo inválido'); }
});
function download(name, text) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

async function askAI(btn) {
  btn.disabled = true; const old = btn.textContent; btn.textContent = 'Analisando…';
  try {
    const r = await fetch(SETTINGS.ai, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ system: AI_SYSTEM, prompt: aiPrompt(R, PREV) }) });
    const j = await r.json();
    const text = j.text || (j.content && j.content[0] && j.content[0].text) || '';
    if (!text) throw new Error('vazio');
    R.laudo.text = text; R.laudo.auto = false; save(); rerender(); toast('Texto refinado pela IA. Revise antes de assinar');
  } catch (e) { toast('Não foi possível falar com o servidor de IA'); btn.disabled = false; btn.textContent = old; }
}
/* ===== Inicialização ===== */
(async function () {
  loadSettings();
  await DB.open();
  await refreshList();
  render();
})();
